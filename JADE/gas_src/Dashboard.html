<div class="bg-surface text-on-surface font-body-md text-body-md overflow-hidden h-screen flex">
  
  <!-- SideNavBar -->
  <aside class="w-[280px] bg-primary-container flex flex-col h-full shrink-0 shadow-lg relative z-20 transition-all duration-300" id="main-sidebar">
    <div class="h-16 flex items-center justify-between px-6 border-b border-outline-variant/10 shrink-0">
      <div class="flex items-center sidebar-brand-content">
        <!-- Logo JADE Sidebar -->
        <img src="https://i.imgur.com/yj1Fn77.png" alt="Logo JADE" class="logo-sidebar-img sidebar-logo">
      </div>
      <button class="text-on-primary-container hover:opacity-80 transition-colors p-1 rounded-full hover:bg-on-primary-container/10 hidden md:block" onclick="toggleMainSidebarDesktop()">
        <span class="material-symbols-outlined">menu_open</span>
      </button>
    </div>
    
    <!-- Role Info -->
    <div class="px-6 py-5 border-b border-outline-variant/10 sidebar-user-info transition-all duration-300 flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-on-primary-container/10 text-on-primary-container flex items-center justify-center font-bold text-sm shrink-0 overflow-hidden border border-on-primary-container/20" id="sidebar-user-avatar">
        G
      </div>
      <div>
        <p class="text-xs font-label-bold text-on-primary-container uppercase tracking-wider mb-1 opacity-60" id="sidebar-rol-label">Cargando...</p>
        <p class="font-medium text-on-primary-container text-sm font-semibold leading-tight" id="sidebar-nombre-label"></p>
        <p class="text-[11px] text-on-primary-container opacity-80 mt-1 font-bold italic" id="sidebar-nivel-label"></p>
      </div>
    </div>
    
    <!-- Nav Links (Inyectado por JS) -->
    <nav class="flex-1 overflow-y-auto py-4 px-3 flex flex-col gap-1 sidebar-nav-container" id="sidebar-nav-links">
      <div style="text-align:center; padding:20px; color:gray;">Cargando menú...</div>
    </nav>
    
    <!-- Footer / User -->
    <div class="p-4 border-t border-outline-variant/10 shrink-0">
      <a class="flex items-center justify-center md:justify-start text-on-primary-container hover:opacity-80 p-2 rounded hover:bg-on-primary-container/10 transition-colors cursor-pointer" onclick="cerrarSesion()">
        <span class="material-symbols-outlined mr-3 text-[20px] sidebar-icon">logout</span>
        <span class="text-sm font-medium sidebar-text">Cerrar Sesión</span>
      </a>
    </div>
  </aside>
  
  <!-- Main Content Wrapper -->
  <main class="flex-1 flex flex-col h-full bg-surface-container-lowest overflow-hidden relative z-10 w-full transition-all duration-300">
    
    <!-- TopAppBar -->
    <header class="h-16 bg-white border-b border-outline-variant flex items-center justify-between px-6 shrink-0 z-10 shadow-sm transition-all duration-300" id="main-topbar">
      <div class="flex items-center gap-4">
        <!-- Toggle button for mobile -->
        <div class="flex items-center">
          <!-- Logo JADE Topbar -->
          <img src="https://i.imgur.com/IaoEKoN.png" alt="Logo JADE" class="logo-topbar-img hidden sm:block">
          <h1 class="font-headline-md text-xl font-bold text-primary tracking-tight" id="topbar-title-global">Sistema JADE</h1>
        </div>
      </div>
      
      <div class="flex items-center gap-4">
        <button id="btn-mensajeria-global" class="relative p-2 rounded-full hover:bg-surface-variant transition-colors" onclick="abrirModalMensajeria()" style="color:#111111;" title="Mensajería">
          <span class="material-symbols-outlined" style="color:#111111;">forum</span>
        </button>
        <button class="relative p-2 rounded-full hover:bg-surface-variant transition-colors" onclick="abrirCentroNotificaciones()" style="color:#111111;">
          <span class="material-symbols-outlined" style="color:#111111;">notifications</span>
          <span class="absolute -top-0.5 -right-0.5 min-w-[18px] h-[18px] bg-error text-white text-[10px] font-bold rounded-full flex items-center justify-center px-1 leading-none" id="notif-badge" style="display:none;">!</span>
        </button>
        <div class="h-8 w-px bg-outline-variant/50 hidden sm:block"></div>
        <div class="flex items-center gap-3 cursor-pointer hover:bg-surface-container-low p-1 pr-3 rounded-full transition-colors" onclick="abrirPerfil()">
          <div class="w-8 h-8 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center font-bold text-sm border border-secondary/20" id="topbar-user-initial">
            G
          </div>
          <span class="text-sm font-bold hidden sm:block" id="topbar-user-name" style="color:#111111;">Mi Perfil</span>
        </div>
      </div>
    </header>
    
    <!-- Area de Inyección Dinámica (vista-activa) -->
    <div id="vista-activa" class="flex-1 overflow-y-auto w-full h-full relative scroll-smooth">
      <div style="text-align:center; padding:50px; color:var(--primary-color); font-weight:bold; font-size:1.2rem;">Iniciando sistema...</div>
    </div>
    
  </main>
</div>

<!-- Mobile Overlay -->
<div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-10 hidden md:hidden" onclick="toggleMainSidebar()"></div>
