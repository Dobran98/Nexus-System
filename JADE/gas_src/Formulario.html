<div class="flex-1 overflow-y-auto p-6 lg:p-8 w-full h-full pb-24">

<div class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-5">

<div>

<div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-5">

<div class="grid grid-cols-1 md:grid-cols-3 gap-5">

<span class="material-symbols-outlined text-[20px] bg-primary/10 p-1.5 rounded-md">calendar_month</span>

<div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-5">

<div class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-5">

</select>

<select id="tipoActCategoria" class="w-full bg-white border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary rounded-lg p-2.5 text-sm text-on-surface transition-colors" required="" onchange="toggleOtroInput('tipoActCategoria')">
<option value="">Seleccione la categoría...</option>
<option value="Reunión">Reunión</option>
<option value="Asambleas">Asambleas</option>
<option value="Visitas">Visitas</option>
<option value="Jornadas">Jornadas</option>
<option value="Supervisión">Supervisión</option>
<option value="Diagnóstico">Diagnóstico</option>
<option value="Inauguraciones">Inauguraciones</option>
<option value="Formaciones">Formaciones</option>
<option value="Acompañamiento a Rendición de Cuentas">Acompañamiento a Rendición de Cuentas</option>
<option value="Acompañamiento a Proyectos">Acompañamiento a Proyectos</option>
<option value="Coordinación">Coordinación</option>
<option value="Atención a Denuncias">Atención a Denuncias</option>
<option value="Asesorías y Orientaciones">Asesorías y Orientaciones</option>

</select>

<div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-5">

</div>
</div>

<div class="grid grid-cols-2 gap-4 mt-3 mb-6">
<div>
<label class="block font-label-bold text-xs text-on-surface-variant uppercase tracking-wider mb-1.5">Comunas Vinculadas <span class="text-error">*</span></label>
