<div class="p-6 w-full h-full flex flex-col gap-6 overflow-hidden bg-surface-container-lowest">
  <!-- Encabezado y Exportaciones -->
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 shrink-0">
    <div>
      <h2 class="text-2xl font-bold text-primary">Listado de Actividades</h2>
      <p class="text-sm text-on-surface-variant mt-1">Gestiona tus planificaciones o revisa tu historial de
        evaluaciones.</p>
    </div>
    <div class="flex gap-2">
      <button onclick="abrirAgendaVirtual()"
        class="px-5 py-2.5 bg-primary text-on-primary font-bold rounded-lg shadow-md hover:bg-[#002113] transition-all flex items-center gap-2 text-sm">
        <span class="material-symbols-outlined text-[20px]">calendar_month</span> Generar Agenda Virtual
      </button>
    </div>
  </div>

  <!-- Contenedor Principal (Blanco con Bordes) -->
  <div class="flex-1 bg-white rounded-xl border border-outline-variant shadow-sm flex flex-col overflow-hidden">

    <!-- Pestañas (Tabs) -->
    <div class="flex border-b border-outline-variant bg-surface-container-low px-2 pt-2 gap-1 overflow-x-auto shrink-0">
      <button id="btn-tab-activas" onclick="mostrarTabMisActividades('activas')"
        class="px-5 py-2.5 text-sm font-bold bg-primary text-on-primary rounded-t-lg transition-colors flex items-center gap-2 whitespace-nowrap shadow-sm">
        ⏳ Actividades en Curso
      </button>
      <button id="btn-tab-historialAct" onclick="mostrarTabMisActividades('historialAct')"
        class="px-5 py-2.5 text-sm font-bold text-on-surface-variant hover:text-on-surface border-b-2 border-transparent hover:bg-surface-variant/50 rounded-t-lg transition-colors flex items-center gap-2 whitespace-nowrap">
        🗂️ Historial de Actividades
      </button>
      <button id="btn-tab-calendario" onclick="mostrarTabMisActividades('calendario')"
        class="px-5 py-2.5 text-sm font-bold text-on-surface-variant hover:text-on-surface border-b-2 border-transparent hover:bg-surface-variant/50 rounded-t-lg transition-colors flex items-center gap-2 whitespace-nowrap">
        📅 Calendario
      </button>
    </div>

    <!-- Filtros (Filas, Fechas y Buscador) -->
    <div class="p-3 border-b border-outline-variant flex flex-wrap justify-between items-center gap-4 bg-white shrink-0"
      id="filtros-container">
      <div class="flex items-center gap-3 text-sm text-on-surface-variant flex-wrap">
        <label class="flex items-center gap-1">Mostrar
          <select id="filas-por-pagina" onchange="cambiarFilasPorPagina()"
            class="border border-outline-variant rounded px-2 py-1 outline-none focus:border-primary bg-surface text-on-surface">
            <option value="10" selected>10</option>
            <option value="25">25</option>
            <option value="50">50</option>
          </select> filas
        </label>
        <div class="w-px h-4 bg-outline-variant hidden sm:block"></div>
        <label class="flex items-center gap-1 font-bold text-primary">Desde: <input type="date" id="filtro-fecha-inicio"
            onchange="filtrarMisActividades()"
            class="border border-outline-variant rounded px-2 py-1 outline-none text-on-surface font-normal bg-surface"></label>
        <label class="flex items-center gap-1 font-bold text-primary">Hasta: <input type="date" id="filtro-fecha-fin"
            onchange="filtrarMisActividades()"
            class="border border-outline-variant rounded px-2 py-1 outline-none text-on-surface font-normal bg-surface"></label>
      </div>
      <div class="relative w-full sm:w-64">
        <span
          class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant opacity-70 text-[18px]">search</span>
        <input type="text" id="search-mis-act" onkeyup="filtrarMisActividades()"
          placeholder="Buscar lugar, actividad..."
          class="w-full pl-9 pr-4 py-2 border border-outline-variant rounded-lg text-sm outline-none focus:ring-1 focus:ring-primary bg-surface text-on-surface transition-shadow">
      </div>
    </div>

    <!-- Área de la Tabla -->
    <div id="tab-tabla" class="flex-1 overflow-y-auto relative">
      <table class="w-full text-left border-collapse">
        <thead
          class="bg-primary-container/30 text-primary font-bold text-xs uppercase tracking-wider sticky top-0 z-10 shadow-sm backdrop-blur-sm">
          <tr>
            <th class="p-4 border-b border-primary/20">ID Actividad</th>
            <th class="p-4 border-b border-primary/20">Actividad</th>
            <th class="p-4 border-b border-primary/20">Fecha Plan</th>
            <th class="p-4 border-b border-primary/20">Lugar</th>
            <th class="p-4 border-b border-primary/20">Descripción Corta</th>
            <th class="p-4 border-b border-primary/20">Estatus</th>
            <th class="p-4 border-b border-primary/20 text-center">Acción</th>
          </tr>
        </thead>
        <tbody id="tabla-body" class="text-sm text-on-surface divide-y divide-outline-variant/30">
          <tr>
            <td colspan="7" class="text-center p-10 text-on-surface-variant font-medium">Cargando actividades...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Controles de Paginación -->
    <div id="controles-paginacion"
      class="p-3 border-t border-outline-variant bg-surface-container-low flex justify-between items-center text-sm text-on-surface-variant shrink-0">
      <span id="pag-info">Mostrando 0 al 0 de 0</span>
      <div class="flex items-center gap-2">
        <button id="btn-prev" onclick="cambiarPagina(-1)"
          class="px-3 py-1.5 font-bold text-primary hover:bg-surface-variant border border-transparent rounded transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-1"><span
            class="material-symbols-outlined text-[16px]">chevron_left</span> Anterior</button>
        <span id="pag-actual"
          class="font-bold text-on-primary-container bg-primary-container px-3 py-1 rounded-md">1</span>
        <button id="btn-next" onclick="cambiarPagina(1)"
          class="px-3 py-1.5 font-bold text-primary hover:bg-surface-variant border border-transparent rounded transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-1">Siguiente
          <span class="material-symbols-outlined text-[16px]">chevron_right</span></button>
      </div>
    </div>

    <!-- Área del Calendario -->
    <div id="tab-calendario" style="display: none;" class="flex-1 overflow-y-auto p-4 bg-white">
      <div id="calendario-interactivo" class="min-h-[500px]"></div>
    </div>

  </div>
</div>
