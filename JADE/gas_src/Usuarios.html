<div class="p-6 md:p-8 w-full h-full pb-24 overflow-y-auto bg-surface">
<div class="max-w-6xl mx-auto flex flex-col gap-6">

<!-- Header Details -->
<div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
<div>
<h2 class="font-headline-md text-2xl text-on-surface font-semibold tracking-tight">Directorio de Accesos</h2>
<p class="text-on-surface-variant text-sm mt-1">Administre los roles y permisos de los operadores y analistas.</p>
</div>
<button class="bg-primary hover:bg-[#002113] text-on-primary px-5 py-2.5 rounded-lg shadow-sm font-label-bold text-sm flex items-center gap-2 transition-colors" onclick="abrirModalNuevoUsuario()">
<span class="material-symbols-outlined text-[18px]">person_add</span> Nuevo Usuario
            </button>
</div>

<!-- Table Card -->
<div class="bg-white rounded-xl shadow-sm border border-outline-variant overflow-hidden flex flex-col">
<div class="bg-surface-container-low px-5 py-4 border-b border-outline-variant flex flex-col sm:flex-row justify-between items-center gap-4">
<div class="flex items-center gap-2 text-sm text-on-surface-variant">
<span>Mostrar</span>
<select id="filas-usuarios" onchange="cambiarFilasUsuarios()" class="bg-white border border-outline-variant rounded px-2 py-1 focus:ring-1 focus:ring-primary focus:border-primary outline-none cursor-pointer">
<option value="5">5</option>
<option value="10" selected>10</option>
<option value="20">20</option>
</select>
<span>filas</span>
</div>
<div class="relative w-full sm:w-64">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[18px]">search</span>
<input type="text" id="search-usuarios" class="w-full pl-9 pr-4 py-2 bg-white border border-outline-variant rounded-lg text-sm focus:ring-2 focus:ring-primary focus:border-primary transition-all placeholder:text-on-surface-variant/70 text-on-surface" placeholder="Buscar por nombre o estado..." onkeyup="filtrarUsuarios()">
</div>
</div>

<div class="overflow-x-auto">
<table class="w-full text-left border-collapse">
<thead class="bg-surface-container-lowest text-on-surface-variant font-label-bold text-xs uppercase border-b border-outline-variant">
<tr>
<th class="p-4">Nombre</th>
<th class="p-4">Usuario (Login)</th>
<th class="p-4">Rol</th>
<th class="p-4">Estado Asignado</th>
<th class="p-4 text-center">Acción</th>
</tr>
</thead>
<tbody id="tabla-usuarios" class="text-sm text-on-surface divide-y divide-outline-variant">
<tr><td colspan="5" class="p-8 text-center text-on-surface-variant font-medium">Cargando usuarios...</td></tr>
</tbody>
</table>
</div>

<div class="p-4 border-t border-outline-variant bg-surface-container-lowest flex justify-between items-center">
<div id="pag-info-usu" class="text-xs text-on-surface-variant font-medium">Mostrando 0 al 0 de 0</div>
<div class="flex items-center gap-2">
<button class="px-3 py-1.5 bg-white border border-outline-variant rounded-lg text-xs font-label-bold text-on-surface hover:bg-surface-variant transition-colors disabled:opacity-50 disabled:cursor-not-allowed" id="btn-prev-usu" onclick="cambiarPaginaUsuarios(-1)">Anterior</button>
<span id="pag-actual-usu" class="w-8 h-8 rounded-lg bg-primary text-on-primary flex items-center justify-center font-bold text-sm shadow-sm">1</span>
<button class="px-3 py-1.5 bg-white border border-outline-variant rounded-lg text-xs font-label-bold text-on-surface hover:bg-surface-variant transition-colors disabled:opacity-50 disabled:cursor-not-allowed" id="btn-next-usu" onclick="cambiarPaginaUsuarios(1)">Siguiente</button>
</div>
</div>
</div>

</div>
</div>
