    function recargarDatosModulo() {

      var vista = 'home';
      var param = '🏠 Menú Principal';
      
      // Detectar qué vista está activa por el título
      if (tit) {
        var t = tit.innerText;
        if (t.includes('Notificaciones')) { vista = 'misiones'; param = '🔔 Notificaciones y Solicitudes'; }
        else if (t.includes('Validar')) { vista = 'validaciones'; param = '✅ Validar Reportes'; }
        else if (t.includes('Mis Actividades') || t.includes('Calendario')) { vista = 'mis_actividades'; param = t; }
      }
      
      cargarVista(vista, param);
      Toast.fire({ icon: 'success', title: 'Datos actualizados', timer: 1500 });
    }

    function cargarVista(vista, param) {
      var cont = document.getElementById('vista-activa');
      if (cont) {
        cont.innerHTML = '<div style="text-align:center; padding:50px; color:var(--primary-color, #D35400); font-weight:bold; font-size:1.2rem; display:flex; flex-direction:column; align-items:center; gap:10px;"><span class="material-symbols-outlined animate-spin text-4xl">sync</span>Cargando módulo...</div>';
      }

      // Update Title
      var tit = document.getElementById('topbar-title-global');
      if (tit && param) tit.innerText = param;

      // Highlight sidebar link
      document.querySelectorAll('.nav-link').forEach(function (el) {
        el.classList.remove('bg-on-primary-container/10', 'text-on-primary-container', 'border-secondary');
        el.classList.add('text-on-primary-container/70', 'border-transparent');
      });
      var activeLink = document.getElementById('nav-' + vista);
      if (activeLink) {
        activeLink.classList.remove('text-on-primary-container/70', 'border-transparent');
        activeLink.classList.add('bg-on-primary-container/10', 'text-on-primary-container', 'border-secondary');

    function cargarEntregasPendientes(filtro) {
      google.script.run
        .withSuccessHandler(function (res) {
          if (!res || !res.exito) {
            var lista = document.getElementById('lista-revisiones-gestion');
            if (lista) lista.innerHTML = '<div class="text-center py-10 text-on-surface-variant text-sm">Error al cargar entregas.</div>';
            return;
          }
          datosRevisionesGlobal = res.datos || [];
          filtrarRevisiones(filtro || 'todas');
          var badge = document.getElementById('badge-gestion-pendientes');
          var pend = datosRevisionesGlobal.filter(function (e) { return e.estatus === 'Pendiente Revisión'; }).length;
          if (badge) { badge.innerText = pend; badge.style.display = pend > 0 ? 'inline-flex' : 'none'; }
        })
        .withFailureHandler(function (e) { console.warn('Entregas:', e.message); })
        .obtenerEntregasPendientes(usuarioGlobal.rol, usuarioGlobal.usuario);
    }

    function filtrarRevisiones(filtro) {
      ['todas', 'pendiente', 'aprobada', 'rechazada'].forEach(function (f) {
        var btn = document.getElementById('rev-filtro-' + f);
        if (!btn) return;
        if (f === filtro) { btn.classList.add('bg-secondary', 'text-on-secondary'); btn.classList.remove('bg-surface-container', 'text-on-surface'); }
        else { btn.classList.remove('bg-secondary', 'text-on-secondary'); btn.classList.add('bg-surface-container', 'text-on-surface'); }
      });
      var filtradas = datosRevisionesGlobal;
      if (filtro !== 'todas') {
        filtradas = datosRevisionesGlobal.filter(function (e) {
          return e.estatus.toLowerCase().indexOf(filtro) !== -1;
        });
      }
      renderListaRevisiones(filtradas);
    }

    // LÓGICA DEL CANDADO DE FECHAS (SPRINT 2)
    function validarFechasPlanificacion(fechaAct, tipoActividad) {
      if (!fechaAct) return "Debe seleccionar una fecha.";
      var partes = fechaAct.split('-'); var fAct = new Date(partes[0], partes[1] - 1, partes[2]); fAct.setHours(0, 0, 0, 0);
      var hoy = new Date(); hoy.setHours(0, 0, 0, 0);
      var diaSemana = hoy.getDay(); // 0:Dom, 1:Lun ... 5:Vie, 6:Sab

      var lunesEstaSemana = new Date(hoy); var dist = diaSemana === 0 ? 6 : diaSemana - 1; lunesEstaSemana.setDate(hoy.getDate() - dist);
      var domingoEstaSemana = new Date(lunesEstaSemana); domingoEstaSemana.setDate(lunesEstaSemana.getDate() + 6);

      var fmt = function (dObj) { var d = dObj.getDate(); var m = dObj.getMonth() + 1; return (d < 10 ? '0' : '') + d + '/' + (m < 10 ? '0' : '') + m; };

      if (tipoActividad === "Extraordinaria") {
        if (fAct < lunesEstaSemana || fAct > domingoEstaSemana) { return "Las actividades extraordinarias solo pueden cargarse en la semana en curso (del " + fmt(lunesEstaSemana) + " al " + fmt(domingoEstaSemana) + ")."; }
      } else {
        var proximoLunes = new Date(lunesEstaSemana); proximoLunes.setDate(lunesEstaSemana.getDate() + 7);
        var lunesArriba = new Date(proximoLunes); lunesArriba.setDate(proximoLunes.getDate() + 7);

        if (hoy.getDay() === 5 || hoy.getDay() === 6 || hoy.getDay() === 0) {
          if (fAct < lunesArriba) return "Cierre de ciclo: A partir del viernes, la planificación ordinaria debe ser para la semana de arriba (a partir del " + fmt(lunesArriba) + ").";
        } else {
          if (fAct < proximoLunes) return "La planificación ordinaria debe ser para semanas futuras (a partir del " + fmt(proximoLunes) + ").";
        }
      }
      return "OK";
    }

    function agendaEnRango(fecha, f) {
      if (!fecha) return false;
      var partes = fecha.split('-');
      if (partes.length !== 3) return false;
      var fAnio = parseInt(partes[0]), fMes = parseInt(partes[1]), fDia = parseInt(partes[2]);

      var anioSelect = document.getElementById('agenda-anio-select');
      var anioFiltro = anioSelect ? parseInt(anioSelect.value) : new Date().getFullYear();

      if (f.tipo === 'meses') {
        if (f.meses.length === 0) return false;
        if (fAnio !== anioFiltro) return false; // Validar año
        var coincideMes = f.meses.indexOf(fMes) !== -1;
        if (!coincideMes) return false;

        if (f.semanas.length > 0) {
          var sem = Math.ceil(fDia / 7);
          if (sem > 5) sem = 5;
          return f.semanas.indexOf(sem) !== -1;
        }
        return true;
      }

      if (f.tipo === 'rango' && f.inicio && f.fin) {
        return fecha >= f.inicio && fecha <= f.fin;
      }

      if (f.tipo === 'personalizado') {
        var ini = document.getElementById('agenda-fecha-inicio').value;
        var fin = document.getElementById('agenda-fecha-fin').value;
        if (ini && fecha < ini) return false;
        if (fin && fecha > fin) return false;
        return (ini || fin) ? true : false; // Si no hay fechas, no mostrar nada
      }
      return false;
    }

    function agendaDescargar(formato) {
      var f = window._agendaFiltros || {};
      if (f.tipo === 'personalizado') {
        var ini = document.getElementById('agenda-fecha-inicio'); var fin2 = document.getElementById('agenda-fecha-fin');
        f.inicio = ini ? ini.value : null; f.fin = fin2 ? fin2.value : null;

      cerrarAgendaBento();
      if (formato === 'pdf') generarPDF(f.inicio, f.fin, f);
      else generarExcelXLSX(f.inicio, f.fin, f);
    }

      doc.autoTable({ startY: 35, head: [['Fecha', 'Actividad', 'Lugar', 'Descripción', 'Estatus']], body: dataTabla, theme: 'grid', headStyles: { fillColor: [211, 84, 0] } });

          document.getElementById('ind-recurrente').value = res.datos.valRecurrente;
          document.getElementById('ind-nacional').value = res.datos.valNacional;
          document.getElementById('ind-presidencial').value = res.datos.valPresidencial;
          document.getElementById('ind-meta-part').value = res.datos.valMetaPart;
          document.getElementById('ind-meta-fam').value = res.datos.valMetaFam;
          document.getElementById('ind-evidencias').value = res.datos.valEvidencias;

    function calcularSumaIndicadores() {
      var maxImp = Math.max(Number(document.getElementById('ind-recurrente').value || 0), Number(document.getElementById('ind-nacional').value || 0), Number(document.getElementById('ind-presidencial').value || 0));
      var suma = maxImp + Number(document.getElementById('ind-meta-part').value || 0) + Number(document.getElementById('ind-meta-fam').value || 0) + Number(document.getElementById('ind-evidencias').value || 0);
      var msj = document.getElementById('suma-total');
      if (msj) { msj.innerText = suma; msj.style.color = (suma === 100) ? '#2e7d32' : (suma > 100 ? '#c62828' : '#ef6c00'); }
    }

    // --- MEJORA HISTORIAL (Global) ---
    function renderizarHistorialDetalle(texto, pagina) {
      if (!texto) return '<p class="text-xs text-gray-500">Sin historial.</p>';
      pagina = pagina || 1;
      var lineas = texto.split('\n').filter(function (l) { return l.trim() !== ""; });
      lineas.reverse();

      var hoy = new Date();
      var haceUnaSemana = new Date();
      haceUnaSemana.setDate(hoy.getDate() - 7);

      var lineasFiltradas = lineas.filter(function (l) {
        var match = l.match(/\[(\d{2})\/(\d{2})\/(\d{4})/);
        if (match) {
          var d = new Date(match[3], match[2] - 1, match[1]);
          return d >= haceUnaSemana;
        }
        return true;
      });

      var porPagina = 20;
      var total = lineasFiltradas.length;
      var totalPaginas = Math.ceil(total / porPagina);
      var inicio = (pagina - 1) * porPagina;
      var fin = inicio + porPagina;
      var paginadas = lineasFiltradas.slice(inicio, fin);

      var h = '<div class="flex flex-col gap-2 mt-2">';
      paginadas.forEach(function (l) {
        h += '<div style="font-size:0.75rem; padding:6px 10px; background:#fdfaff; border-left:3px solid #5e35b1; border-radius:4px; color:#444; line-height:1.2;">' + l + '</div>';
      });
      h += '</div>';

      if (totalPaginas > 1) {
        h += '<div class="flex items-center justify-center gap-4 mt-4 pt-2 border-t border-gray-100">';
        if (pagina > 1) h += '<button onclick="actualizarHistorialModal(' + (pagina - 1) + ')" class="text-xs font-black text-primary hover:underline">← ANTERIOR</button>';
        h += '<span class="text-[10px] font-bold text-gray-400">PÁG ' + pagina + ' / ' + totalPaginas + '</span>';
        if (pagina < totalPaginas) h += '<button onclick="actualizarHistorialModal(' + (pagina + 1) + ')" class="text-xs font-black text-primary hover:underline">SIGUIENTE →</button>';
        h += '</div>';
      }

      if (lineasFiltradas.length < lineas.length) {
        h += '<p class="text-[9px] text-gray-400 mt-2 text-center italic">Ocultando ' + (lineas.length - lineasFiltradas.length) + ' registros antiguos (más de 7 días).</p>';
      }
      return h;
    }

      // Clases Tailwind para botones activos e inactivos
      var claseActiva = "flex-1 py-2.5 text-xs font-bold text-primary border-b-2 border-primary transition-colors";
      var claseInactiva = "flex-1 py-2.5 text-xs font-bold text-on-surface-variant border-b-2 border-transparent hover:text-on-surface transition-colors";

      // 1. Modificar apariencia de los botones
      var btnContacto = document.getElementById("tab-btn-contacto");
      var btnHistorial = document.getElementById("tab-btn-historial");
      var btnInfo = document.getElementById("tab-btn-info");

      if (btnContacto) btnContacto.className = (tab === 'contacto') ? claseActiva : claseInactiva;
      if (btnHistorial) btnHistorial.className = (tab === 'historial') ? claseActiva : claseInactiva;
      if (btnInfo) btnInfo.className = (tab === 'info') ? claseActiva : claseInactiva;

      // 2. Modificar visibilidad de los paneles
      var panelContacto = document.getElementById("tab-contacto");
      var panelHistorial = document.getElementById("tab-historial");
      var panelInfo = document.getElementById("tab-info");

      if (panelContacto) panelContacto.style.display = (tab === 'contacto') ? 'flex' : 'none';
      if (panelHistorial) panelHistorial.style.display = (tab === 'historial') ? 'block' : 'none';
      if (panelInfo) panelInfo.style.display = (tab === 'info') ? 'block' : 'none';
    }

    // ==========================================
    // MENSAJERÍA
    // ==========================================
    window.chatActual = null;
    window.abrirModalMensajeria = function() {
      var m = document.getElementById('mega-modal-mensajeria');
      var rolesPermitidos = ['Admin', 'Analista', 'Operador'];
      if (m) {
        m.classList.remove('hidden');
        m.classList.add('flex');
        // Actualizar el botón de "Nuevo Chat" por si cambió el rol
        var btnCont = document.getElementById('nuevo-chat-btn-container');
        if (btnCont) {
           btnCont.innerHTML = (usuarioGlobal && rolesPermitidos.includes(usuarioGlobal.rol)) ? 
            '<button onclick="abrirModalNuevoChat()" class="mt-4 w-full py-2 bg-primary text-on-primary rounded-lg text-sm font-bold flex items-center justify-center gap-2 hover:bg-opacity-90 transition-colors shadow-sm"><span class="material-symbols-outlined text-[18px]">add_comment</span> Nuevo Chat</button>' : '';
        }
        cargarChatsActivos();
        return;
      }
      var btnNuevo = (usuarioGlobal && rolesPermitidos.includes(usuarioGlobal.rol)) ? 
        '<button onclick="abrirModalNuevoChat()" class="mt-4 w-full py-2 bg-primary text-on-primary rounded-lg text-sm font-bold flex items-center justify-center gap-2 hover:bg-opacity-90 transition-colors shadow-sm"><span class="material-symbols-outlined text-[18px]">add_comment</span> Nuevo Chat</button>' : '';
      var html = `
        <div id="mega-modal-mensajeria" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/60 backdrop-blur-sm transition-all duration-300">
          <div class="bg-surface w-full max-w-5xl h-[85vh] rounded-2xl shadow-2xl flex flex-col md:flex-row overflow-hidden border border-outline-variant transform transition-all">
            <!-- Sidebar: Lista de Chats -->
            <div class="w-full md:w-80 bg-surface-container-lowest border-b md:border-b-0 md:border-r border-outline-variant flex flex-col shrink-0">
              <div class="p-4 border-b border-outline-variant bg-surface-container-low flex justify-between items-center">
                <h2 class="text-lg font-bold text-on-surface flex items-center gap-2"><span class="material-symbols-outlined text-primary">forum</span> Mensajes</h2>
                <button onclick="cerrarModalMensajeria()" class="text-on-surface-variant hover:bg-surface-variant p-1 rounded-full"><span class="material-symbols-outlined">close</span></button>
              </div>
              <div class="px-4 py-2 border-b border-outline-variant/50 bg-surface">
                <div class="relative">
                  <span class="material-symbols-outlined absolute left-2 top-1/2 -translate-y-1/2 text-on-surface-variant/70 text-[18px]">search</span>
                  <input type="text" id="buscador-chats" placeholder="Buscar chats..." onkeyup="filtrarChats()" class="w-full pl-8 pr-3 py-1.5 bg-surface-container-low border border-outline-variant rounded-lg text-sm focus:ring-2 focus:ring-primary focus:outline-none">
                </div>
              </div>
              <div class="flex-1 overflow-y-auto p-2 space-y-1" id="lista-chats-container">
                <div class="text-center p-4 text-on-surface-variant text-sm"><span class="material-symbols-outlined animate-spin text-2xl">sync</span></div>
              </div>
              <div class="p-4 border-t border-outline-variant bg-surface-container-low" id="nuevo-chat-btn-container">
                ${btnNuevo}
              </div>
            </div>
            <!-- Contenido del Chat -->
            <div class="flex-1 bg-surface flex flex-col relative" id="chat-vista-container">
              <div class="flex-1 flex flex-col items-center justify-center text-on-surface-variant/50 p-8 text-center">
                <span class="material-symbols-outlined text-6xl mb-4">chat_bubble_outline</span>
                <p class="font-medium">Selecciona un chat para empezar a enviar mensajes</p>
              </div>
            </div>
          </div>
        </div>
      `;
      document.body.insertAdjacentHTML('beforeend', html);
      cargarChatsActivos();
    };

    window.cerrarModalMensajeria = function() {
      var m = document.getElementById('mega-modal-mensajeria');
      if (m) { m.classList.remove('flex'); m.classList.add('hidden'); }
    };

    window.usuariosCache = [];
    window.chatsActivosRaw = [];
    
    window.cargarChatsActivos = function() {
      var cont = document.getElementById('lista-chats-container');
      if (!cont) return;
      cont.innerHTML = '<div class="text-center p-4 text-on-surface-variant text-sm"><span class="material-symbols-outlined animate-spin text-2xl">sync</span></div>';
      
      // Aseguramos tener los usuarios para poder mostrar los nombres en los DMs
      if (window.usuariosCache.length === 0) {
        google.script.run.withSuccessHandler(function(res) {
          if (res && res.exito) window.usuariosCache = res.datos;
          ejecutarCargaChats();
        }).obtenerListaUsuarios();
      } else {
        ejecutarCargaChats();
      }

      function ejecutarCargaChats() {
        if (!usuarioGlobal || !usuarioGlobal.usuario) {
          cont.innerHTML = '<div class="p-4 text-on-surface-variant text-center text-sm">Cargando perfil de usuario...</div>';
          setTimeout(ejecutarCargaChats, 500);
          return;
        }

        google.script.run
        .withFailureHandler(function(err) {
          if (cont) cont.innerHTML = '<div class="p-4 text-error text-center text-sm">Error de conexión: ' + err.message + '</div>';
        })
        .withSuccessHandler(function(res) {
          if (!res) { 
            cont.innerHTML = '<div class="p-4 text-error text-center text-sm">Error: El servidor no devolvió datos (obtenerChats). Por favor, intenta de nuevo.</div>'; 
            return; 
          }
          if (!res.exito) { cont.innerHTML = '<div class="p-4 text-error text-center text-sm">' + res.mensaje + '</div>'; return; }
          if (res.datos.length === 0) { cont.innerHTML = '<div class="p-4 text-on-surface-variant text-center text-sm">No hay chats disponibles.</div>'; return; }
          window.chatsActivosRaw = res.datos;
          renderizarChatsActivos(res.datos);
        }).obtenerChats(usuarioGlobal.usuario, usuarioGlobal.rol);
      }
    };

    window.renderizarChatsActivos = function(lista) {
      var cont = document.getElementById('lista-chats-container');
      if (!cont) return;
      if (lista.length === 0) { cont.innerHTML = '<div class="p-4 text-on-surface-variant text-center text-sm">No se encontraron chats.</div>'; return; }
      var h = '';
      lista.forEach(c => {
        var tituloVisual = c.titulo;
        // Si es un Mensaje Directo, mostramos "Chat con [Nombre]"
        if (tituloVisual.startsWith('DM:')) {
          var partes = tituloVisual.split(':');
          var idOtro = (usuarioGlobal.usuario === c.creadoPor) ? partes[1] : c.creadoPor;
          var u = window.usuariosCache.find(x => x.usuario === idOtro);
          tituloVisual = u ? 'Chat con ' + u.nombre : 'Chat con ' + idOtro;
        }

        h += `
          <button onclick="abrirChat('${c.id}', '${tituloVisual}')" class="w-full text-left p-3 rounded-xl hover:bg-surface-variant transition-colors flex flex-col border border-transparent hover:border-outline-variant/50">
            <div class="flex justify-between items-start mb-1">
              <span class="font-bold text-sm text-on-surface line-clamp-1">${tituloVisual}</span>
              <span class="text-[10px] text-on-surface-variant shrink-0 ml-2">${c.fecha.split(' ')[0]}</span>
            </div>
            <span class="text-xs text-on-surface-variant">Creado por: ${c.creadoPor}</span>
          </button>
        `;
      });
      cont.innerHTML = h;
    };

    window.filtrarChats = function() {
      var q = document.getElementById('buscador-chats').value.toLowerCase();
      var filtrados = window.chatsActivosRaw.filter(c => c.titulo.toLowerCase().includes(q) || c.creadoPor.toLowerCase().includes(q) || (c.roles && c.roles.toLowerCase().includes(q)));
      renderizarChatsActivos(filtrados);
    };

    window.abrirModalNuevoChat = function() {
      Swal.fire({ title: 'Cargando usuarios...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      google.script.run.withSuccessHandler((res) => {
        Swal.close();
        var checkboxesUsuarios = '';
        if (res && res.exito && res.datos) {
          window.usuariosCache = res.datos;
          res.datos.forEach(u => {
            if(u.rol !== 'Responsable Estadal' && u.rol !== 'Responsable' && u.usuario !== usuarioGlobal.usuario) {
              checkboxesUsuarios += `
                <label class="flex items-center gap-3 p-2 rounded hover:bg-surface-variant cursor-pointer transition-colors">
                  <input type="checkbox" name="sw-users" value="${u.usuario}" class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary">
                  <div class="flex flex-col">
                    <span class="text-sm font-bold text-on-surface">${u.nombre}</span>
                    <span class="text-[10px] text-on-surface-variant uppercase">${u.rol}</span>
                  </div>
                </label>
              `;
            }
          });
        }
        
        Swal.fire({
          title: 'Crear Chat / Mensaje Directo',
          html: `
            <div class="text-left flex flex-col gap-1 max-h-[60vh] overflow-y-auto px-1">
              <label class="text-[10px] font-bold text-on-surface-variant uppercase tracking-widest ml-1">Nombre del Grupo</label>
              <input id="sw-chat-tit" class="w-full border border-outline-variant rounded-lg px-4 py-2 mb-4 outline-none focus:ring-2 focus:ring-primary/20" placeholder="Ej: Equipo de Análisis">
              
              <p class="text-[10px] font-bold text-on-surface-variant uppercase tracking-widest ml-1 mb-2">Roles Completos (Grupos):</p>
              <div class="grid grid-cols-1 gap-1 mb-4 bg-surface-container-lowest border border-outline-variant rounded-xl p-2">
                <label class="flex items-center gap-3 p-2 rounded hover:bg-surface-variant cursor-pointer transition-colors">
                  <input type="checkbox" name="sw-roles" value="Todos" class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary">
                  <span class="text-sm font-medium">Todos los Usuarios</span>
                </label>
                <label class="flex items-center gap-3 p-2 rounded hover:bg-surface-variant cursor-pointer transition-colors">
                  <input type="checkbox" name="sw-roles" value="Analista" class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary">
                  <span class="text-sm font-medium">Todos los Analistas</span>
                </label>
                <label class="flex items-center gap-3 p-2 rounded hover:bg-surface-variant cursor-pointer transition-colors">
                  <input type="checkbox" name="sw-roles" value="Operador" class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary">
                  <span class="text-sm font-medium">Todos los Operadores</span>
                </label>
              </div>

              <p class="text-[10px] font-bold text-on-surface-variant uppercase tracking-widest ml-1 mb-2">Usuarios Específicos (Directos/Grupos):</p>
              <div class="space-y-1 bg-surface-container-lowest border border-outline-variant rounded-xl p-2">
                ${checkboxesUsuarios}
              </div>
            </div>
          `,
          confirmButtonText: 'Crear Chat',
          showCancelButton: true,
          confirmButtonColor: '#D35400',
          width: '450px',
          preConfirm: () => {
            var tit = document.getElementById('sw-chat-tit').value.trim();
            var checksR = document.querySelectorAll('input[name="sw-roles"]:checked');
            var checksU = document.querySelectorAll('input[name="sw-users"]:checked');
            
            var participantes = [];
            checksR.forEach(c => participantes.push(c.value));
            checksU.forEach(c => participantes.push(c.value));
            
            if (participantes.length === 0) { Swal.showValidationMessage('Selecciona al menos un rol o usuario'); return false; }
            
            // Si es un DM (solo 1 usuario específico y ningún rol), generamos título automático
            if (checksR.length === 0 && checksU.length === 1) {
              tit = 'DM:' + checksU[0].value;
            } else if (!tit) {
              Swal.showValidationMessage('El nombre del grupo es requerido'); return false;
            }
            
            return { titulo: tit, participantes: participantes, creadoPor: usuarioGlobal.usuario };
          }
        }).then((r) => {
          if (r.isConfirmed && r.value) {
            Swal.fire({ title: 'Creando...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            google.script.run.withSuccessHandler((r2) => {
              Swal.close();
              if(!r2) { Toast.fire({ icon: 'error', title: 'No se recibió respuesta del servidor' }); return; }
              Toast.fire({ icon: r2.exito ? 'success' : 'error', title: r2.mensaje });
              if (r2.exito) cargarChatsActivos();
            }).crearChatTrabajo(r.value);
          }
        });
      }).obtenerListaUsuarios();
    };

    window.abrirChat = function(chatId, titulo) {
      window.chatActual = chatId;
      var cont = document.getElementById('chat-vista-container');
      if (!cont) return;
      cont.innerHTML = `
        <div class="h-14 border-b border-outline-variant bg-surface flex items-center px-6 shrink-0 shadow-sm z-10">
          <h3 class="font-bold text-on-surface text-lg flex items-center gap-2"><span class="material-symbols-outlined text-primary">chat</span> ${titulo}</h3>
        </div>
        <div id="chat-mensajes" class="flex-1 overflow-y-auto p-4 space-y-4 bg-surface-container-lowest">
          <div class="text-center p-4 text-on-surface-variant text-sm"><span class="material-symbols-outlined animate-spin text-2xl">sync</span></div>
        </div>
        <div class="p-4 bg-surface border-t border-outline-variant shrink-0">
          <form onsubmit="enviarMensajeUi(event)" class="flex gap-2">
            <input type="text" id="chat-input-msg" class="flex-1 bg-surface-container-low border border-outline-variant rounded-full px-5 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all" placeholder="Escribe un mensaje..." autocomplete="off">
            <button type="submit" class="w-12 h-12 bg-primary text-white rounded-full flex items-center justify-center hover:bg-opacity-90 transition-colors shadow-md disabled:opacity-50" id="btn-enviar-msg">
              <span class="material-symbols-outlined ml-1">send</span>
            </button>
          </form>
        </div>
      `;
      google.script.run.marcarMensajesComoLeidos(chatId, usuarioGlobal.usuario);
      cargarMensajes(chatId);
    };

    window.cargarMensajes = function(chatId) {
      var cont = document.getElementById('chat-mensajes');
      if (!cont) return;
      google.script.run.withSuccessHandler((res) => {
        if (!res) { cont.innerHTML = '<div class="p-4 text-error text-center text-sm">Error: No se pudieron cargar los mensajes.</div>'; return; }
        if (!res.exito) { cont.innerHTML = '<div class="p-4 text-error text-center text-sm">' + res.mensaje + '</div>'; return; }
        
        var msgs = res.datos || [];
        if (msgs.length === 0) {
          cont.innerHTML = '<div class="flex-1 flex flex-col items-center justify-center text-on-surface-variant/40 p-8 text-center"><span class="material-symbols-outlined text-5xl mb-2">auto_awesome</span><p>¡Inicia la conversación!</p></div>';
          return;
        }

        var h = '';
        msgs.forEach(m => {
          var soyYo = m.usuario === usuarioGlobal.usuario;
          var bg = soyYo ? 'bg-primary text-on-primary rounded-tr-none' : 'bg-surface-container-high text-on-surface rounded-tl-none';
          
          // Icono de estado (reloj, check, double check)
          var iconoEstado = '';
          if (soyYo) {
            if (m.leido === 'Si') {
              iconoEstado = '<span class="material-symbols-outlined text-[14px] text-primary-container" title="Leído">done_all</span>';
            } else {
              iconoEstado = '<span class="material-symbols-outlined text-[14px] opacity-70" title="Enviado">check</span>';
            }
          }

          h += `
            <div class="flex flex-col ${soyYo ? 'items-end' : 'items-start'}">
              <span class="text-[10px] text-on-surface-variant mb-1 px-2">${soyYo ? 'Tú' : m.usuario} (${m.rol})</span>
              <div class="px-4 py-2.5 rounded-2xl shadow-sm ${bg} text-sm whitespace-pre-wrap break-words inline-block relative group">
                ${m.mensaje}
                <div class="flex items-center gap-1 mt-1 justify-end opacity-70 text-[9px]">
                  <span>${m.fecha.split(' ')[1]}</span>
                  ${iconoEstado}
                </div>
              </div>
            </div>
          `;
        });
        cont.innerHTML = h;
        cont.scrollTop = cont.scrollHeight;
      }).obtenerMensajes(chatId);
    };

    window.enviarMensajeUi = function(e) {
      e.preventDefault();
      var input = document.getElementById('chat-input-msg');
      var btn = document.getElementById('btn-enviar-msg');
      var msg = input.value.trim();
      if (!msg || !window.chatActual) return;
      
      input.disabled = true;
      btn.disabled = true;
      btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span>';
      
      // UI Optimista: Añadir mensaje con reloj
      var cont = document.getElementById('chat-mensajes');
      if (cont) {
        var tempHtml = `
          <div class="flex flex-col items-end animate-pulse" id="msg-temp">
            <span class="text-[10px] text-on-surface-variant mb-1 px-2">Tú</span>
            <div class="px-4 py-2.5 rounded-2xl shadow-sm bg-primary/70 text-on-primary rounded-tr-none text-sm inline-block relative">
              ${msg}
              <div class="flex items-center gap-1 mt-1 justify-end opacity-70 text-[9px]">
                <span class="material-symbols-outlined text-[14px]">schedule</span>
              </div>
            </div>
          </div>
        `;
        cont.insertAdjacentHTML('beforeend', tempHtml);
        cont.scrollTop = cont.scrollHeight;
      }

      google.script.run.withSuccessHandler((res) => {
        input.disabled = false;
        btn.disabled = false;
        btn.innerHTML = '<span class="material-symbols-outlined ml-1">send</span>';
        
        if (!res) {
          Toast.fire({ icon: 'error', title: 'Error: No se pudo enviar el mensaje (respuesta vacía).' });
          var temp = document.getElementById('msg-temp'); if(temp) temp.remove();
          return;
        }
        
        if (res.exito) {
          input.value = '';
          var temp = document.getElementById('msg-temp'); if(temp) temp.id = 'msg-' + res.msgId; // Evitar duplicados
          cargarMensajes(window.chatActual);
        } else {
          Toast.fire({ icon: 'error', title: res.mensaje });
          var temp = document.getElementById('msg-temp'); if(temp) temp.remove();
        }
        input.focus();
      }).enviarMensajeChat(window.chatActual, msg, usuarioGlobal.usuario, usuarioGlobal.rol);
    };

  </script>
</body>

</html>
