<button id="theme-toggle-btn" class="btn btn-dark theme-btn-login" onclick="toggleTheme()" title="Cambiar Tema">
    <i class="fas fa-moon"></i>
</button>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-xl-10 col-lg-12 col-md-9">
            <div class="card o-hidden border-0 shadow-lg my-5">
                <div class="card-body p-0">
                    <div class="row">
                        <div class="col-lg-6 d-none d-lg-block bg-login-image"></div>
                        <div class="col-lg-6">
                            <div class="p-5">
                                <div class="text-center">
                                    <h1 class="h4 text-gray-900 mb-4">¡Bienvenido!</h1>
                                    <p>Sistema de Control de Asistencia</p>
                                </div>
                                <form class="user" id="login-form">
                                    <div class="form-group">
                                        <input type="email" class="form-control form-control-user" id="email" aria-describedby="emailHelp" placeholder="Ingresa tu correo electrónico..." required>
                                    </div>
                                    <div class="form-group">
                                        <input type="password" class="form-control form-control-user" id="password" placeholder="Contraseña" required>
                                    </div>
                                    <button type="submit" class="btn btn-primary btn-user btn-block">
                                        Iniciar Sesión
                                    </button>
                                </form>
                                <hr>
                                <div id="login-spinner" class="text-center" style="display: none;">
                                    <div class="spinner-border text-primary" role="status">
                                        <span class="sr-only">Loading...</span>
                                    </div>
                                </div>
                                <div id="login-error" class="text-center text-danger small" style="display: none;">
                                    Correo o contraseña incorrectos.
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
