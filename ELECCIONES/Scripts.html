<script>
  // ==========================================
  // 1. VARIABLES GLOBALES
  // ==========================================
  let session           = null;
  let minutosInactivos  = 0;
  let incidenciasVistas = 0;
  let catalogoComunas   = [];
  let ultimoDataBoletin = null;
  let dataMunicipalCache    = [];
  let municipalPuedeEditar  = false;
  let dataElectoralCache    = [];
  let _pendingSupAction     = null;   // Para el modal de supervisión
  window.avisoTimeout       = null;

  const HORAS_LABELS = ['9:00 AM','10:00 AM','11:00 AM','12:00 M','1:00 PM','2:00 PM','3:00 PM','4:00 PM','5:00 PM','6-8:00 PM'];
  const HORAS_KEYS   = ['h9','h10','h11','h12','h13','h14','h15','h16','h17','h20'];

  // ==========================================
  // 1.5 CONTROL DE MODALES CUSTOM
  // ==========================================
  window.abrirModal = function(id) {
    const el = document.getElementById(id);
    if (el) {
      el.classList.add('flex');
      el.classList.remove('hidden');
    }
  };

  window.cerrarModal = function(id) {
    const el = document.getElementById(id);
    if (el) {
      el.classList.remove('flex');
      el.classList.add('hidden');
    }
  };

  window.toggleDashboardPanel = function(contentId, btn) {
    const el = document.getElementById(contentId);
    if (!el) return;
    const isHidden = el.classList.toggle('hidden');
    const icon = btn.querySelector('.material-symbols-outlined');
    if (icon) {
      icon.innerText = isHidden ? 'keyboard_arrow_down' : 'keyboard_arrow_up';
    }
  };

  // ==========================================
  // 2. MODO OSCURO
  // ==========================================
  window.toggleTheme = function() {
    const isDark = document.documentElement.classList.toggle('dark');
    localStorage.setItem('sala_theme', isDark ? 'dark' : 'light');
    document.querySelectorAll('.theme-icon').forEach(icon => {
      icon.innerText = isDark ? 'light_mode' : 'dark_mode';
    });
  };

  // ==========================================
  // 3. EXPORTACIONES PDF / AUDITORÍA / EXCEL
  // ==========================================
  window.descargarPDF = function() {
    window.toggleLoader(true);
    Chart.defaults.animation = false;
    Chart.defaults.transitions.active.animation.duration = 0;
    const elemento = document.getElementById('zonaImpresionPDF');
    const estiloOriginal = elemento.style.cssText;
    elemento.style.maxHeight = 'none';
    elemento.style.overflow  = 'visible';
    const opt = {
      margin: 0.2,
      filename: 'INFORME_SALA_NACIONAL_' + new Date().toLocaleDateString() + '.pdf',
      image: { type: 'jpeg', quality: 0.95 },
      html2canvas: { scale: 1.5, useCORS: true, allowTaint: true, logging: false },
      jsPDF: { unit: 'in', format: 'legal', orientation: 'landscape' }
    };
    setTimeout(() => {
      html2pdf().set(opt).from(elemento).save()
        .then(() => {
          elemento.style.cssText = estiloOriginal;
          window.toggleLoader(false);
          Chart.defaults.animation = true;
          Chart.defaults.transitions.active.animation.duration = 1000;
          Swal.fire({ toast:true, position:'top-end', icon:'success', title:'PDF Generado', showConfirmButton:false, timer:2000 });
        })
        .catch(err => {
          elemento.style.cssText = estiloOriginal;
          window.toggleLoader(false);
          Chart.defaults.animation = true;
          Chart.defaults.transitions.active.animation.duration = 1000;
          Swal.fire('Error','No se pudo generar el PDF.','error');
        });
    }, 1000);
  };

  window.descargarAuditoriaCSV = function() {
    window.toggleLoader(true);
    google.script.run
      .withSuccessHandler(csv => {
        window.toggleLoader(false);
        const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement('a');
        a.href = url; a.download = 'AUDITORIA_SALA_NACIONAL_' + new Date().toLocaleDateString() + '.csv';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
      })
      .withFailureHandler(err => { window.toggleLoader(false); Swal.fire('Error', err.message, 'error'); })
      .generarCSVAuditoria(session.token);
  };

  window.descargarExcelMonitor = function() {
    window.toggleLoader(true);
    google.script.run
      .withSuccessHandler(data => {
        window.toggleLoader(false);
        if (!data || data.length < 2) return Swal.fire('Atención','No hay datos para exportar.','info');
        const wb = XLSX.utils.book_new();
        const ws = XLSX.utils.aoa_to_sheet(data);
        // 18 columnas: estado, municipio, 2 centros+%, 2 mesas+%, 9 horas, total
        ws['!cols'] = [
          {wch:15},{wch:20},{wch:10},{wch:12},{wch:9},
          {wch:10},{wch:10},{wch:9},
          {wch:8},{wch:8},{wch:8},{wch:8},{wch:8},{wch:8},{wch:8},{wch:8},{wch:8},
          {wch:12}
        ];
        XLSX.utils.book_append_sheet(wb, ws, 'Reporte Monitor');
        XLSX.writeFile(wb, 'REPORTE_MONITOR_' + new Date().toLocaleDateString().replace(/\//g,'-') + '.xlsx');
      })
      .withFailureHandler(err => { window.toggleLoader(false); Swal.fire('Error','No se pudo generar el Excel: '+err.message,'error'); })
      .obtenerDataExportacionMonitor(session.token);
  };

  // ==========================================
  // 4. UTILIDADES — LOADER Y RELOJ
  // ==========================================
  window.toggleLoader = function(s) {
    document.getElementById('loader').style.display = s ? 'flex' : 'none';
  };

  // BUG FIX: Array de 9 cortes + AM/PM correcto para 12 (mediodía)
  window.actualizarReloj = function() {
    const ahora  = new Date();
    const cortes = [9, 11, 12, 13, 14, 15, 16, 17, 20];
    let proximo  = null;

    for (let h of cortes) {
      let horaCorte = new Date();
      horaCorte.setHours(h, 0, 0, 0);
      if (ahora < horaCorte) { proximo = horaCorte; break; }
    }

    const box          = document.getElementById('proximoCorteBox');
    const timerDisplay = document.getElementById('timerDisplay');
    const labelCorte   = document.getElementById('labelCorte');

    if (proximo && timerDisplay) {
      const diff = proximo - ahora;
      const hh = Math.floor(diff / 3600000);
      const mm = Math.floor((diff % 3600000) / 60000);
      const ss = Math.floor((diff % 60000) / 1000);

      if (diff < 600000 && box) {
        box.style.backgroundColor = '#fff3cd'; box.classList.add('border-warning');
      } else if (box) {
        box.style.backgroundColor = ''; box.classList.remove('border-warning');
      }

      // BUG FIX: manejo correcto de AM/PM para 12 (mediodía) y 0 (medianoche)
      const h24 = proximo.getHours();
      let horaFormateada;
      if (h24 === 0)        horaFormateada = '12:00 AM';
      else if (h24 < 12)   horaFormateada = h24 + ':00 AM';
      else if (h24 === 12) horaFormateada = '12:00 PM';
      else                  horaFormateada = (h24 - 12) + ':00 PM';

      if (labelCorte) labelCorte.innerText = 'PRÓXIMO CORTE (' + horaFormateada + ')';
      timerDisplay.innerText = String(hh).padStart(2,'0') + ':' + String(mm).padStart(2,'0') + ':' + String(ss).padStart(2,'0');
    } else if (timerDisplay) {
      if (labelCorte) labelCorte.innerText = 'JORNADA CERRADA';
      timerDisplay.innerText = '00:00:00';
      timerDisplay.className = timerDisplay.className.replace('text-danger','text-muted');
    }
  };

  // ==========================================
  // 5. MOTOR DE SESIÓN E INACTIVIDAD
  // ==========================================
  const limiteCierre = 15;

  window.onload = () => {
    const savedTheme = localStorage.getItem('sala_theme') || 'dark';
    const isDark = (savedTheme === 'dark');
    if (isDark) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
    document.querySelectorAll('.theme-icon').forEach(icon => {
      icon.innerText = isDark ? 'light_mode' : 'dark_mode';
    });

    window.actualizarReloj();
    setInterval(window.actualizarReloj, 1000);

    const savedToken = localStorage.getItem('sala_token');
    const savedUser  = localStorage.getItem('sala_user');
    if (savedToken && savedUser) {
      window.toggleLoader(true);
      google.script.run
        .withSuccessHandler(valido => {
          if (valido) {
            session = { token: savedToken, user: JSON.parse(savedUser) };
            window.toggleLoader(false);
            window.mostrarDashboard();
          } else {
            localStorage.removeItem('sala_token'); localStorage.removeItem('sala_user');
            window.toggleLoader(false);
          }
        })
        .validarSesion(savedToken);
    }

    // Heartbeat (sesión + notificaciones)
    setInterval(() => {
      if (session && session.token) {
        google.script.run.withSuccessHandler(valido => {
          if (!valido) return window.logout();
          setTimeout(() => { window.actualizarNotificaciones(); window.verificarAvisos(); }, 2000);
        }).validarSesion(session.token);
      }
    }, 60000);

    // Auto-refresh de pestañas activas
    setInterval(() => {
      if (!session) return;
      const tm = document.getElementById('tab-monitor');
      const ta = document.getElementById('tab-admin');
      const tmu = document.getElementById('tab-municipal');
      if (tm  && tm.style.display  !== 'none') window.loadData();
      if (tmu && tmu.style.display !== 'none') window.loadMunicipal();
      if (ta  && ta.style.display  !== 'none') { window.actualizarListaUsuarios(); window.actualizarAuditoriaEnVivo(); }
    }, 300000);

    // Cierre por inactividad
    setInterval(() => {
      if (session) {
        minutosInactivos++;
        if (minutosInactivos >= limiteCierre) {
          window.logout();
          Swal.fire('Sesión Expirada','Cierre automático por inactividad.','info');
        }
      }
    }, 60000);
  };

  window.resetearInactividad = function() { minutosInactivos = 0; };
  document.onmousemove = window.resetearInactividad;
  document.onclick     = window.resetearInactividad;
  document.onkeypress  = e => {
    window.resetearInactividad();
    if (e.key === 'Enter' && document.getElementById('loginSection').style.display !== 'none') window.login();
  };

  // ==========================================
  // 6. LOGIN Y RUTEO DE ROLES
  // ==========================================
  window.login = function() {
    const u = document.getElementById('user').value.trim();
    const p = document.getElementById('pass').value.trim();
    if (!u || !p) return Swal.fire('Atención','Ingrese credenciales','warning');
    window.toggleLoader(true);
    google.script.run
      .withSuccessHandler(res => {
        window.toggleLoader(false);
        session = res;
        localStorage.setItem('sala_token', session.token);
        localStorage.setItem('sala_user',  JSON.stringify(session.user));
        window.mostrarDashboard();
      })
      .withFailureHandler(err => { window.toggleLoader(false); Swal.fire('Error', err.message, 'error'); })
      .iniciarSesion(u, p);
  };

  window.mostrarDashboard = function() {
    document.getElementById('loginSection').style.display  = 'none';
    document.getElementById('mainDashboard').style.display = 'block';
    const loginThemeToggle = document.getElementById('loginThemeToggle');
    if (loginThemeToggle) loginThemeToggle.style.display = 'none';
    document.getElementById('infoUser').innerHTML = '📍 ' + session.user.estado + ' | 👤 ' + session.user.rol;

    window.cargarEstadosSelectores();
    window.cargarCatalogoComunas();

    const rol  = session.user.rol;
    const tabs = ['btn-monitor','btn-municipal','btn-incidentes','btn-graficos','btn-admin','btn-metas','btn-condominios'];
    tabs.forEach(id => { 
      const el = document.getElementById(id); if (el) el.style.display = 'none'; 
      const elMob = document.getElementById(id + '-mobile'); if (elMob) elMob.style.display = 'none';
    });

    const expBtns = ['btnExportarMun','btnExportarCSVInc','btnExportarXLSXInc','btnExportarCondXLSX','btnAgregarCond'];
    expBtns.forEach(id => { const el = document.getElementById(id); if (el) el.style.display = 'none'; });

    if (rol === 'Admin' || rol === 'Analista') {
      tabs.forEach(id => { 
        const el = document.getElementById(id); if (el) el.style.display = 'flex'; 
        const elMob = document.getElementById(id + '-mobile'); if (elMob) elMob.style.display = 'block';
      });
      ['btnExportarCSVInc','btnExportarXLSXInc','btnExportarMun','btnExportarCondXLSX','btnAgregarCond'].forEach(id => {
        const el = document.getElementById(id); if (el) el.style.display = 'block';
      });
      window.showTab('monitor');
    } else if (rol === 'Operador Auxiliar') {
      ['btn-municipal','btn-incidentes'].forEach(id => { 
        const el = document.getElementById(id); if (el) el.style.display = 'flex'; 
        const elMob = document.getElementById(id + '-mobile'); if (elMob) elMob.style.display = 'block';
      });
      const em = document.getElementById('btnExportarMun'); if (em) em.style.display = 'block';
      window.showTab('municipal');
    } else if (rol === 'Operador') {
      ['btn-monitor','btn-incidentes','btn-municipal','btn-metas','btn-condominios'].forEach(id => { 
        const el = document.getElementById(id); if (el) el.style.display = 'flex'; 
        const elMob = document.getElementById(id + '-mobile'); if (elMob) elMob.style.display = 'block';
      });
      window.showTab('monitor');
    } else if (rol === 'Operador 0800' || rol === 'Estadal Auxiliar') {
      const bi = document.getElementById('btn-incidentes'); if (bi) bi.style.display = 'flex';
      const biMob = document.getElementById('btn-incidentes-mobile'); if (biMob) biMob.style.display = 'block';
      window.showTab('incidentes');
    } else if (rol === 'Estadal Reporte') {
      ['btn-monitor','btn-metas','btn-condominios'].forEach(id => { 
        const el = document.getElementById(id); if (el) el.style.display = 'flex'; 
        const elMob = document.getElementById(id + '-mobile'); if (elMob) elMob.style.display = 'block';
      });
      window.showTab('monitor');
    } else {
      ['btn-monitor','btn-incidentes','btn-metas'].forEach(id => { 
        const el = document.getElementById(id); if (el) el.style.display = 'flex'; 
        const elMob = document.getElementById(id + '-mobile'); if (elMob) elMob.style.display = 'block';
      });
      window.showTab('monitor');
    }

    window.verificarAvisos();
  };

  window.logout = function() {
    window.toggleLoader(true);
    google.script.run.withSuccessHandler(() => {
      session = null;
      localStorage.removeItem('sala_token');
      localStorage.removeItem('sala_user');
      document.getElementById('mainDashboard').style.display = 'none';
      document.getElementById('loginSection').style.display  = 'block';
      const loginThemeToggle = document.getElementById('loginThemeToggle');
      if (loginThemeToggle) loginThemeToggle.style.display = 'block';
      document.getElementById('user').value = '';
      document.getElementById('pass').value = '';
      window.toggleLoader(false);
    }).logoutManual(session ? session.token : '');
  };

  // BUG FIX: cargarTablaMetas() se llama cuando se entra a la pestaña metas
  window.showTab = function(id) {
    document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
    document.getElementById('tab-' + id).style.display = 'block';

    // Update active tab buttons (both desktop and mobile)
    const tabs = ['monitor','municipal','metas','incidentes','graficos','admin'];
    tabs.forEach(tKey => {
      const btn = document.getElementById('btn-' + tKey);
      if (btn) {
        if (tKey === id) {
          btn.classList.remove('text-on-surface-variant', 'hover:bg-surface-container-high', 'hover:text-on-surface');
          btn.classList.add('bg-primary-container', 'text-on-primary-container', 'font-bold', 'shadow-sm');
        } else {
          btn.classList.add('text-on-surface-variant', 'hover:bg-surface-container-high', 'hover:text-on-surface');
          btn.classList.remove('bg-primary-container', 'text-on-primary-container', 'font-bold', 'shadow-sm');
        }
      }
      // Also update mobile buttons
      const btnMob = document.getElementById('btn-' + tKey + '-mobile');
      if (btnMob) {
        if (tKey === id) {
          btnMob.classList.remove('text-on-surface-variant');
          btnMob.classList.add('text-primary', 'font-bold', 'bg-surface-container-high');
        } else {
          btnMob.classList.add('text-on-surface-variant');
          btnMob.classList.remove('text-primary', 'font-bold', 'bg-surface-container-high');
        }
      }
    });

    if (id === 'monitor')     window.loadData();
    if (id === 'municipal')   window.loadMunicipal();
    if (id === 'incidentes')  { window.loadIncidencias(); window.limpiarBadge(); }
    if (id === 'graficos')    window.renderizarGraficos();
    if (id === 'metas')       window.cargarTablaMetas();
    if (id === 'condominios') window.loadCondominios();
    if (id === 'admin')      {
      window.actualizarListaUsuarios();
      window.actualizarLedsMaestros();
      window.actualizarLedsDetallados();
      window.actualizarAuditoriaEnVivo();
    }
  };

  // ==========================================
  // 7. CATÁLOGO DE COMUNAS
  // ==========================================
  window.cargarCatalogoComunas = function() {
    google.script.run.withSuccessHandler(data => { catalogoComunas = data || []; }).obtenerCatalogoComunas();
  };

  window.actualizarComunasPorMunicipio = function() {
    const estadoSel = document.getElementById('incEstado').value.toUpperCase().trim();
    const munSel    = document.getElementById('incMunicipio').value.toUpperCase().trim();
    const selComuna = document.getElementById('incComuna');
    if (!selComuna) return;
    selComuna.innerHTML = '<option value="">-- COMUNA (Opcional) --</option>';
    if (!estadoSel || !munSel || catalogoComunas.length === 0) return;
    const munLimpio = munSel.replace(/^MP\.?\s*/i,'').trim();
    catalogoComunas
      .filter(c => {
        const cML = c.municipio.replace(/^MP\.?\s*/i,'').trim();
        return c.estado === estadoSel && (cML === munLimpio || c.municipio.includes(munLimpio) || munLimpio.includes(c.municipio));
      })
      .forEach(c => {
        let opt = document.createElement('option');
        opt.value = c.comuna; opt.innerText = c.comuna;
        selComuna.appendChild(opt);
      });
  };

  // ==========================================
  // 8. MONITOREO MUNICIPAL
  // ==========================================
  window.loadMunicipal = function() {
    window.toggleLoader(true);
    google.script.run
      .withSuccessHandler(res => {
        window.toggleLoader(false);
        const cont = document.getElementById('contenedorEstadosMunicipales');
        if (!res || !res.registros || res.registros.length === 0) {
          cont.innerHTML = '<div class="alert alert-light text-center w-100">No hay información municipal para mostrar.</div>';
          return;
        }
        dataMunicipalCache   = res.registros;
        municipalPuedeEditar = res.puedeEditar;
        const estados = [...new Set(res.registros.map(m => m.estado))].sort();
        cont.innerHTML = estados.map(edo => {
          const cant = res.registros.filter(m => m.estado === edo).length;
          return '<div class="bg-surface-container-high rounded-xl p-4 border border-white/5 shadow-md text-center hover:bg-surface-container-highest hover:border-primary/30 transition-all cursor-pointer group" onclick="window.abrirModalMunicipal(\'' + edo + '\')">' +
                 '<h5 class="font-bold text-primary text-sm tracking-tight mb-2 group-hover:text-secondary transition-colors uppercase">' + edo + '</h5>' +
                 '<span class="font-data-sm text-[10px] text-on-surface-variant bg-surface-container-lowest px-2.5 py-1 rounded border border-white/5 uppercase tracking-wider">' + cant + ' Municipios</span></div>';
        }).join('');
      })
      .withFailureHandler(err => {
        window.toggleLoader(false);
        document.getElementById('contenedorEstadosMunicipales').innerHTML =
          '<div class="alert alert-danger w-100">Error cargando municipal: ' + err.message + '</div>';
      })
      .obtenerDataMonitoreoMunicipal(session.user.estado, session.user.rol);
  };

  window.abrirModalMunicipal = function(estado) {
    const cuerpoModal = document.getElementById('modalMunicipalBody');
    const tituloModal = document.getElementById('modalMunicipalTitle');
    const btnGuardar  = document.getElementById('btnGuardarModalMun');
    const statusText  = document.getElementById('modalMunicipalStatus');
    tituloModal.innerText = 'Monitoreo: ' + estado;

    const registrosEstado = dataMunicipalCache.filter(m => m.estado === estado);
    const dis = municipalPuedeEditar ? '' : 'disabled';
    btnGuardar.style.display = municipalPuedeEditar ? 'inline-block' : 'none';
    statusText.innerText = municipalPuedeEditar ? '' : 'Modo Lectura';

    const horasLabel = ['9A','11A','12M','1P','2P','3P','4P','5P','6-8P'];

    let html = '<div class="grid grid-cols-1 gap-4">';
    registrosEstado.forEach(m => {
      let horasHtml = horasLabel.map((label, i) => {
        const key = HORAS_KEYS[i];
        return '<div class="flex flex-col items-center"><label class="font-data-sm text-[9px] text-outline-variant uppercase tracking-wider mb-0.5">' + label + '</label>' +
               '<input type="number" class="input-electoral text-center r-' + key + ' py-1 px-0.5 text-xs rounded border" style="width:40px;" value="' + (m[key]||0) + '" ' + dis + '></div>';
      }).join('');

      html += '<div class="w-full tarjeta-municipal" data-search="' + m.estado + ' ' + m.municipio + ' ' + m.cedula + ' ' + m.nombre + '">' +
              '<div class="bg-surface-container-high rounded-xl border border-white/5 border-l-4 border-secondary p-4 shadow-lg space-y-3">' +
              '<div class="flex items-center justify-between border-b border-white/5 pb-2">' +
              '<h6 class="font-bold text-secondary text-sm uppercase tracking-wide">' + m.municipio + '</h6></div>' +
              '<div class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs text-on-surface-variant">' +
              '<div class="sm:col-span-1 space-y-1"><div class="font-bold text-on-surface flex items-center gap-1">👤 ' + m.nombre + '</div>' +
              '<div>💳 C.I: ' + m.cedula + '</div>' +
              '<div>📞 Telf: ' + m.telefono + '</div></div>' +
              '<div class="sm:col-span-2 flex flex-col sm:flex-row items-center gap-4 justify-end">' +
              '<div class="flex flex-col items-center border-r border-white/5 pr-4"><label class="font-label-caps text-[9px] text-outline-variant uppercase tracking-wider mb-1">C. ACTIVOS</label>' +
              '<input type="number" class="input-electoral text-center font-bold text-sm w-16 py-1 rounded border i-act" value="' + m.cActivos + '" ' + dis + ' data-edo="' + m.estado + '" data-mun="' + m.municipio + '"></div>' +
              '<div class="flex-1 w-full"><div class="flex justify-around gap-1.5">' + horasHtml + '</div></div>' +
              '</div></div></div></div>';
    });
    html += '</div>';
    cuerpoModal.innerHTML = html;
    window.abrirModal('modalMunicipal');
  };

  window.guardarTodoMunicipal = function() {
    const tarjetas = document.querySelectorAll('#modalMunicipalBody .tarjeta-municipal');
    const data = [];
    tarjetas.forEach(t => {
      const act = t.querySelector('.i-act');
      if (act && !act.disabled) {
        const obj = { estado: act.getAttribute('data-edo'), municipio: act.getAttribute('data-mun'), cActivos: act.value };
        HORAS_KEYS.forEach(k => { obj[k] = (t.querySelector('.r-' + k) || {value:0}).value; });
        data.push(obj);
      }
    });
    if (data.length === 0) return Swal.fire('Atención','No hay datos editables para guardar.','warning');
    window.toggleLoader(true);
    google.script.run
      .withSuccessHandler(() => {
        window.toggleLoader(false);
        Swal.fire('Éxito','Monitoreo guardado.','success');
        window.cerrarModal('modalMunicipal');
        window.loadMunicipal();
      })
      .withFailureHandler(e => { window.toggleLoader(false); Swal.fire('Error', e.message, 'error'); })

  window.recalcularFila = function(input, tipo) {
    const fila = input.closest('tr');
    const claseTotal  = tipo === 'centros' ? '.cTotales' : '.mTotales';
    const claseFaltan = tipo === 'centros' ? '.cFaltan'  : '.mFaltan';
    const claseEfec   = tipo === 'centros' ? '.cEfec'    : '.mEfec';

    const total   = parseInt(fila.querySelector(claseTotal).innerText) || 0;
    let activos   = parseInt(input.value) || 0;
    if (activos > total) {
      Swal.fire({ toast:true, position:'top-end', icon:'error', title:'Límite Superado', text:'No exceder '+total+'.', showConfirmButton:false, timer:3000 });
      input.value = total; activos = total;
    }
    const faltan      = total - activos;
    const efectividad = total > 0 ? ((activos / total) * 100).toFixed(2) : '0.00';
    const colorEfec   = parseFloat(efectividad) >= 100 ? 'text-success' : parseFloat(efectividad) >= 50 ? 'text-warning' : 'text-danger';

    const spanF = fila.querySelector(claseFaltan);
    spanF.innerText   = faltan;
    spanF.className   = claseFaltan.substring(1) + ' fw-bold ' + (faltan > 0 ? 'text-danger' : 'text-success');

    const spanE = fila.querySelector(claseEfec);
    spanE.innerText = efectividad + '%';
    spanE.className = claseEfec.substring(1) + ' fw-bold ' + colorEfec;
  };

        } else if (formato === 'xlsx') {

  window.cargarEstadosSelectores = function() {
    const selAdmin   = document.getElementById('estadoMaestro');
    const selDet     = document.getElementById('estadoDetallado');
    const selInc     = document.getElementById('incEstado');
    const selGraf    = document.getElementById('selectGraficoMun');
    const selGrafH   = document.getElementById('selectGraficoHorasEdo');

    google.script.run.withSuccessHandler(res => {
      if (!res || !res.municipios) return;
      const estados  = [...new Set(res.municipios.map(m => m.estado))].sort();
      const opciones = estados.map(e => '<option value="'+e+'">'+e+'</option>').join('');

      if (selAdmin) selAdmin.innerHTML = '<option value="GLOBAL">🌐 CONTROL NACIONAL</option>' + opciones;
      if (selDet)   selDet.innerHTML   = '<option value="">-- SELECCIONE ESTADO --</option><option value="GLOBAL">🌐 GLOBAL (TODOS)</option>' + opciones;

      const r        = session.user.rol;
      const esGlobal = (r === 'Admin' || r === 'Analista' || r === 'Operador 0800' || r === 'Operador Auxiliar');

      if (selInc) {
        if (esGlobal) { selInc.innerHTML = '<option value="">-- SELECCIONE ESTADO --</option>'+opciones; selInc.disabled = false; }
        else {
          selInc.innerHTML = '<option value="'+session.user.estado+'">'+session.user.estado+'</option>';
          selInc.value = session.user.estado; selInc.disabled = true;
          setTimeout(() => window.actualizarMunicipiosPorEstado(), 500);

        selGraf.innerHTML = esGlobal ? '<option value="">-- SELECCIONE ESTADO --</option>'+opciones
                                     : '<option value="'+session.user.estado+'">'+session.user.estado+'</option>';
        if (!esGlobal) selGraf.value = session.user.estado;
      }
      if (selGrafH) {
        selGrafH.innerHTML = esGlobal ? '<option value="">-- SELECCIONE ESTADO --</option>'+opciones

      if (!banner || !textEl) return;

        tbody.innerHTML = '';
        const datos = Object.entries(res.porEstado);
        const filtrados = (session.user.rol === 'Admin' || session.user.rol === 'Analista')
          ? datos : datos.filter(d => d[0] === session.user.estado);
        if (filtrados.length === 0) { tbody.innerHTML = '<tr><td colspan="5" class="text-center">No hay datos para mostrar.</td></tr>'; return; }
        filtrados.forEach(([estado, d]) => {
          const votantes = d.votantes || 0;
          const meta     = d.meta     || 0;
          const pct      = meta > 0 ? ((votantes / meta) * 100).toFixed(2) : '0.00';
          const faltan   = meta - votantes;
          const colorF   = faltan > 0 ? 'text-danger' : 'text-success';
          const colorP   = parseFloat(pct) >= 100 ? 'text-success' : parseFloat(pct) >= 50 ? 'text-warning' : 'text-danger';
          tbody.innerHTML += `<tr>
            <td class="fw-bold ps-4 text-dark">${estado}</td>
            <td class="text-center fw-bold">${votantes.toLocaleString()}</td>
            <td class="text-center text-muted">${meta.toLocaleString()}</td>
            <td class="text-center fw-bold ${colorF}">${faltan > 0 ? faltan.toLocaleString() : '0 ✅'}</td>
            <td class="text-center fw-bold ${colorP}">${pct}%</td>
          </tr>`;
        });
      })
      .withFailureHandler(err => {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center text-danger fw-bold">ERROR: ${err.message}</td></tr>`;
        Swal.fire('Error Técnico','Error al cargar metas: '+err.message,'error');
      })
      .obtenerEstadisticas();
  };

  // ==========================================
  // 14. BOLETÍN WHATSAPP
  // ==========================================
  window.generarBoletinWhatsApp = function() {
    if (!ultimoDataBoletin) return Swal.fire('Atención','Aún no hay datos cargados.','warning');
    const d = ultimoDataBoletin;
    const totalMeta   = Object.keys(d.porEstado).reduce((a,e) => a + d.porEstado[e].meta,  0);
    const totalActual = Object.keys(d.porEstado).reduce((a,e) => a + d.porEstado[e].actual, 0);
    const pct         = totalMeta > 0 ? ((totalActual/totalMeta)*100).toFixed(2) : '0.00';
    const peorEdo     = d.semaforoEstados[0] ? d.semaforoEstados[0].estado : 'N/A';
    const peorPct     = d.semaforoEstados[0] ? d.semaforoEstados[0].pct    : '0.00';
    const totalInc    = d.topIncidenciasGlobal.data.reduce((a,b) => a+b, 0);
    const votNac      = HORAS_KEYS.reduce((s,k) => s+(d.nacionalHoras[k]||0), 0);

    const texto = '*📊 BOLETÍN EJECUTIVO SALA NACIONAL*\n' +
                  'Hora de corte: ' + new Date().toLocaleTimeString('es-VE',{hour:'2-digit',minute:'2-digit'}) + '\n\n' +
                  '🇻🇪 *Apertura Nacional:* ' + pct + '%\n' +
                  '🏢 *Centros Activos:* ' + totalActual + ' de ' + totalMeta + '\n' +
                  '🗳️ *Total Votantes Reportados:* ' + votNac.toLocaleString() + '\n\n' +
                  '🚨 *Alerta de Gestión (Más Rezagado):*\n' +
                  '- ' + peorEdo + ' (' + peorPct + '%)\n\n' +
                  '⚠️ *Incidencias Reportadas:* ' + totalInc + ' totales.\n\n' +
                  '_Generado automáticamente por el Sistema_';

    navigator.clipboard.writeText(texto).then(() => {
      Swal.fire({ toast:true, position:'top-end', icon:'success', title:'¡Boletín copiado!', showConfirmButton:false, timer:3000 });
    }).catch(() => Swal.fire('Error','No se pudo copiar el boletín.','error'));
  };


  // ==========================================
  // 15. MÓDULO CONDOMINIOS / URBANIZACIONES
  // ==========================================
  const COND_HORAS_KEYS   = ['h9','h10','h11','h12','h13','h14','h15','h16','h17','h20'];
  const COND_HORAS_LABELS = ['9AM','10AM','11AM','12M','1PM','2PM','3PM','4PM','5PM','6-8PM'];
  let condDataCache = [];
  let condPuedeEditar = false;
  let condPuedeAgregar = false;

  window.loadCondominios = function() {
    window.toggleLoader(true);
    google.script.run
      .withSuccessHandler(res => {
        window.toggleLoader(false);
        if (!res || res.error === 'HOJA_NO_EXISTE') {
          document.getElementById('tablaCondominios').innerHTML =
            '<tr><td colspan="15" class="text-center p-8 text-warning font-data-sm text-xs">⚠️ La hoja DB_CONDOMINIOS no existe. Inicialícela desde el Panel Admin.</td></tr>';
          return;
        }
        condDataCache    = res.registros || [];
        condPuedeEditar  = res.puedeEditar;
        condPuedeAgregar = res.puedeAgregar;

        // Actualizar botones según permisos
        const btnAg = document.getElementById('btnAgregarCond');
        if (btnAg) btnAg.style.display = condPuedeAgregar ? 'flex' : 'none';
        const btnEx = document.getElementById('btnExportarCondXLSX');
        if (btnEx) btnEx.style.display = condPuedeAgregar ? 'block' : 'none';

        // Calcular KPIs
        let totalVot = 0, totalReg = 0, sinRep = 0;
        condDataCache.forEach(c => {
          const v = COND_HORAS_KEYS.reduce((s, k) => s + (c[k] || 0), 0);
          totalVot += v;
          totalReg += c.totalReg || 0;
          if (v === 0) sinRep++;
        });
        const pct = totalReg > 0 ? ((totalVot / totalReg) * 100).toFixed(2) : '0.00';
        const k1 = document.getElementById('kpiCondTotal');    if (k1) k1.innerText = condDataCache.length.toLocaleString();
        const k2 = document.getElementById('kpiCondVotantes'); if (k2) k2.innerText = totalVot.toLocaleString();
        const k3 = document.getElementById('kpiCondPct');      if (k3) k3.innerText = pct + '%';
        const k4 = document.getElementById('kpiCondSinRep');   if (k4) k4.innerText = sinRep.toLocaleString();

        // Badge sidebar
        const badge = document.getElementById('badgeCondSinReporte');
        if (badge) { badge.innerText = sinRep; badge.style.display = sinRep > 0 ? 'inline-block' : 'none'; }

        // Renderizar tabla
        window.renderizarTablaCondominios();
      })
      .withFailureHandler(err => {
        window.toggleLoader(false);
        Swal.fire({ toast:true, position:'top-end', icon:'error', title:'Error cond.', text: err.message, showConfirmButton:false, timer:4000 });
      })
      .obtenerDataCondominios(session.user.estado, session.user.rol);
  };

  window.renderizarTablaCondominios = function() {
    const tbody = document.getElementById('tablaCondominios');
    if (!tbody) return;
    tbody.innerHTML = '';
    if (condDataCache.length === 0) {
      tbody.innerHTML = '<tr><td colspan="15" class="text-center p-8 text-on-surface-variant font-data-sm text-xs">No hay condominios registrados.</td></tr>';
      return;
    }
    const r = session.user.rol;
    const esGlobal = (r === 'Admin' || r === 'Analista');

    if (esGlobal) {
      // Agrupar por Estado
      const agrupado = condDataCache.reduce((acc, c) => { if (!acc[c.estado]) acc[c.estado]=[]; acc[c.estado].push(c); return acc; }, {});
      Object.keys(agrupado).sort().forEach((edo, i) => {
        const id = 'condo-edo-' + i;
        tbody.innerHTML += '<tr class="estado-header cursor-pointer font-bold text-primary hover:bg-surface-container-high transition-colors" onclick="window.toggleEstado(\'' + id + '\', this)">' +
          '<td colspan="15" class="ps-6 py-3 sticky-col text-left font-body-md text-sm border-b border-white/5">' +
          '<div class="flex items-center gap-2"><span class="material-symbols-outlined transition-transform duration-200" style="transform:rotate(-90deg);">expand_more</span>' +
          '<span class="status-dot green"></span><span>' + edo + ' (' + agrupado[edo].length + ' condominios)</span></div></td></tr>';
        agrupado[edo].forEach(c => { tbody.innerHTML += window.renderFilaCondominio(c, id, false); });
      });
    } else {
      condDataCache.forEach(c => { tbody.innerHTML += window.renderFilaCondominio(c, 'solo', true); });
    }
  };

  window.renderFilaCondominio = function(c, clase, visible) {
    const dis   = condPuedeEditar ? '' : 'disabled';
    const totalVot = COND_HORAS_KEYS.reduce((s, k) => s + (c[k] || 0), 0);
    const pct   = c.totalReg > 0 ? ((totalVot / c.totalReg) * 100).toFixed(1) : '0.0';
    const pctColor = parseFloat(pct) >= 100 ? 'text-tertiary' : parseFloat(pct) >= 50 ? 'text-warning' : 'text-error';

    const inputsHoras = COND_HORAS_KEYS.map(k =>
      '<td class="text-center p-1"><input type="number" class="input-electoral cond-h-' + k + '" value="' + (c[k]||0) + '" ' + dis + ' style="width:48px;"></td>'
    ).join('');

    const esAdmin = (session.user.rol === 'Admin' || session.user.rol === 'Analista');
    const btnReiniciar = esAdmin
      ? '<button class="btn-xs bg-error/15 border border-error text-error hover:bg-error/30 uppercase font-bold" title="Reiniciar datos" onclick="window.reiniciarCondFila(this)">↺</button>'
      : '';

    return '<tr data-estado="' + c.estado + '" data-municipio="' + c.municipio + '" data-cond="' + c.condominio + '" ' +
      'class="' + clase + ' condo-row hover:bg-white/5 transition-colors border-b border-white/5 text-right font-data-sm text-xs" style="display:' + (visible?'':'none') + '">' +
      '<td class="ps-8 py-2 text-left sticky-col border-r border-white/5">' +
        '<div class="font-bold text-on-surface text-xs">' + c.condominio + '</div>' +
        '<div class="text-[10px] text-on-surface-variant">' + c.municipio + (c.parroquia ? ' / ' + c.parroquia : '') + '</div>' +
        '<div class="text-[9px] text-outline-variant">' + (c.responsable !== 'No asignado' ? '👤 ' + c.responsable : '') + '</div>' +
      '</td>' +
      '<td class="p-2 text-center text-on-surface-variant font-bold text-xs">' + (c.totalReg||0).toLocaleString() + '</td>' +
      inputsHoras +
      '<td class="p-2 text-center font-bold text-on-surface">' + totalVot.toLocaleString() + '</td>' +
      '<td class="p-2 text-center font-bold ' + pctColor + '">' + pct + '%</td>' +
      '<td class="p-1 text-center">' +
        '<div class="flex items-center justify-center gap-1">' +
        '<button class="btn-xs bg-secondary/15 border border-secondary text-secondary hover:bg-secondary/25 uppercase font-bold" onclick="window.guardarFilaCondominio(this)">GUARD.</button>' +
        btnReiniciar +
        '</div>' +
      '</td></tr>';
  };

  window.guardarFilaCondominio = function(btn) {
    const tr = btn.closest('tr');
    const datos = [{
      estado:     tr.dataset.estado,
      municipio:  tr.dataset.municipio,
      condominio: tr.dataset.cond
    }];
    COND_HORAS_KEYS.forEach(k => { datos[0][k] = (tr.querySelector('.cond-h-' + k) || {value:0}).value; });
    window.toggleLoader(true);
    google.script.run
      .withSuccessHandler(() => { window.toggleLoader(false); Swal.fire({ title:'Guardado', icon:'success', timer:1000, showConfirmButton:false }); window.loadCondominios(); })
      .withFailureHandler(err => { window.toggleLoader(false); Swal.fire('Error', err.message, 'error'); })
      .guardarReporteCondominios(datos, session.user, session.token);
  };

  window.intentarGuardarCondominios = function() {
    const filas = document.querySelectorAll('#tablaCondominios .condo-row');
    const datos = [];
    filas.forEach(tr => {
      if (tr.style.display !== 'none') {
        const obj = { estado: tr.dataset.estado, municipio: tr.dataset.municipio, condominio: tr.dataset.cond };
        COND_HORAS_KEYS.forEach(k => { obj[k] = (tr.querySelector('.cond-h-' + k) || {value:0}).value; });
        datos.push(obj);
      }
    });
    if (datos.length === 0) return Swal.fire('Atención','No hay datos visibles.','warning');
    Swal.fire({ title:'¿Confirmar Guardado?', text:'Se actualizarán ' + datos.length + ' condominios.', icon:'question', showCancelButton:true, confirmButtonColor:'#28a745', confirmButtonText:'SÍ, GUARDAR TODO ✅' })
      .then(result => {
        if (result.isConfirmed) {
          window.toggleLoader(true);
          google.script.run
            .withSuccessHandler(() => { window.toggleLoader(false); Swal.fire({ title:'¡Actualizado!', icon:'success', timer:2000, showConfirmButton:false }); window.loadCondominios(); })
            .withFailureHandler(err => { window.toggleLoader(false); Swal.fire('Error', err.message, 'error'); })
            .guardarReporteCondominios(datos, session.user, session.token);
        }
      });
  };

  window.reiniciarCondFila = function(btn) {
    const tr = btn.closest('tr');
    const estado = tr.dataset.estado, municipio = tr.dataset.municipio, cond = tr.dataset.cond;
    Swal.fire({ title:'¿Reiniciar Condominio?', html:'<b>' + cond + '</b><br>Se pondrán TODOS los votos en 0.', icon:'warning', showCancelButton:true, confirmButtonColor:'#dc3545', confirmButtonText:'SÍ, REINICIAR ↺' })
      .then(result => {
        if (result.isConfirmed) {
          window.toggleLoader(true);
          google.script.run
            .withSuccessHandler(() => { window.toggleLoader(false); Swal.fire({ title:'Reiniciado', icon:'success', timer:1500, showConfirmButton:false }); window.loadCondominios(); })
            .withFailureHandler(err => { window.toggleLoader(false); Swal.fire('Error', err.message, 'error'); })
            .reiniciarCondominio(estado, municipio, cond, session.user, session.token);
        }
      });
  };

  window.filtrarTablaCondominios = function() {
    const input = document.getElementById('busquedaCond').value.toUpperCase();
    document.querySelectorAll('#tablaCondominios .condo-row').forEach(f => {
      f.style.display = f.innerText.toUpperCase().includes(input) ? '' : 'none';
    });
  };

  window.descargarExcelCondominios = function() {
    window.toggleLoader(true);
    google.script.run
      .withSuccessHandler(data => {
        window.toggleLoader(false);
        if (!data || data.length < 2) return Swal.fire('Sin datos','No hay condominios para exportar.','info');
        const wb = XLSX.utils.book_new();
        const ws = XLSX.utils.aoa_to_sheet(data);
        ws['!cols'] = [{wch:15},{wch:18},{wch:14},{wch:22},{wch:20},{wch:14},{wch:10},
          {wch:8},{wch:8},{wch:8},{wch:8},{wch:8},{wch:8},{wch:8},{wch:8},{wch:8},{wch:8},{wch:10},{wch:10}];
        XLSX.utils.book_append_sheet(wb, ws, 'Condominios');
        XLSX.writeFile(wb, 'CONDOMINIOS_' + new Date().toLocaleDateString().replace(/\//g,'-') + '.xlsx');
      })
      .withFailureHandler(err => { window.toggleLoader(false); Swal.fire('Error', err.message, 'error'); })
      .obtenerMatrizCondominiosExport(session.token);
  };

  window.abrirModalAgregarCondominio = function() {
    // Cargar estados en el selector del modal
    const selEdo = document.getElementById('condNuevoEstado');
    if (selEdo && selEdo.options.length <= 1) {
      google.script.run.withSuccessHandler(res => {
        if (!res || !res.municipios) return;
        const estados = [...new Set(res.municipios.map(m => m.estado))].sort();
        selEdo.innerHTML = '<option value="">-- ESTADO --</option>' +
          estados.map(e => '<option value="' + e + '">' + e + '</option>').join('');
      }).obtenerDataElectoral('AMAZONAS', 'Admin');
    }
    // Limpiar campos
    ['condNuevoParroquia','condNuevoNombre','condNuevoResp','condNuevoTel'].forEach(id => {
      const el = document.getElementById(id); if (el) el.value = '';
    });
    const tot = document.getElementById('condNuevoTotal'); if (tot) tot.value = '0';
    const munEl = document.getElementById('condNuevoMunicipio');
    if (munEl) munEl.innerHTML = '<option value="">-- MUNICIPIO --</option>';
    window.abrirModal('modalAgregarCondominio');
  };

  window.actualizarMunicipiosCond = function() {
    const estadoSel = document.getElementById('condNuevoEstado').value;
    const selMun = document.getElementById('condNuevoMunicipio');
    if (!estadoSel) { selMun.innerHTML = '<option value="">-- MUNICIPIO --</option>'; return; }
    google.script.run.withSuccessHandler(res => {
      if (!res || !res.municipios) return;
      const muns = [...new Set(res.municipios.filter(m => m.estado === estadoSel).map(m => m.municipio))].sort();
      selMun.innerHTML = '<option value="">-- MUNICIPIO --</option>' + muns.map(m => '<option value="' + m + '">' + m + '</option>').join('');
    }).obtenerDataElectoral(estadoSel, 'Admin');
  };

  window.guardarNuevoCondominio = function() {
    const datos = {
      estado:     document.getElementById('condNuevoEstado').value,
      municipio:  document.getElementById('condNuevoMunicipio').value,
      parroquia:  document.getElementById('condNuevoParroquia').value,
      condominio: document.getElementById('condNuevoNombre').value,
      responsable: document.getElementById('condNuevoResp').value,
      telefono:   document.getElementById('condNuevoTel').value,
      totalReg:   document.getElementById('condNuevoTotal').value
    };
    if (!datos.estado || !datos.municipio || !datos.condominio) {
      return Swal.fire('Atención','Estado, Municipio y Nombre son obligatorios.','warning');
    }
    window.toggleLoader(true);
    google.script.run
      .withSuccessHandler(() => {
        window.toggleLoader(false);
        Swal.fire({ title:'Condominio Agregado ✅', icon:'success', timer:1500, showConfirmButton:false });
        window.cerrarModal('modalAgregarCondominio');
        window.loadCondominios();
      })
      .withFailureHandler(err => { window.toggleLoader(false); Swal.fire('Error', err.message, 'error'); })
      .agregarCondominio(datos, session.user, session.token);
  };

  // ==========================================
  // 16. FUNCIONES ADMIN AUXILIARES (Condominios + Migración)
  // ==========================================
  window.inicializarCondominiosDB = function() {
    Swal.fire({
      title: '¿Inicializar DB_CONDOMINIOS?',
      html: 'Se creará la hoja <b>DB_CONDOMINIOS</b> con estructura de 10 franjas horarias (incluye 10:00 AM).<br><br><b style="color:#dc3545;">Si ya existe, se limpiará su contenido.</b>',
      icon: 'warning', showCancelButton: true, confirmButtonColor: '#1565c0', confirmButtonText: '🏘️ SÍ, INICIALIZAR'
    }).then(result => {
      if (result.isConfirmed) {
        window.toggleLoader(true);
        google.script.run
          .withSuccessHandler(res => {
            window.toggleLoader(false);
            Swal.fire('Completado ✅', res.mensaje, 'success');
          })
          .withFailureHandler(err => { window.toggleLoader(false); Swal.fire('Error', err.message, 'error'); })
          .inicializarHojaCondominios(session.token);
      }
    });
  };

  window.ejecutarMigracionContrasenas = function() {
    Swal.fire({
      title: '🔐 Migrar Contraseñas a SHA-256',
      html: 'Esta acción encriptará todas las contraseñas en texto plano.<br><br><b>Ejecutar UNA SOLA VEZ.</b> Después de esto, los usuarios con contraseñas antiguas aún podrán iniciar sesión durante la transición.',
      icon: 'warning', showCancelButton: true, confirmButtonColor: '#c62828', confirmButtonText: '🔐 SÍ, MIGRAR'
    }).then(result => {
      if (result.isConfirmed) {
        window.toggleLoader(true);
        google.script.run
          .withSuccessHandler(res => {
            window.toggleLoader(false);
            Swal.fire('Migración Completa ✅', res.migradas + ' contraseñas encriptadas con SHA-256.', 'success');
          })
          .withFailureHandler(err => { window.toggleLoader(false); Swal.fire('Error', err.message, 'error'); })
          .migrarContrasenasTHash();
      }
    });
  };

</script>
