<style>
  /* Variables específicas del Dashboard (Aisladas) */
  #seccion-dashboard {
    --dash-bg-primary: #0f172a;
    --dash-bg-secondary: #020617;
    --dash-bg-card: rgba(30, 41, 59, 0.7);
    --dash-border: rgba(255, 255, 255, 0.08);
    --dash-text-main: #f8fafc;
    --dash-text-muted: #94a3b8;

    /* Neon Accents */
    --dash-neon-green: #10b981;
    --dash-neon-amber: #f59e0b;
    --dash-neon-red: #ef4444;
    --dash-neon-purple: #8b5cf6;
    --dash-neon-blue: #3b82f6;

    color: var(--dash-text-main);
  }

  /* Contenedor Principal del Dashboard */
  .dash-container {
    background: linear-gradient(135deg, var(--dash-bg-secondary) 0%, var(--dash-bg-primary) 100%);
    border-radius: 24px;
    padding: 30px;
    min-height: calc(100vh - 120px);
    box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.5);
    border: 1px solid var(--dash-border);
  }

  /* Glass Cards del Dashboard */
  .dash-card {
    background: var(--dash-bg-card);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--dash-border);
    border-radius: 20px;
    padding: 24px;
    transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
    box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.3);
    position: relative;
    overflow: hidden;
  }

  .dash-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
  }

  .dash-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5);
    border-color: rgba(255, 255, 255, 0.15);
  }

  /* Dashboard Tabs */
  .dash-tabs {
    display: flex;
    gap: 15px;
    margin-bottom: 30px;
    background: rgba(15, 23, 42, 0.6);
    padding: 8px;
    border-radius: 16px;
    border: 1px solid var(--dash-border);
    width: fit-content;
  }

  .dash-tab-btn {
    background: transparent;
    border: none;
    color: var(--dash-text-muted);
    padding: 10px 20px;
    border-radius: 12px;
    font-weight: 600;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .dash-tab-btn:hover {
    color: var(--dash-text-main);
    background: rgba(255, 255, 255, 0.05);
  }

  .dash-tab-btn.active {
    background: linear-gradient(135deg, var(--dash-neon-blue), #2563eb);
    color: white;
    box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
  }

  /* KPI Cards Pequeñas */
  .dash-kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
    margin-bottom: 30px;
  }

  .kpi-value {
    font-size: 2.5rem;
    font-weight: 800;
    line-height: 1.1;
    margin-top: 10px;
    background: linear-gradient(to right, #fff, #94a3b8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .kpi-label {
    font-size: 0.9rem;
    color: var(--dash-text-muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .kpi-icon-bg {
    position: absolute;
    right: -10px;
    bottom: -15px;
    font-size: 5rem;
    opacity: 0.05;
    transform: rotate(-15deg);
  }

  /* Tablas Dark Mode del Dashboard */
  .dash-table-container {
    overflow-x: auto;
  }

  .dash-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0 8px;
  }

  .dash-table th {
    padding: 12px 20px;
    color: var(--dash-text-muted);
    font-weight: 600;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    border: none;
  }

  .dash-table td {
    padding: 16px 20px;
    background: rgba(30, 41, 59, 0.4);
    color: var(--dash-text-main);
    border: none;
    vertical-align: middle;
  }

  .dash-table tr td:first-child {
    border-radius: 12px 0 0 12px;
  }

  .dash-table tr td:last-child {
    border-radius: 0 12px 12px 0;
  }

  .dash-table tr:hover td {
    background: rgba(30, 41, 59, 0.8);
  }

  /* Progress Bars In-Table */
  .dash-progress-container {
    width: 100%;
    height: 6px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    overflow: hidden;
    margin-top: 5px;
  }

  .dash-progress-bar {
    height: 100%;
    border-radius: 10px;
    transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* Badges de Estado */
  .dash-badge {
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .dash-badge.optimo {
    background: rgba(16, 185, 129, 0.2);
    color: var(--dash-neon-green);
    border: 1px solid rgba(16, 185, 129, 0.3);
  }

  .dash-badge.alerta {
    background: rgba(245, 158, 11, 0.2);
    color: var(--dash-neon-amber);
    border: 1px solid rgba(245, 158, 11, 0.3);
  }

  .dash-badge.critico {
    background: rgba(239, 68, 68, 0.2);
    color: var(--dash-neon-red);
    border: 1px solid rgba(239, 68, 68, 0.3);
  }

  /* Grid Layouts para Charts */
  .chart-grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  .chart-grid-3 {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 20px;
  }

  /* Custom Scrollbar for Dashboard */
  #seccion-dashboard ::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }

  #seccion-dashboard ::-webkit-scrollbar-track {
    background: rgba(15, 23, 42, 0.5);
    border-radius: 4px;
  }

  #seccion-dashboard ::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.1);
    border-radius: 4px;
  }

  #seccion-dashboard ::-webkit-scrollbar-thumb:hover {
    background: rgba(255, 255, 255, 0.2);
  }
</style>
