<script>
  let ROL = localStorage.getItem('rol_briana') || "";
  let USUARIO_ACTUAL = localStorage.getItem('usuario_briana') || "";
  let DATOS_CAMPANAS = [];
  let DATOS_FORMULARIOS = [];
  let CAMPOS_FORMULARIO = [];
  let SECCIONES_FORMULARIO = [];
  let TIPO_CAMPO_PENDIENTE = "";
  let CAMPANA_ACTUAL_DATA = "";
  let CAMPANA_OPERANDO = null;
  let DATA_CACHE_OPERADOR = [];
  let GESTIONES_ACTUALES = [];
  let CAMPO_EDITANDO_INDEX = null;
  let CAMPOS_FORM_ACTUAL = [];

  const PREFIJOS_VE = {
    movil: ["0412", "0422", "0414", "0424", "0416", "0426"],
    fijo: [
      "0212", "0234", "0235", "0237", "0238", "0239", "0240", "0241", "0242", "0243", "0244", "0245", "0246", "0247", "0248", "0249",
      "0251", "0252", "0253", "0254", "0255", "0256", "0257", "0258", "0259", "0261", "0262", "0263", "0264", "0265", "0266", "0267",
      "0268", "0269", "0271", "0272", "0273", "0274", "0275", "0276", "0277", "0278", "0279", "0281", "0282", "0283", "0285", "0286",
      "0287", "0288", "0289", "0291", "0292", "0293", "0294", "0295"
    ]
  };

  let ASIGNACION_INICIO = 1;
  let ASIGNACION_FIN = 0;
  let REGISTRO_ACTUAL = 1;

  let INTERVALO_ESTADISTICAS = null;
  let ULTIMO_TIEMPO_SERVIDOR = "0";
  let INTERVALO_REFRESCO = null;
  let VISTA_CAMPANAS_ACTUAL = 'Saliente';

  // Variables Modo Incidencias y recolección oculta
  let REGISTROS_INCIDENCIAS_ACTUALES = [];
  let INCIDENCIA_SELECCIONADA = null;
  let REGISTRO_ACTUAL_DATA = null;
  let INCIDENCIAS_RESUELTAS = [];
  let RESPUESTA_GENERAL_ACTIVA = false; // <--- NUEVA VARIABLE

  let TELEFONOS_EXITOSOS_CACHE = []; // NUEVA CACHÉ
  let HISTORIAL_LLAMADAS_FALLIDAS = []; // HISTORIAL PARA RETROCESO EN MANUAL
  let DATA_GESTIONES_CACHE = []; // CACHÉ GLOBAL DE GESTIONES PARA EXPLORACIÓN

  // Variables Modo Exploración de Duplicados
  let REGISTROS_DUPLICADOS_ACTUALES = [];
  let DUPLICADO_SELECCIONADO_INDEX = null;
  let DUPLICADOS_GESTIONADOS = [];

  // Variables para Paginación y Búsqueda de Campañas
  let PAGINA_ACTUAL_CAMPANAS = 1;
  const ITEMS_POR_PAGINA_CAMPANAS = 10;
  let CAMPANAS_FILTRADAS = [];

  const ESTADOS_REINTENTO = [
    "No Contesta",
    "Sin Cobertura",
    "No Tiene Información",
    "Buzón de Voz",
    "No Se Encuentra Disponible",
    "Número Suspendido"
  ];

  function mostrarCarga(texto) {
    document.getElementById('texto-carga').innerText = texto || "Procesando...";
    document.getElementById('pantalla-carga').style.display = "flex";
  }

  function ocultarCarga() {
    document.getElementById('pantalla-carga').style.display = "none";
  }

  function login() {
    const u = document.getElementById('usuario').value;
    const p = document.getElementById('password').value;
    const ext = document.getElementById('extension').value;
    if (!u || !p || !ext || ext.length < 5) { alert("Por favor complete todos los campos e ingrese una extensión válida (5 dígitos)"); return; }
    document.getElementById('loader-login').style.display = "block";
    google.script.run.withSuccessHandler(function (res) {
      document.getElementById('loader-login').style.display = "none";
      if (res.success) {
        ROL = res.rol;
        USUARIO_ACTUAL = res.usuario;

        localStorage.setItem('rol_briana', ROL);
        localStorage.setItem('usuario_briana', USUARIO_ACTUAL);
        localStorage.setItem('extension_briana', ext);
        localStorage.setItem('permiso_reporte_briana', res.permisoReporte ? "S" : "N");

        document.getElementById('login-page').style.display = "none";
        document.getElementById('home-page').style.display = "block";

        iniciarEscuchaRefresco();

        if (ROL === "admin" || ROL.toLowerCase() === "analista") {
          document.getElementById('sidebar-admin').style.display = "flex";
          document.getElementById('vista-admin').style.display = "block";
          document.getElementById('label-rol-admin').innerText = (ROL.toLowerCase() === "analista" ? "ANALISTA: " : "ADMIN: ") + USUARIO_ACTUAL;

          if (ROL.toLowerCase() === "analista") {
            document.getElementById('btn-nav-usuarios').style.display = "none";
          } else {
            document.getElementById('btn-nav-usuarios').style.display = "flex";
          }

          mostrarSeccion('campanas-salientes');
        } else {
          document.getElementById('sidebar-operador').style.display = "flex";
          document.getElementById('vista-operador').style.display = "block";
          document.getElementById('label-rol-operador').innerText = "OPERADOR: " + USUARIO_ACTUAL;

          const labelExt = document.getElementById('label-extension-operador');
          if (labelExt) {
            labelExt.innerText = "EXTENSIÓN: " + (ext || "N/A");
            labelExt.style.setProperty('display', 'block', 'important');
          }

          mostrarSeccionOperador('mis-campanas');
        }
      } else { alert(res.mensaje); }
    }).validarCredenciales(u, p, ext);
  }

  function logout() {
    ROL = "";
    USUARIO_ACTUAL = "";

    if (INTERVALO_ESTADISTICAS) {
      clearInterval(INTERVALO_ESTADISTICAS);
      INTERVALO_ESTADISTICAS = null;
    }

    if (INTERVALO_REFRESCO) {
      clearInterval(INTERVALO_REFRESCO);
      INTERVALO_REFRESCO = null;
    }

    localStorage.removeItem('rol_briana');
    localStorage.removeItem('usuario_briana');
    localStorage.removeItem('extension_briana');

    document.getElementById('usuario').value = "";
    document.getElementById('password').value = "";
    document.getElementById('extension').value = "";
    document.getElementById('login-page').style.display = "flex";
    document.getElementById('home-page').style.display = "none";
    document.getElementById('sidebar-admin').style.display = "none";
    document.getElementById('sidebar-operador').style.display = "none";
    document.getElementById('vista-admin').style.display = "none";
    document.getElementById('vista-operador').style.display = "none";

    const labelExt = document.getElementById('label-extension-operador');
    if (labelExt) labelExt.style.display = "none";
  }

  function iniciarEscuchaRefresco() {
    google.script.run.withSuccessHandler(function (serverTime) {
      ULTIMO_TIEMPO_SERVIDOR = serverTime;
      if (INTERVALO_REFRESCO) clearInterval(INTERVALO_REFRESCO);
      INTERVALO_REFRESCO = setInterval(revisarRefresco, 10000);
    }).checkGlobalRefresh();
  }

  function revisarRefresco() {
    if (!USUARIO_ACTUAL) return;
    google.script.run.withSuccessHandler(function (serverTime) {
      if (serverTime !== "0" && serverTime !== ULTIMO_TIEMPO_SERVIDOR) {
        ULTIMO_TIEMPO_SERVIDOR = serverTime;
        ejecutarRefrescoAlInicio();
      }
    }).checkGlobalRefresh();
  }

  function forzarRefrescoGlobal() {
    if (confirm("¿Forzar el refresco de TODAS las sesiones activas? (Los usuarios volverán a su pantalla principal para ver los datos actualizados)")) {
      mostrarCarga("Enviando orden de actualización global...");
      google.script.run
        .withSuccessHandler(function (serverTime) {
          ULTIMO_TIEMPO_SERVIDOR = serverTime;
          ejecutarRefrescoAlInicio();
          alert("Orden enviada exitosamente. El resto de usuarios se actualizarán en breve.");
        })
        .withFailureHandler(function (error) {
          ocultarCarga();
          alert("Error de conexión con Google: " + error);
        })
        .triggerGlobalRefresh();
    }
  }

  function ejecutarRefrescoAlInicio() {
    mostrarCarga("Actualizando sistema...");
    setTimeout(() => {
      // Manejar visibilidad del botón de reporte global
      const pRep = localStorage.getItem('permiso_reporte_briana') === "S";
      const btnRep = document.getElementById('btn-descargar-reporte-global');
      if (btnRep) btnRep.style.display = pRep ? "inline-block" : "none";

      if (ROL === "admin" || ROL.toLowerCase() === "analista") {
        regresarALista();
        mostrarSeccion(VISTA_CAMPANAS_ACTUAL === 'Entrante' ? 'campanas-entrantes' : 'campanas-salientes');
      } else if (ROL !== "") {
        volverACampanasOperador();
      }
      ocultarCarga();
    }, 800);
  }

  function mostrarSeccionOperador(seccion) {
    const btnCampanas = document.getElementById('btn-nav-op-campanas');
    const btnStats = document.getElementById('btn-nav-op-stats');

    if (btnCampanas) btnCampanas.classList.remove('active');
    if (btnStats) btnStats.classList.remove('active');

    document.getElementById('seccion-mis-campanas').style.display = 'none';
    document.getElementById('seccion-gestion-llamada').style.display = 'none';
    document.getElementById('seccion-mis-estadisticas').style.display = 'none';

    if (seccion === 'mis-campanas') {
      if (btnCampanas) btnCampanas.classList.add('active');
      document.getElementById('seccion-mis-campanas').style.display = 'block';
      cargarCampanasOperador();
    } else if (seccion === 'mis-estadisticas') {
      if (btnStats) btnStats.classList.add('active');
      document.getElementById('seccion-mis-estadisticas').style.display = 'block';
      cargarMisEstadisticasHoy();
    }
  }

  function cargarMisEstadisticasHoy() {
    const grid = document.getElementById('grid-estadisticas-operador');
    grid.innerHTML = '<div class="col-12 text-center text-muted">Cargando estadísticas...</div>';

    google.script.run.withSuccessHandler(function (stats) {
      if (stats.length === 0) {
        grid.innerHTML = '<div class="col-12 text-center text-muted">No has realizado ninguna gestión el día de hoy.</div>';
        return;
      }

      grid.innerHTML = stats.map(s => {
        let isIncidencia = s.tipoAsignacion === 'Incidencias';
        let incidenciasHTML = isIncidencia ? `
            <div class="d-flex justify-content-between mb-3">
              <span class="text-muted fw-bold">Incidencias:</span>
              <span class="badge bg-warning text-dark rounded-pill px-3" style="font-size: 0.9rem;"><i class="fas fa-ticket-alt"></i> ${s.incidencias}</span>
            </div>` : '';

        return `
        <div class="col-md-6 col-lg-4">
          <div class="glass-card p-4 h-100 border-top border-primary border-4">
            <h5 class="fw-bold text-primary mb-3"><i class="fas fa-headset me-2"></i>${s.nombre}</h5>
            <div class="d-flex justify-content-between mb-2">
              <span class="text-muted fw-bold">Efectivas:</span>
              <span class="badge bg-success rounded-pill px-3" style="font-size: 0.9rem;">${s.exitosas}</span>
            </div>
            <div class="d-flex justify-content-between ${!isIncidencia ? 'mb-3' : 'mb-2'}">
              <span class="text-muted fw-bold">Fallidas:</span>
              <span class="badge bg-danger rounded-pill px-3" style="font-size: 0.9rem;">${s.fallidas}</span>
            </div>
            ${incidenciasHTML}
            <hr>
            <div class="d-flex justify-content-between align-items-center">
              <span class="text-dark fw-bold">Total Hoy:</span>
              <span class="badge bg-primary rounded-pill px-3" style="font-size: 0.9rem;">${s.exitosas + s.fallidas}</span>
            </div>
          </div>
        </div>
      `}).join('');
    }).obtenerMisEstadisticasHoy(USUARIO_ACTUAL);
  }

  function actualizarContadorOperador(nombreCampana) {
    google.script.run.withSuccessHandler(function (stats) {
      document.getElementById('op-count-exitosas').innerText = stats.exitosas;
      document.getElementById('op-count-fallidas').innerText = stats.fallidas;
      if (document.getElementById('op-count-incidencias')) {
        document.getElementById('op-count-incidencias').innerText = stats.incidencias;
      }
    }).obtenerContadorOperador(nombreCampana, USUARIO_ACTUAL);
  }

  function cargarCampanasOperador() {
    google.script.run.withSuccessHandler(function (campanas) {
      if (campanas.length === 0) {
        document.getElementById('grid-campanas-operador').innerHTML = '<div class="col-12 text-center text-muted">No tienes campañas activas asignadas.</div>';
        return;
      }
      if (campanas.length === 1) {
        iniciarGestionCampana(campanas[0]);
        document.getElementById('btn-volver-operador').style.display = "none";
        document.getElementById('header-campana-unica').style.display = "block";
        document.getElementById('nombre-campana-cabecera').innerText = "Campaña: " + campanas[0].nombre;
      } else {
        document.getElementById('header-campana-unica').style.display = "none";
        document.getElementById('btn-volver-operador').style.display = "block";
        const grid = document.getElementById('grid-campanas-operador');
        grid.innerHTML = campanas.map(c => {
          let badgeTipo = c.tipoCampana === 'Entrante'
            ? '<span class="badge bg-info text-dark ms-2" style="font-size:0.6rem;">ENTRANTE</span>'
            : '';

          return `
          <div class="col-md-4">
            <div class="op-campana-card" onclick='iniciarGestionCampana(${JSON.stringify(c)})'>
              <div class="d-flex align-items-center mb-3">
                <div class="icon-box-blue m-0 me-3" style="width:45px; height:45px; font-size:1rem;">
                  <i class="fas ${c.tipoCampana === 'Entrante' ? 'fa-phone-volume' : 'fa-headset'}"></i>
                </div>
                <h6 class="fw-bold m-0">${c.nombre} ${badgeTipo}</h6>
              </div>
              <p class="small text-muted mb-3">${c.descripcion}</p>
              <div class="d-flex justify-content-between align-items-center">
                <span class="badge-active">Disponible</span>
                <i class="fas fa-chevron-right text-primary"></i>
              </div>
            </div>
          </div>`;
        }).join('');
      }
    }).obtenerCampanasOperador(USUARIO_ACTUAL);
  }

  function esColumnaVisible(header) {
    if (!CAMPANA_OPERANDO || !CAMPANA_OPERANDO.columnasVisibles) return true;
    const visibles = CAMPANA_OPERANDO.columnasVisibles.split(',').map(s => s.trim());
    return visibles.includes(header.trim());
  }

  function iniciarGestionCampana(campana) {
    CAMPANA_OPERANDO = campana;

    // Reset variables de incidencias y data oculta
    REGISTROS_INCIDENCIAS_ACTUALES = [];
    INCIDENCIA_SELECCIONADA = null;
    REGISTRO_ACTUAL_DATA = null;
    RESPUESTA_GENERAL_ACTIVA = false;

    // Reset variables de duplicados
    REGISTROS_DUPLICADOS_ACTUALES = [];
    DUPLICADO_SELECCIONADO_INDEX = null;
    DUPLICADOS_GESTIONADOS = [];

    document.getElementById('tarjeta-incidencias').style.display = 'none';
    document.getElementById('lista-incidencias-operador').innerHTML = '';
    document.getElementById('tarjeta-duplicados').style.display = 'none';
    document.getElementById('lista-duplicados-operador').innerHTML = '';

    document.getElementById('seccion-mis-campanas').style.display = "none";
    document.getElementById('seccion-gestion-llamada').style.display = "block";
    document.getElementById('op-dialogo-texto').innerText = campana.dialogo || "Sin diálogo asignado.";
    document.getElementById('busqueda-telefono').value = "";

    const badgeIncidencias = document.getElementById('badge-incidencias-operador');
    if (badgeIncidencias) {
      if (campana.tipoAsignacion === 'Incidencias') {
        badgeIncidencias.style.display = 'inline-block';
      } else {
        badgeIncidencias.style.display = 'none';
      }
    }

    document.getElementById('op-count-exitosas').innerText = "0";
    document.getElementById('op-count-fallidas').innerText = "0";
    actualizarContadorOperador(campana.nombre);

    const contador = document.getElementById('contador-registros-operador');
    const btnSiguiente = document.getElementById('btn-siguiente-registro');
    const btnBuscar = document.getElementById('btn-buscar-telefono');

    const contenedorBuscador = document.getElementById('contenedor-buscador-operador');
    const tarjetaDatosCliente = document.getElementById('tarjeta-datos-cliente');

    // Asegurar que el formulario esté en su lugar original antes de empezar
    const formGest = document.getElementById('tarjeta-formulario-gestion');
    document.getElementById('contenedor-original-formulario').appendChild(formGest);
    formGest.classList.add('glass-card', 'shadow-sm', 'p-4');
    formGest.style.marginTop = "0";

    if (campana.tipoAsignacion === 'Incidencias') {
      formGest.style.display = 'none'; // Se oculta hasta buscar y seleccionar
    } else {
      formGest.style.display = 'block';
    }

    if (campana.tipoCampana === 'Entrante') {
      if (contenedorBuscador) contenedorBuscador.style.display = "none";
      if (tarjetaDatosCliente) tarjetaDatosCliente.style.display = "none";
      contador.style.display = "none";
      DATA_CACHE_OPERADOR = [];
    } else {
      if (contenedorBuscador) contenedorBuscador.style.display = "flex";
      if (tarjetaDatosCliente) tarjetaDatosCliente.style.display = "block";
      document.getElementById('op-cliente-info').innerHTML = '<p class="text-muted text-center py-3 m-0">Ingresa un teléfono para ver los datos</p>';
      document.getElementById('busqueda-telefono').placeholder = "Buscar teléfono o ID...";
      contador.innerText = "- / -";
      btnSiguiente.disabled = false;
      if (btnBuscar) btnBuscar.style.display = "inline-block";

      ASIGNACION_FIN = 0;
      REGISTRO_ACTUAL = 1;
      HISTORIAL_LLAMADAS_FALLIDAS = [];

      const btnAnterior = document.getElementById('btn-anterior-registro');
      const inputTel = document.getElementById('busqueda-telefono');

      if (campana.tipoAsignacion === 'Manual') {
        contador.style.display = "inline-block";
        btnSiguiente.style.display = "block";
        if (btnBuscar) btnBuscar.classList.remove('rounded-end-pill');
        if (btnAnterior) {
          btnAnterior.style.display = 'inline-block';
          inputTel.classList.remove('rounded-start-pill');
        }
      } else {
        contador.style.display = "none";
        btnSiguiente.style.display = "none";
        if (btnBuscar) btnBuscar.classList.add('rounded-end-pill');
        if (btnAnterior) {
          btnAnterior.style.display = 'none';
          inputTel.classList.add('rounded-start-pill');
        }
      }

      if (campana.tipoAsignacion === 'Manual' && campana.distribucion) {
        try {
          let dist = JSON.parse(campana.distribucion);
          if (dist[USUARIO_ACTUAL]) {
            let partes = dist[USUARIO_ACTUAL].split('-');
            ASIGNACION_INICIO = parseInt(partes[0]);
            ASIGNACION_FIN = parseInt(partes[1]);
            REGISTRO_ACTUAL = ASIGNACION_INICIO;
          }
        } catch (e) { }
      }
    }

    mostrarCarga("Iniciando entorno...");
    google.script.run.withSuccessHandler(function (contexto) {
      ocultarCarga();
      if (!contexto) return alert("Error: El servidor no respondió. Intente recargar.");
      if (contexto.error) return alert("Error: " + contexto.error);

      // 1. Metadatos y UI inmediata
      TELEFONOS_EXITOSOS_CACHE = contexto.exitosos || [];
      document.getElementById('op-count-exitosas').innerText = contexto.stats.exitosas;
      document.getElementById('op-count-fallidas').innerText = contexto.stats.fallidas;
      if (document.getElementById('op-count-incidencias')) {
        document.getElementById('op-count-incidencias').innerText = contexto.stats.incidencias;
      }

      const formObj = contexto.formularios.find(f => f.nombre === campana.formularioId);
      let parsed = formObj ? JSON.parse(formObj.campos || "[]") : [];
      if (Array.isArray(parsed)) {
        CAMPOS_FORM_ACTUAL = parsed;
        SECCIONES_FORMULARIO = [];
      } else {
        CAMPOS_FORM_ACTUAL = parsed.campos || [];
        SECCIONES_FORMULARIO = parsed.secciones || [];
      }
      renderizarFormularioOperador(CAMPOS_FORM_ACTUAL);

      // 2. Carga de Base de Datos (CSV)
      google.script.run.withSuccessHandler(function (data) {
        DATA_CACHE_OPERADOR = data || [];
        if (ASIGNACION_FIN === 0 && DATA_CACHE_OPERADOR.length > 1) {
          ASIGNACION_FIN = DATA_CACHE_OPERADOR.length - 1;
        }
        const contador = document.getElementById('contador-registros-operador');
        if (ASIGNACION_FIN === 0) { contador.innerText = "0 / 0"; }
        else { contador.innerText = `${REGISTRO_ACTUAL} / ${ASIGNACION_FIN}`; }
      }).obtenerDataCampaña(campana.nombre, 0);

      // 3. Carga de Gestiones (Cache para búsquedas)
      google.script.run.withSuccessHandler(function (gestiones) {
        DATA_GESTIONES_CACHE = gestiones || [];
      }).obtenerGestionesCampana(campana.nombre, 0);

    }).getContextoOperador(campana.nombre, USUARIO_ACTUAL);
  }

  function cargarSiguienteCliente() {
    if (!DATA_CACHE_OPERADOR || DATA_CACHE_OPERADOR.length <= 1) {
      return alert("La base de datos está vacía o aún no ha cargado.");
    }

    const cabecera = DATA_CACHE_OPERADOR[0];
    let indexTel = cabecera.findIndex(h => h.toLowerCase().includes("tel") || h.toLowerCase().includes("cel") || h.toLowerCase() === "id");
    if (indexTel === -1) indexTel = 0;

    let registro = null;

    // Auto-saltar los finalizados exitosos
    while (REGISTRO_ACTUAL <= ASIGNACION_FIN) {
      registro = DATA_CACHE_OPERADOR[REGISTRO_ACTUAL];
      if (registro) {
        let telStr = registro[indexTel] ? registro[indexTel].toString().trim() : "";
        if (TELEFONOS_EXITOSOS_CACHE.includes(telStr)) {
          REGISTRO_ACTUAL++;
          registro = null; // para que no procese y salte
          continue;
        }
        break; // Encontró uno válido
      } else {
        REGISTRO_ACTUAL++;
      }
    }

    if (REGISTRO_ACTUAL > ASIGNACION_FIN) {
      return alert("Has completado todos los registros de tu asignación.");
    }

    if (registro) {
      REGISTRO_ACTUAL_DATA = registro;
      REGISTRO_ACTUAL_DATA._index = REGISTRO_ACTUAL;
      let html = "";
      cabecera.forEach((h, i) => {
        if (esColumnaVisible(h)) {
          html += `<div class="data-item-row"><span class="data-item-label">${h}:</span><span class="data-item-value info-cliente-val" data-key="${h}">${registro[i]}</span></div>`;
        }
      });
      document.getElementById('op-cliente-info').innerHTML = html;
      document.getElementById('busqueda-telefono').value = "";
      document.getElementById('contador-registros-operador').innerText = `${REGISTRO_ACTUAL} / ${ASIGNACION_FIN}`;
      REGISTRO_ACTUAL++;
      document.getElementById('btn-siguiente-registro').disabled = true;
    } else {
      alert("Registro no encontrado en la base de datos.");
    }
  }

  function cargarAnteriorFallido() {
    if (HISTORIAL_LLAMADAS_FALLIDAS.length === 0) return alert("No hay registros fallidos previos para retroceder.");

    const idx = HISTORIAL_LLAMADAS_FALLIDAS.pop();
    if (!DATA_CACHE_OPERADOR || !DATA_CACHE_OPERADOR[idx]) return alert("Error al recuperar el registro del historial.");

    const cabecera = DATA_CACHE_OPERADOR[0];
    const registro = DATA_CACHE_OPERADOR[idx];

    REGISTRO_ACTUAL_DATA = registro;
    REGISTRO_ACTUAL_DATA._index = idx;

    let html = "";
    cabecera.forEach((h, i) => {
      if (esColumnaVisible(h)) {

  function buscarPorTelefono() {
    const tel = document.getElementById('busqueda-telefono').value.trim();
    if (!tel) return alert("Ingresa un número");

    // En modo duplicados, permitimos buscar aunque ya haya éxito para limpiar otros registros del mismo número
    if (CAMPANA_OPERANDO.tipoAsignacion !== 'ExploracionDuplicados') {
      if (TELEFONOS_EXITOSOS_CACHE.includes(tel)) {
        document.getElementById('busqueda-telefono').value = "";
        return alert("Este Contacto ya tiene una respuesta exitosa");
      }
    }

    if (!DATA_CACHE_OPERADOR || DATA_CACHE_OPERADOR.length === 0) return alert("No hay base de datos cargada para esta campaña.");

    // Regresar el form a su base y ocultarlo
    const formGest = document.getElementById('tarjeta-formulario-gestion');
    document.getElementById('contenedor-original-formulario').appendChild(formGest);
    formGest.style.display = 'none';

    const cabecera = DATA_CACHE_OPERADOR[0];
    let indexTel = -1;
    cabecera.forEach((h, i) => { if (h.toLowerCase().includes("tel") || h.toLowerCase().includes("cel")) indexTel = i; });
    if (indexTel === -1) indexTel = 0;

    if (CAMPANA_OPERANDO.tipoAsignacion === 'ExploracionDuplicados') {
      // 1. Si ya tenemos caché, procesamos instantáneamente
      if (DATA_GESTIONES_CACHE && DATA_GESTIONES_CACHE.length > 0) {
        procesarBusquedaDuplicados(tel, indexTel, cabecera, DATA_GESTIONES_CACHE);

        // 2. Sincronización en segundo plano (silenciosa) para la próxima búsqueda
        google.script.run.withSuccessHandler(function (dataGestiones) {
          DATA_GESTIONES_CACHE = dataGestiones;
          console.log("Sincronización de fondo completada.");
        }).obtenerGestionesCampana(CAMPANA_OPERANDO.nombre, 0);
        return;
      }

      // 3. Solo bloqueamos si es la primera búsqueda y no hay caché
      mostrarCarga("Sincronizando base de datos...");
      google.script.run.withSuccessHandler(function (dataGestiones) {
        ocultarCarga();
        DATA_GESTIONES_CACHE = dataGestiones;
        procesarBusquedaDuplicados(tel, indexTel, cabecera, dataGestiones);
      }).obtenerGestionesCampana(CAMPANA_OPERANDO.nombre, 0);
      return;
    } else if (CAMPANA_OPERANDO.tipoAsignacion === 'Incidencias') {
      const registros = DATA_CACHE_OPERADOR.filter((fila, i) => i > 0 && fila[indexTel].toString().includes(tel));

      if (registros.length > 0) {
        REGISTROS_INCIDENCIAS_ACTUALES = registros;
        INCIDENCIA_SELECCIONADA = null;
        REGISTRO_ACTUAL_DATA = null;
        RESPUESTA_GENERAL_ACTIVA = false;

        // --- REINICIAR CONTROL DE INCIDENCIAS Y OCULTAR BOTÓN FINALIZAR ---
        INCIDENCIAS_RESUELTAS = [];
        document.getElementById('contenedor-finalizar-persona').style.display = 'none';

        document.getElementById('tarjeta-duplicados').style.display = 'none';

        let idxEstado = -1, idxMuni = -1, idxObpp = -1, idxC = -1, idxN = -1, idxA = -1;
        cabecera.forEach((h, i) => {
          let hl = h.toLowerCase().trim();
          if (hl === "estado" || hl.includes("estado")) { if (idxEstado === -1) idxEstado = i; }

          if (hl === "cedula" || hl === "cédula" || hl.includes("cedula") || hl.includes("cédula")) { if (idxC === -1) idxC = i; }
          if (hl === "nombre" || (hl.includes("nombre") && !hl.includes("obpp"))) { if (idxN === -1) idxN = i; }

  function procesarBusquedaDuplicados(tel, indexTel, cabecera, dataGestiones) {
    const registrosBase = DATA_CACHE_OPERADOR.filter((fila, i) => i > 0 && fila[indexTel].toString().includes(tel));

    if (registrosBase.length === 0) {
      document.getElementById('op-cliente-info').innerHTML = '<div class="alert alert-danger py-2 small m-0">Número no encontrado en la base.</div>';
      document.getElementById('tarjeta-duplicados').style.display = 'none';
      return;
    }

    // Identificar columnas en el reporte
    let idxResultado = -1;
    let idxEspecifico = -1;
    let indicesCSVEnGestiones = [];

    if (dataGestiones && dataGestiones.length > 0) {
      const cabReporte = dataGestiones[0].map(h => h.toString().toLowerCase().trim());
      idxResultado = cabReporte.indexOf("resultado");

      // Buscar columna de estado específico
      idxEspecifico = cabReporte.findIndex(h => h === "estado de la llamada" || h === "estado" || h === "resultado especifico");

      // Mapear cabeceras del CSV a columnas del reporte
      cabecera.forEach(h => {
        indicesCSVEnGestiones.push(cabReporte.indexOf(h.toLowerCase().trim()));
      });
    }

    // Filtrar los registros basados en las gestiones existentes
    const registrosFiltrados = registrosBase.filter(reg => {
      if (!dataGestiones || dataGestiones.length <= 1) return true;

      // Buscar gestiones para este registro específico
      // Usamos una firma de la fila para identificarla (ID o Nombre + Teléfono)
      const gestionesDeEsteRegistro = dataGestiones.filter((rowG, i) => {
        if (i === 0) return false;
        // Comprobar si las columnas que coinciden con el CSV tienen los mismos valores
        return indicesCSVEnGestiones.every((idxReporte, idxCSV) => {
          if (idxReporte === -1) return true; // Si la columna no está en el reporte, no podemos comparar
          return rowG[idxReporte].toString().trim() === reg[idxCSV].toString().trim();
        });
      });

      if (gestionesDeEsteRegistro.length === 0) return true;

      // Si hay gestiones, buscamos la última (o la "mejor")
      // En este sistema, la última suele ser la válida.
      const ultimaGest = gestionesDeEsteRegistro[gestionesDeEsteRegistro.length - 1];
      const res = ultimaGest[idxResultado] ? ultimaGest[idxResultado].toString().toLowerCase() : "";

      const esExito = res.includes("exitos") || res.includes("answered") || res.includes("contest") || res.includes("efectiv");
      if (esExito) return false; // OCULTAR si es éxito

      // En modo exploración de duplicados, si es fallida (Cualquier tipo), 
      // debe seguir apareciendo para permitir gestionar otros candidatos del mismo número.
      return true;
    });

    if (registrosFiltrados.length > 0) {
      REGISTROS_DUPLICADOS_ACTUALES = registrosFiltrados;
      DUPLICADO_SELECCIONADO_INDEX = null;
      REGISTRO_ACTUAL_DATA = null;
      DUPLICADOS_GESTIONADOS = [];

      document.getElementById('tarjeta-duplicados').style.display = 'block';
      document.getElementById('tarjeta-incidencias').style.display = 'none';

      let htmlDuplicados = "";
      registrosFiltrados.forEach((reg, idx) => {
        let nombreCandidato = "Candidato " + (idx + 1);
        let subInfo = "";

        cabecera.forEach((h, i) => {
          let hl = h.toLowerCase();
          if (hl.includes("nombre") || hl.includes("cliente") || hl.includes("persona")) {
            if (reg[i]) nombreCandidato = reg[i];
          }
          if (hl.includes("cedula") || hl.includes("cédula") || hl === "id") {
            if (reg[i]) subInfo += `<div><strong>${h}:</strong> ${reg[i]}</div>`;
          }
        });

        htmlDuplicados += `
          <div class="card-duplicado-wrapper" id="card-duplicado-${idx}" onclick="seleccionarDuplicado(${idx})">
            <span class="card-duplicado-title">${nombreCandidato}</span>
            <div class="card-duplicado-info">
              ${subInfo}
              <div><strong>Fila Base:</strong> ${DATA_CACHE_OPERADOR.indexOf(reg)}</div>
            </div>
          </div>`;
      });

      document.getElementById('lista-duplicados-operador').innerHTML = htmlDuplicados;
      document.getElementById('op-cliente-info').innerHTML = `<div class="alert alert-info py-2 small m-0"><i class="fas fa-filter me-2"></i>Se encontraron ${registrosFiltrados.length} candidatos pendientes de gestión definitiva.</div>`;
    } else {
      document.getElementById('op-cliente-info').innerHTML = '<div class="alert alert-warning py-2 small m-0">Todos los perfiles asociados a este número ya han sido gestionados de forma definitiva por ti o por otro operador.</div>';
      document.getElementById('tarjeta-duplicados').style.display = 'none';
    }

    document.getElementById('btn-siguiente-registro').disabled = true;
  }

  function procesarInputTelefonoVE(inputElem, selectId) {
    let val = inputElem.value.replace(/[^0-9]/g, '');

    // Auto-detección para paste o escritura manual de número completo (>= 10 dígitos)
    // Soporta formatos locales (04141234567) o internacionales (+584141234567)
    if (val.length >= 10) {
      let numStr = val.slice(-7);
      let prefCandidate = val.slice(0, -7);
      let networkCode = prefCandidate.slice(-3); // Extrae la red (ej. 414)
      let prefStr = "0" + networkCode; // Reconstruye formato local (0414)

      let selectElem = document.getElementById(selectId);
      if (selectElem) {
        let optionExists = Array.from(selectElem.options).some(o => o.value === prefStr);
        if (optionExists) {
          selectElem.value = prefStr;
          val = numStr; // Deja solo el número de abonado
        }
      }
    }

    // Limitación inteligente:
    // Si empieza por 0 o 58, permitimos escribir hasta 12 dígitos para que pueda 
    // activarse la autodetección (arriba). Si no, asumimos que es número local y limitamos a 7.
    if (val.length > 7) {
      if (val.startsWith("0") || val.startsWith("58")) {
        val = val.substring(0, 12);
      } else {
        val = val.substring(0, 7);
      }
    }

    inputElem.value = val;
    if (inputElem.value.length === 7) checkearSecuencia();
  }

  function evaluarReglasIntegrales() {
    const wrappers = document.querySelectorAll('.op-campo-wrapper');
    const secciones = document.querySelectorAll('.op-seccion-wrapper');
    const visibilityMap = {}; // true = mostrar, false = ocultar
    const forcedObligatory = new Set();

    // Resetear base visual (todo visible y habilitado inicialmente)
    wrappers.forEach(w => {
      w.style.display = "block";
      w.style.opacity = "1";
      w.style.pointerEvents = "auto";
      const lbl = w.querySelector('.label-obligatorio-dinamico');
      if (lbl) lbl.remove();
      w.querySelectorAll('.field-data, .field-data-check, .field-data-doc, .field-data-prefix').forEach(i => i.disabled = false);
    });
    secciones.forEach(s => s.style.display = "block");

    let saltarHastaId = null;
    let bloquearTodoAbajo = false;

    wrappers.forEach((wrapper, index) => {
      const inputs = wrapper.querySelectorAll('.field-data, .field-data-check, .field-data-prefix, .field-data-doc');
      const isReqBase = wrapper.dataset.req === "true";
      const campoId = wrapper.dataset.id;
      const parentSec = wrapper.closest('.op-seccion-wrapper');
      const secId = parentSec ? parentSec.dataset.id : null;

      // RESOLUCIÓN DE VISIBILIDAD SECUENCIAL (Última regla manda)
      let isVisible = true;
      if (secId && visibilityMap[secId] !== undefined) isVisible = visibilityMap[secId];
      if (visibilityMap[campoId] !== undefined) isVisible = visibilityMap[campoId];

      const isRealmenteOculto = !isVisible;

      if (bloquearTodoAbajo || isRealmenteOculto || (saltarHastaId && saltarHastaId !== campoId)) {
        if (isRealmenteOculto || (saltarHastaId && saltarHastaId !== campoId)) {
          wrapper.style.display = "none";
          // Si el estado de la sección es explícitamente ocultar, apagamos el contenedor
          if (isRealmenteOculto && secId && visibilityMap[secId] === false && visibilityMap[campoId] === undefined) {
            parentSec.style.display = "none";
          }
        } else {
          wrapper.style.opacity = "0.4";
          wrapper.style.pointerEvents = "none";
        }

        inputs.forEach(i => {
          i.disabled = true;
          if (i.type === "checkbox" || i.type === "radio") i.checked = false;
          else i.value = "";
        });

        if (saltarHastaId === campoId) saltarHastaId = null;
        return; // Salimos temprano, no evalúa llenado de campos ocultos
      }

      if (saltarHastaId === campoId) saltarHastaId = null;

      // Si tiene inputs habilitados, verificamos si está lleno
      if (inputs.length > 0) {
        if (inputs[0].type === "checkbox" || inputs[0].type === "radio") {
          const checked = wrapper.querySelectorAll('input:checked');
          lleno = checked.length > 0;
          valorInput = Array.from(checked).map(c => c.value).join(', ');
        } else if (inputs[0].classList.contains('field-data-prefix')) {
          // Documento de identidad
          const docVal = wrapper.querySelector('.field-data-doc').value.trim();
          lleno = docVal !== "";
          valorInput = inputs[0].value + docVal;
        } else {
          valorInput = inputs[0].value.trim();
          lleno = valorInput !== "";
        }
      }

      // EVALUACIÓN DE REGLAS
      if (inputs.length > 0 && (inputs[0].tagName === "SELECT" || inputs[0].type === "checkbox" || inputs[0].type === "radio") && lleno) {
        const targets = (inputs[0].tagName === "SELECT") ? [inputs[0].options[inputs[0].selectedIndex]] : Array.from(wrapper.querySelectorAll('input:checked'));

        targets.forEach(target => {
          const destino = target.getAttribute("data-dest");
          let especiales = [];
          try { especiales = JSON.parse(target.getAttribute("data-especiales") || "[]"); }
          catch (e) { console.error("Error parsing reglas:", e); }

          especiales.forEach(regla => {
            if (regla.accion === "ocultar" || regla.accion === "ocultar_seccion") {
              regla.campos.forEach(id => visibilityMap[id] = false);
            }
            if (regla.accion === "mostrar_seccion") {
              regla.campos.forEach(id => visibilityMap[id] = true);
            }
            if (regla.accion === "requerir" && regla.campos) {
              regla.campos.forEach(id => forcedObligatory.add(id));
            }
          });

          if (destino === "Finalizar") {
            bloquearTodoAbajo = true;
          } else if (destino && destino !== "") {
            saltarHastaId = destino;
          }
        });
      }

      const esReqAhora = isReqBase || forcedObligatory.has(campoId);
      if (forcedObligatory.has(campoId) && !wrapper.querySelector('.label-obligatorio-dinamico')) {
        wrapper.querySelector('.form-label').innerHTML += ' <span class="text-danger label-obligatorio-dinamico">*</span>';
      }

      if (esReqAhora && !lleno) { bloquearTodoAbajo = true; }
    });
  }

  function checkearSecuencia() {
    evaluarReglasIntegrales();
  }

  function finalizarGestion() {
    let formData = {};
    let error = false;

    // --- VALIDACIÓN DE IDENTIDAD TELEFÓNICA (REQUERIMIENTO INGENIERO) ---
    let telIdentificado = "";
    
    // 1. Buscar en el registro actual cargado
    if (REGISTRO_ACTUAL_DATA) {
      const cabBase = (DATA_CACHE_OPERADOR && DATA_CACHE_OPERADOR.length > 0) ? DATA_CACHE_OPERADOR[0] : [];
      let idxT = cabBase.findIndex(h => {
        const hl = h.toLowerCase().trim();
        return hl.includes("tel") || hl.includes("cel") || hl === "id";
      });
      if (idxT !== -1 && REGISTRO_ACTUAL_DATA[idxT]) {
        telIdentificado = REGISTRO_ACTUAL_DATA[idxT].toString().trim();
      }
    }

    // 2. Si no hay registro, o el registro no tiene teléfono, recolectamos primero el form para ver si el operador lo escribió
    const camposInputsPre = document.querySelectorAll('.field-data, .field-data-check, .field-data-doc');
    let tempFormData = {};
    camposInputsPre.forEach(i => {
      if (i.disabled) return;
      const label = i.dataset.label ? i.dataset.label.toLowerCase().trim() : "";
      let valor = "";
      if (i.classList.contains('field-data-doc')) {
        const idCampo = i.dataset.id;
        const prefix = document.getElementById('pref_' + idCampo);
        valor = prefix && i.value ? prefix.value + i.value : "";
      } else if (i.type !== "checkbox" && i.type !== "radio") {
        valor = i.value;
      }
      
      if (valor && (label.includes("tel") || label.includes("cel") || label.includes("contacto"))) {
        if (!telIdentificado) telIdentificado = valor;
      }
    });

    if (!telIdentificado) {
      return alert("ERROR: No se ha identificado un número telefónico para esta gestión. Por favor busque un cliente o asegúrese de llenar el campo de teléfono en el formulario.");
    }

    // Recopilar la información del formulario
    const camposInputs = document.querySelectorAll('.field-data, .field-data-check, .field-data-doc');
    camposInputs.forEach(i => {
      if (i.disabled) return;

      const label = i.dataset.label;
      if (i.type === "checkbox" || i.type === "radio") {
        if (i.checked) {
          if (formData[label]) formData[label] += ", " + i.value;
          else formData[label] = i.value;
        } else {
          // For checkboxes that are mandatory but not checked, validation is handled below if formData[label] remains undefined
        }
      } else if (i.classList.contains('field-data-doc')) {
        const idCampo = i.dataset.id;
        const prefix = document.getElementById('pref_' + idCampo);
        const valorCompleto = prefix && i.value ? prefix.value + i.value : "";
        if (i.dataset.req === "true" && !valorCompleto) error = true;
        if (valorCompleto) formData[label] = valorCompleto;
      } else {
        if (i.dataset.req === "true" && !i.value) error = true;
        if (i.value) formData[label] = i.value;
      }
    });

    // Revisar si algún checkbox/radio obligatorio no fue checkeado
    const checkRequiredGroups = document.querySelectorAll('.op-campo-wrapper[data-req="true"]');
    checkRequiredGroups.forEach(w => {
      if (w.style.display !== "none" && w.style.pointerEvents !== "none") {
        const inputsGroup = w.querySelectorAll('.field-data, .field-data-check, .field-data-doc');
        if (inputsGroup.length > 0 && (inputsGroup[0].type === "checkbox" || inputsGroup[0].type === "radio")) {
          const checkedCount = w.querySelectorAll('.field-data-check:checked').length;
          if (checkedCount === 0) error = true;
        }
      }
    });

    if (error) return alert("Por favor llena los campos obligatorios del formulario antes de finalizar.");

    let estadoDetectado = "";
    for (let k in formData) {
      let clave = k.toString().toLowerCase().trim();
      if (clave === "estado de la llamada" || clave === "estado" || clave === "resultado" || clave === "estatus") {
        estadoDetectado = formData[k];
        break;
      }
    }

    const resultado = estadoDetectado || "Gestión Exitosa";
    const rStr = resultado.toLowerCase().trim();

    const csvHeaders = (DATA_CACHE_OPERADOR && DATA_CACHE_OPERADOR.length > 0) ? DATA_CACHE_OPERADOR[0] : [];
    const preguntasOrdenadas = CAMPOS_FORM_ACTUAL.map(c => c.label);

    // Cargar a caché si el estado es Exitoso globalmente
    let isExEx = rStr.includes("exitos") || rStr.includes("answered") || rStr.includes("contest") || rStr.includes("efectiv");
    if (isExEx) {
      let idxTelCash = csvHeaders.findIndex(h => h.toLowerCase().includes("tel") || h.toLowerCase().includes("cel") || h.toLowerCase() === "id");
      if (idxTelCash === -1) idxTelCash = 0;

      let refTel = "";
      if (CAMPANA_OPERANDO.tipoAsignacion === 'Incidencias' && RESPUESTA_GENERAL_ACTIVA) {
        refTel = REGISTROS_INCIDENCIAS_ACTUALES[0] ? REGISTROS_INCIDENCIAS_ACTUALES[0][idxTelCash] : "";
      } else if (REGISTRO_ACTUAL_DATA) {
        refTel = REGISTRO_ACTUAL_DATA[idxTelCash];
      }
      if (refTel && !TELEFONOS_EXITOSOS_CACHE.includes(refTel.toString().trim())) {
        TELEFONOS_EXITOSOS_CACHE.push(refTel.toString().trim());
      }
    } else {
      // SI ES FALLIDA Y ES MANUAL, GUARDAR EN HISTORIAL
      if (CAMPANA_OPERANDO.tipoAsignacion === 'Manual' && REGISTRO_ACTUAL_DATA && REGISTRO_ACTUAL_DATA._index) {
        HISTORIAL_LLAMADAS_FALLIDAS.push(REGISTRO_ACTUAL_DATA._index);
      }
    }

    mostrarCarga("Enviando gestión...");

    // Función interna para manejar la actualización visual tras completar las solicitudes
    function manejarExitoUI(esGeneral, esExito) {
      ocultarCarga();
      console.log("UI Actualizada - Guardado en proceso...");

      const formGest = document.getElementById('tarjeta-formulario-gestion');

      if (CAMPANA_OPERANDO.tipoAsignacion === 'ExploracionDuplicados') {
        limpiarExploradorDuplicados();
      } else if (CAMPANA_OPERANDO.tipoAsignacion === 'Incidencias') {
        document.getElementById('contenedor-original-formulario').appendChild(formGest);
        if (formGest) formGest.style.display = 'none';

        if (esGeneral) {
          INCIDENCIAS_RESUELTAS = REGISTROS_INCIDENCIAS_ACTUALES.map((_, idx) => idx);

          document.querySelectorAll('.card-incidencia-wrapper').forEach(card => {
            card.classList.remove('active');
            card.style.opacity = '0.5';
            card.style.pointerEvents = 'none';
            if (!card.querySelector('.card-incidencia-title span').innerText.includes('(Resuelta)')) {
              card.querySelector('.card-incidencia-title span').innerText += " (Res. General)";
            }
          });

          document.getElementById('contenedor-finalizar-persona').style.display = 'block';
          RESPUESTA_GENERAL_ACTIVA = false;
          INCIDENCIA_SELECCIONADA = null;
          REGISTRO_ACTUAL_DATA = null;
        } else {
          INCIDENCIAS_RESUELTAS.push(INCIDENCIA_SELECCIONADA.index);

          const cardResuelta = document.getElementById('card-incidencia-' + INCIDENCIA_SELECCIONADA.index);
          if (cardResuelta) {
            cardResuelta.classList.remove('active');
            cardResuelta.style.opacity = '0.5';
            cardResuelta.style.pointerEvents = 'none';
            cardResuelta.querySelector('.card-incidencia-title span').innerText += " (Resuelta)";
          }

          if (INCIDENCIAS_RESUELTAS.length === REGISTROS_INCIDENCIAS_ACTUALES.length) {
            document.getElementById('contenedor-finalizar-persona').style.display = 'block';
          }

          INCIDENCIA_SELECCIONADA = null;
          REGISTRO_ACTUAL_DATA = null;
        }
      } else {
        document.getElementById('busqueda-telefono').value = "";
        if (CAMPANA_OPERANDO.tipoCampana !== 'Entrante' && CAMPANA_OPERANDO.tipoAsignacion === 'Manual') {
          cargarSiguienteCliente();
        } else if (CAMPANA_OPERANDO.tipoCampana !== 'Entrante') {
          document.getElementById('op-cliente-info').innerHTML = '<div class="alert alert-info py-2 small m-0"><i class="fas fa-check-circle me-1"></i> Gestión guardada. Listo para el siguiente contacto.</div>';
          REGISTRO_ACTUAL_DATA = null;
        }
      }

      document.querySelectorAll('.field-data').forEach(i => i.value = "");
      document.querySelectorAll('.field-data-check').forEach(i => i.checked = false);
      checkearSecuencia();

      // Deshabilitamos la actualización por servidor aquí para evitar que el contador 
      // retroceda a valores antiguos durante el guardado optimista.
      // actualizarContadorOperador(CAMPANA_OPERANDO.nombre); 
    }

    // --- OPTIMISTIC UI: FLUJO INSTANTÁNEO ---
    const dataOptimista = Object.assign({}, formData);

    // 0. Actualizar contadores visuales inmediatamente (Optimistic)
    let isEx = (resultado.toLowerCase().includes("exitosa") || resultado.toLowerCase().includes("answered") || resultado.toLowerCase().includes("contestó") || resultado.toLowerCase().includes("efectiv"));
    if (isEx) {
      let el = document.getElementById('op-count-exitosas');
      if (el) el.innerText = (parseInt(el.innerText) || 0) + 1;
    } else {
      let el = document.getElementById('op-count-fallidas');
      if (el) el.innerText = (parseInt(el.innerText) || 0) + 1;
    }
    if (document.getElementById('op-count-incidencias')) {
      let incAdd = (RESPUESTA_GENERAL_ACTIVA && REGISTROS_INCIDENCIAS_ACTUALES) ? REGISTROS_INCIDENCIAS_ACTUALES.length : 1;
      let el = document.getElementById('op-count-incidencias');
      if (el) el.innerText = (parseInt(el.innerText) || 0) + incAdd;
    }

    // 1. Mostrar retroalimentación visual inmediata
    showToast("Guardando gestión...", "info");

    // 2. Limpiar UI instantáneamente (Sin esperar al servidor)
    const registroParaGuardar = REGISTRO_ACTUAL_DATA;

    // --- Actualización Optimista de Caches Locales ---
    if (isEx && registroParaGuardar) {
      const cabeceraBase = DATA_CACHE_OPERADOR[0];
      let idxT = cabeceraBase.findIndex(h => h.toLowerCase().includes("tel") || h.toLowerCase().includes("cel") || h.toLowerCase() === "id");
      if (idxT !== -1) {
        let telStr = registroParaGuardar[idxT].toString().trim();
        if (!TELEFONOS_EXITOSOS_CACHE.includes(telStr)) TELEFONOS_EXITOSOS_CACHE.push(telStr);
      }
    }

    if (CAMPANA_OPERANDO.tipoAsignacion === 'ExploracionDuplicados' && registroParaGuardar) {
      if (!DATA_GESTIONES_CACHE || DATA_GESTIONES_CACHE.length === 0) {
        // Simulación de cabeceras EXACTA al servidor: Base + Cliente (CSV) + Formulario
        const cabBase = ["Campaña", "Resultado", "Usuario", "Fecha"];
        const cabCSV = DATA_CACHE_OPERADOR[0] || [];
        const cabForm = CAMPOS_FORM_ACTUAL.map(c => c.label);

        // Evitar duplicados entre base y csv
        const clienteCols = cabCSV.filter(h => !cabBase.includes(h));
        DATA_GESTIONES_CACHE = [cabBase.concat(clienteCols).concat(cabForm)];
      }

      if (DATA_GESTIONES_CACHE && DATA_GESTIONES_CACHE.length > 0) {
        const cabReporte = DATA_GESTIONES_CACHE[0];
        let nuevaFilaSim = new Array(cabReporte.length).fill("");

        // Mapear campos base
        cabReporte.forEach((hr, idxR) => {
          let hLow = hr.toString().toLowerCase().trim();
          if (hLow === "resultado") nuevaFilaSim[idxR] = resultado;
          if (hLow === "usuario") nuevaFilaSim[idxR] = USUARIO_ACTUAL;
          if (hLow === "campaña" || hLow === "campana") nuevaFilaSim[idxR] = CAMPANA_OPERANDO.nombre;
          if (hLow === "fecha") nuevaFilaSim[idxR] = new Date();

          // Buscar en CSV
          const cabCSV = DATA_CACHE_OPERADOR[0];
          const idxCSV = cabCSV.findIndex(h => h.toLowerCase().trim() === hLow);
          if (idxCSV !== -1) {
            nuevaFilaSim[idxR] = registroParaGuardar[idxCSV];
          }

          // Buscar en Form Data (Respuestas del operador)
          if (formData[hr]) {
            nuevaFilaSim[idxR] = formData[hr];
          }
        });

        DATA_GESTIONES_CACHE.push(nuevaFilaSim);
      }
    }

    manejarExitoUI(RESPUESTA_GENERAL_ACTIVA, isEx);

    if (CAMPANA_OPERANDO.tipoCampana !== 'Entrante' && CAMPANA_OPERANDO.tipoAsignacion === 'Incidencias' && RESPUESTA_GENERAL_ACTIVA) {
      let totalEnviados = 0;
      let totalEsperados = REGISTROS_INCIDENCIAS_ACTUALES.length;

      REGISTROS_INCIDENCIAS_ACTUALES.forEach((registroFila) => {
        let dataFinal = Object.assign({}, formData);
        csvHeaders.forEach((h, i) => {
          dataFinal[h] = registroFila[i];
        });

        google.script.run
          .withSuccessHandler(function () {
            totalEnviados++;
            if (totalEnviados === totalEsperados) {
              showToast("Todas las incidencias guardadas.", "success");
            }
          })
          .withFailureHandler(function (err) {
            showToast("Error en lote: " + err, "danger");
            console.error(err);
          })
          .registrarGestion(CAMPANA_OPERANDO.nombre, resultado, dataFinal, USUARIO_ACTUAL, csvHeaders, preguntasOrdenadas, CAMPANA_OPERANDO.tipoCampana);
      });
    } else {
      let dataFinal = Object.assign({}, formData);
      if (CAMPANA_OPERANDO.tipoCampana !== 'Entrante') {
        csvHeaders.forEach((h, i) => {
          dataFinal[h] = registroParaGuardar ? registroParaGuardar[i] : "";
        });
      }

      google.script.run
        .withSuccessHandler(function () {
          showToast("Gestión guardada con éxito", "success");
        })
        .withFailureHandler(function (err) {
          showToast("FALLO AL GUARDAR: " + err, "danger");
          // Opción de recuperación si falla
          console.error("Error crítico guardando:", err);
        })
        .registrarGestion(CAMPANA_OPERANDO.nombre, resultado, dataFinal, USUARIO_ACTUAL, csvHeaders, preguntasOrdenadas, CAMPANA_OPERANDO.tipoCampana);
    }
  }

  function mostrarSeccion(seccion) {
    const btnFormularios = document.getElementById('btn-nav-formularios');
    const btnUsuarios = document.getElementById('btn-nav-usuarios');
    const btnSalientes = document.getElementById('btn-nav-campanas-salientes');
    const btnEntrantes = document.getElementById('btn-nav-campanas-entrantes');
    const btnSupervisor = document.getElementById('btn-nav-supervisor');
    const btnRanking = document.getElementById('btn-nav-ranking');
    const btnDashboard = document.getElementById('btn-nav-dashboard');

    if (btnFormularios) btnFormularios.classList.remove('active');
    if (btnUsuarios) btnUsuarios.classList.remove('active');
    if (btnSalientes) btnSalientes.classList.remove('active');
    if (btnEntrantes) btnEntrantes.classList.remove('active');
    if (btnSupervisor) btnSupervisor.classList.remove('active');
    if (btnRanking) btnRanking.classList.remove('active');
    if (btnDashboard) btnDashboard.classList.remove('active');

    document.getElementById('seccion-campanas').style.display = seccion.startsWith('campanas') ? 'block' : 'none';
    document.getElementById('seccion-formularios').style.display = seccion === 'formularios' ? 'block' : 'none';
    document.getElementById('seccion-usuarios').style.display = seccion === 'usuarios' ? 'block' : 'none';
    document.getElementById('seccion-supervisor').style.display = seccion === 'supervisor' ? 'block' : 'none';
    document.getElementById('seccion-ranking').style.display = seccion === 'ranking' ? 'block' : 'none';
    const seccionDashboard = document.getElementById('seccion-dashboard');
    if (seccionDashboard) seccionDashboard.style.display = seccion === 'dashboard' ? 'block' : 'none';

    // Detener siempre el refresco del supervisor y dashboard al cambiar de sección
    if (INTERVALO_SUPERVISOR) {
      clearInterval(INTERVALO_SUPERVISOR);
      INTERVALO_SUPERVISOR = null;
    }
    if (typeof Dashboard !== 'undefined' && seccion !== 'dashboard') {
      Dashboard.detener();
    }

    if (seccion.startsWith('campanas')) {
      if (seccion === 'campanas-entrantes') {
        if (btnEntrantes) btnEntrantes.classList.add('active');
        VISTA_CAMPANAS_ACTUAL = 'Entrante';
        document.getElementById('titulo-panel-campanas').innerText = "Panel de Campañas Entrantes";
      } else {
        if (btnSalientes) btnSalientes.classList.add('active');
        VISTA_CAMPANAS_ACTUAL = 'Saliente';
        document.getElementById('titulo-panel-campanas').innerText = "Panel de Campañas Salientes";
      }
      // Limpiar buscador al cambiar de sección de campañas
      const buscador = document.getElementById('buscador-campanas');
      if (buscador) buscador.value = "";

      cargarCampanas();
      regresarALista();
    }
    else if (seccion === 'formularios') {
      if (btnFormularios) btnFormularios.classList.add('active');
      cargarFormularios();
      cancelarEdicionForm();
    }
    else if (seccion === 'usuarios') {
      if (btnUsuarios) btnUsuarios.classList.add('active');
      cancelarEdicionUsuario();
      cargarUsuariosAdministrador();
    }
    else if (seccion === 'supervisor') {
      if (btnSupervisor) btnSupervisor.classList.add('active');
      cargarPanelSupervisor();
      // Auto-refresco cada 30 segundos
      INTERVALO_SUPERVISOR = setInterval(function () { cargarPanelSupervisor(true); }, 30000);
    }
    else if (seccion === 'ranking') {
      if (btnRanking) btnRanking.classList.add('active');
      cargarRanking('daily');
    }
    else if (seccion === 'dashboard') {
      if (btnDashboard) btnDashboard.classList.add('active');
      if (typeof Dashboard !== 'undefined') Dashboard.init();
    }
  }

  // Variable para el intervalo del supervisor
  let INTERVALO_SUPERVISOR = null;

  function descargarDataConsolidada(index) {
    const c = DATOS_CAMPANAS[index];
    mostrarCarga("Generando consolidado general...");
    google.script.run.withSuccessHandler(function (matriz) {
      ocultarCarga();
      if (!matriz || matriz.length === 0) {
        return alert("No hay datos suficientes para generar el consolidado en esta campaña.");
      }
      const ws = XLSX.utils.aoa_to_sheet(matriz);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Consolidado");
      XLSX.writeFile(wb, `Data_General_${c.nombre}.xlsx`);
    }).obtenerDataConsolidada(c.nombre);
  }

  function cargarCampanas() {
    const tabla = document.getElementById('tabla-campanas-body');
    if (!tabla) return;

    if (tabla.innerHTML.trim() === '') {
      tabla.innerHTML = '<tr><td colspan="4" class="text-center">Cargando...</td></tr>';
    }

    google.script.run.withSuccessHandler(function (datos) {
      DATOS_CAMPANAS = datos;
      // Al cargar de nuevo, reseteamos a la página 1 y aplicamos filtros iniciales
      PAGINA_ACTUAL_CAMPANAS = 1;
      filtrarCampanas();
    }).obtenerCampanas();
  }

  function evaluarBusqueda(e) {
    const buscador = document.getElementById('buscador-campanas');
    const btnClear = document.getElementById('btn-clear-campanas');
    if (buscador && btnClear) {
      btnClear.style.display = buscador.value.length > 0 ? "block" : "none";
    }
    if (e && e.key === "Enter") {
      filtrarCampanas();
    }
    // Opcional: filtrar en tiempo real después de cierto delay o caracteres
    if (buscador && buscador.value.length === 0) filtrarCampanas();
  }

  function limpiarBuscadorCampanas() {
    const buscador = document.getElementById('buscador-campanas');
    if (buscador) {
      buscador.value = "";
      evaluarBusqueda();
      filtrarCampanas();
    }
  }

  function filtrarCampanas() {
    const buscador = document.getElementById('buscador-campanas');
    const termino = buscador ? buscador.value.toLowerCase().trim() : "";

    CAMPANAS_FILTRADAS = DATOS_CAMPANAS.filter(f => {
      const tipo = f.tipoCampana || 'Saliente';
      const coincideTipo = tipo === VISTA_CAMPANAS_ACTUAL;
      if (!coincideTipo) return false;
      if (termino === "") return true;
      const nombre = (f.nombre || "").toLowerCase();
      const desc = (f.descripcion || "").toLowerCase();
      return nombre.includes(termino) || desc.includes(termino);
    });

    PAGINA_ACTUAL_CAMPANAS = 1;
    if (typeof renderizarTablaCampanas === "function") {
      renderizarTablaCampanas();
    }
  }

  function renderizarTablaCampanas() {
    const tabla = document.getElementById('tabla-campanas-body');
    const labelInfo = document.getElementById('info-paginacion-campanas');
    if (!tabla) return;

    const total = CAMPANAS_FILTRADAS.length;
    const inicio = (PAGINA_ACTUAL_CAMPANAS - 1) * ITEMS_POR_PAGINA_CAMPANAS;
    const fin = Math.min(inicio + ITEMS_POR_PAGINA_CAMPANAS, total);
    const dataPagina = CAMPANAS_FILTRADAS.slice(inicio, fin);

    // Actualizar etiqueta de info
    if (labelInfo) {
      if (total > 0) {
        labelInfo.innerHTML = `<span>Mostrando</span> <strong class="text-primary">${inicio + 1}-${fin}</strong> <span>de</span> <strong class="text-dark">${total}</strong> <span>campañas</span>`;
      } else {
        labelInfo.innerHTML = `<span>Sin resultados</span>`;
      }
    }

    let html = '';
    if (!Array.isArray(DATOS_CAMPANAS)) DATOS_CAMPANAS = [];

    dataPagina.forEach((f) => {
      // Búsqueda segura del índice original
      const originalIndex = (DATOS_CAMPANAS || []).findIndex(c => c && c.nombre === f.nombre && c.fila === f.fila);

      const safeRol = (ROL || "").toLowerCase();
      // Sanitizar nombre para evitar que comillas rompan el onclick
      const safeNombre = (f.nombre || "").replace(/'/g, "\\'");

      let badgeTipo = f.tipoCampana === 'Entrante'
        ? '<span class="badge bg-info text-dark ms-2" style="font-size:0.6rem;">ENTRANTE</span>'
        : '<span class="badge bg-secondary ms-2" style="font-size:0.6rem;">SALIENTE</span>';

      html += `
      <tr>
        <td><div class="fw-bold text-dark">${f.nombre} ${badgeTipo}</div><div class="small text-muted">${f.descripcion}</div></td>
        <td><div class="small fw-bold text-primary">${f.fechaInicio}</div><div class="small text-danger">${f.fechaFin}</div></td>
        <td><span class="${f.estatus === "Activa" ? 'badge-active' : 'badge-finished'}">${f.estatus}</span></td>
        <td class="text-end">
          <button class="btn-download-full" title="Descargar Data General Integrada" onclick="descargarDataConsolidada(${originalIndex})"><i class="fas fa-file-download"></i></button>
          <button class="btn-report-view" title="Ver Gestiones" onclick="abrirReporteCampana(${originalIndex})"><i class="fas fa-file-invoice"></i></button>
          <button class="btn-data-view" title="Data" onclick="abrirVistaData(${originalIndex})"><i class="fas fa-database"></i></button>
          <button class="btn-phone-stats" title="Stats" onclick="verEstadisticas(${originalIndex})"><i class="fas fa-chart-pie"></i></button>
          <button class="btn-edit-pencil" title="Editar" onclick="prepararEdicion(${originalIndex})"><i class="fas fa-pencil-alt"></i></button>
          ${safeRol !== 'analista' ? `<button class="btn-delete-item" title="Eliminar" onclick="confirmarBorrado(${f.fila}, '${safeNombre}')"><i class="fas fa-trash-alt"></i></button>` : ''}
        </td>
      </tr>`;
    });

    tabla.innerHTML = html || '<tr><td colspan="4" class="text-center py-4 text-muted">No se encontraron campañas coincidentes</td></tr>';
    renderizarControlesPaginacion();
  }

  function renderizarControlesPaginacion() {
    const contenedor = document.getElementById('paginacion-campanas');
    if (!contenedor) return;

    const totalPaginas = Math.ceil(CAMPANAS_FILTRADAS.length / ITEMS_POR_PAGINA_CAMPANAS);
    if (totalPaginas <= 1) {
      contenedor.innerHTML = "";
      return;
    }

    let html = `
      <button class="btn-pagination nav-btn" ${PAGINA_ACTUAL_CAMPANAS === 1 ? 'disabled' : ''} onclick="cambiarPaginaCampanas(1)" title="Primera página">
        <i class="fas fa-angle-double-left"></i>
      </button>
      <button class="btn-pagination nav-btn" ${PAGINA_ACTUAL_CAMPANAS === 1 ? 'disabled' : ''} onclick="cambiarPaginaCampanas(${PAGINA_ACTUAL_CAMPANAS - 1})" title="Anterior">
        <i class="fas fa-chevron-left"></i>
      </button>
    `;

    // Rango de páginas a mostrar (máximo 5)
    let inicioRango = Math.max(1, PAGINA_ACTUAL_CAMPANAS - 2);
    let finRango = Math.min(totalPaginas, inicioRango + 4);
    if (finRango - inicioRango < 4) inicioRango = Math.max(1, finRango - 4);

    for (let i = inicioRango; i <= finRango; i++) {
      html += `
        <button class="btn-pagination ${i === PAGINA_ACTUAL_CAMPANAS ? 'active' : ''}" onclick="cambiarPaginaCampanas(${i})">
          ${i}
        </button>
      `;
    }

    html += `
      <button class="btn-pagination nav-btn" ${PAGINA_ACTUAL_CAMPANAS === totalPaginas ? 'disabled' : ''} onclick="cambiarPaginaCampanas(${PAGINA_ACTUAL_CAMPANAS + 1})" title="Siguiente">
        <i class="fas fa-chevron-right"></i>
      </button>
      <button class="btn-pagination nav-btn" ${PAGINA_ACTUAL_CAMPANAS === totalPaginas ? 'disabled' : ''} onclick="cambiarPaginaCampanas(${totalPaginas})" title="Última página">
        <i class="fas fa-angle-double-right"></i>
      </button>
    `;

    contenedor.innerHTML = html;
  }

  function cambiarPaginaCampanas(nuevaPagina) {
    const totalPaginas = Math.ceil(CAMPANAS_FILTRADAS.length / ITEMS_POR_PAGINA_CAMPANAS);
    if (nuevaPagina < 1 || nuevaPagina > totalPaginas) return;
    PAGINA_ACTUAL_CAMPANAS = nuevaPagina;
    renderizarTablaCampanas();
    // Scroll suave hacia arriba de la tabla
    document.getElementById('seccion-campanas').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function renderizarOpcionesColumnas(cabeceras) {
    const bloque = document.getElementById('bloque-config-columnas');
    const contenedor = document.getElementById('lista-columnas-data');
    if (!cabeceras || cabeceras.length === 0) {
      bloque.style.display = "none";
      return;
    }

    bloque.style.display = "block";

    const campana = DATOS_CAMPANAS.find(c => c.nombre === CAMPANA_ACTUAL_DATA);
    let configuradas = [];
    let tieneConfiguracion = false;

    if (campana && campana.columnasVisibles) {
      configuradas = campana.columnasVisibles.split(',').map(s => s.trim());
      tieneConfiguracion = true;
    }

    contenedor.innerHTML = cabeceras.map(h => {
      const hTrim = h.trim();
      const isChecked = tieneConfiguracion ? configuradas.includes(hTrim) : true;
      return `
        <div class="form-check form-switch custom-switch-columna">
            <input class="form-check-input col-vis-check" type="checkbox" value="${hTrim}" id="col_${hTrim.replace(/\s+/g, '_')}" ${isChecked ? 'checked' : ''}>
            <label class="form-check-label small fw-bold" for="col_${hTrim.replace(/\s+/g, '_')}">${hTrim}</label>
        </div>
        `;
    }).join('');
  }

  function guardarConfigColumnas() {
    const checkboxes = document.querySelectorAll('.col-vis-check');
    const seleccionadas = Array.from(checkboxes).filter(cb => cb.checked).map(cb => cb.value);
    const columnasStr = seleccionadas.join(',');

    mostrarCarga("Guardando configuración...");
    google.script.run.withSuccessHandler(function (res) {
      ocultarCarga();
      if (res.success) {
        alert("Configuración de columnas guardada con éxito.");
        const idx = DATOS_CAMPANAS.findIndex(c => c.nombre === CAMPANA_ACTUAL_DATA);
        if (idx !== -1) DATOS_CAMPANAS[idx].columnasVisibles = columnasStr;
      } else {
        alert("Error al guardar la configuración.");
      }
    }).guardarConfiguracionColumnas(CAMPANA_ACTUAL_DATA, columnasStr);
  }

  function procesarArchivoData() {
    const fileInput = document.getElementById('input-archivo-data');
    if (fileInput.files.length === 0) return alert("Selecciona un archivo");
    document.getElementById('loading-data').style.display = "block";
    const file = fileInput.files[0];
    const reader = new FileReader();
    reader.onload = function (e) {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      const sheet = workbook.Sheets[workbook.SheetNames[0]];
      const matriz = XLSX.utils.sheet_to_json(sheet, { header: 1 });
      google.script.run.withSuccessHandler(function () {
        document.getElementById('loading-data').style.display = "none";
        renderDataExistente(matriz);
        alert("Data cargada y organizada en Drive");
      }).procesarDataCampaña(CAMPANA_ACTUAL_DATA, matriz);
    };
    reader.readAsArrayBuffer(file);
  }

  function actualizarListaDistribucion(savedData = null) {
    const tipo = document.getElementById('campana-tipo-asignacion').value;
    if (tipo !== 'Manual') return;

    const usuarios = Array.from(document.querySelectorAll('.user-checkbox:checked')).map(cb => cb.value);
    const contenedor = document.getElementById('lista-distribucion-operadores');

    if (usuarios.length === 0) {
      contenedor.innerHTML = '<p class="text-muted small text-center m-0 py-2">Selecciona operadores arriba para asignar filas.</p>';
      return;
    }

    let distData = {};
    if (savedData && typeof savedData === 'string') {
      try { distData = JSON.parse(savedData); } catch (e) { }
    } else {
      document.querySelectorAll('.dist-input-rango').forEach(input => {
        distData[input.dataset.user] = input.value;
      });
    }

    contenedor.innerHTML = usuarios.map(u => `
      <div class="d-flex align-items-center mb-2">
        <span class="fw-bold small text-secondary" style="width: 150px;"><i class="fas fa-user me-2"></i>${u}</span>
        <input type="text" class="form-control form-control-sm custom-form-control dist-input-rango" data-user="${u}" placeholder="Ej: 1-30" value="${distData[u] || ''}">
      </div>
    `).join('');
  }

  function autoDistribuirFilas() {
    const total = parseInt(document.getElementById('total-filas-distribuir').value);
    const inputs = document.querySelectorAll('.dist-input-rango');
    if (isNaN(total) || total <= 0) return alert("Ingresa un total válido de filas a distribuir.");
    if (inputs.length === 0) return alert("Selecciona al menos un operador en 'Accesos de Operadores'.");

    const perUser = Math.floor(total / inputs.length);
    let remainder = total % inputs.length;

    let currentStart = 1;
    inputs.forEach(input => {
      let currentEnd = currentStart + perUser - 1;
      if (remainder > 0) { currentEnd++; remainder--; }
      input.value = `${currentStart}-${currentEnd}`;
      currentStart = currentEnd + 1;
    });
  }

  function procesarCampana() {
    const tipoCampana = document.getElementById('campana-tipo-direccion') ? document.getElementById('campana-tipo-direccion').value : "Saliente";
    const tipoAsignacion = document.getElementById('campana-tipo-asignacion').value;

    let distribucionObj = {};
    if (tipoCampana === 'Saliente' && tipoAsignacion === 'Manual') {
      document.querySelectorAll('.dist-input-rango').forEach(input => {
        distribucionObj[input.dataset.user] = input.value;
      });
    }

    const data = {
      fila: document.getElementById('campana-fila').value,
      nombre: document.getElementById('campana-nombre').value,
      descripcion: document.getElementById('campana-descripcion').value,
      dialogo: document.getElementById('campana-dialogo').value,
      fecha: document.getElementById('campana-fecha').value,
      fechaFin: document.getElementById('campana-fecha-fin').value,
      meta: document.getElementById('campana-meta').value,
      sla: document.getElementById('campana-sla').value,
      formularioId: document.getElementById('campana-form-id').value,
      reporteId: document.getElementById('campana-reporte-id').value,
      columnasVisibles: document.getElementById('campana-columnas-visibles').value,
      estatus: document.getElementById('campana-estatus').checked ? "Activa" : "Finalizada",
      usuarios: Array.from(document.querySelectorAll('.user-checkbox:checked')).map(cb => cb.value),
      tipoCampana: tipoCampana,
      tipoAsignacion: tipoCampana === 'Entrante' ? 'Ninguna' : tipoAsignacion,
      distribucion: JSON.stringify(distribucionObj)
    };

    if (!data.nombre) return alert("Por favor ingresa un nombre para la campaña.");

    mostrarCarga("Guardando campaña...");
    google.script.run.withSuccessHandler(function () {
      ocultarCarga();
      document.getElementById('contenedor-editor-campana').style.display = "none";
      document.getElementById('contenedor-lista-campanas').style.display = "block";
      cargarCampanas();
    }).guardarOActualizarCampana(data);
  }

  function verEstadisticas(index) {
    const c = DATOS_CAMPANAS[index];
    document.getElementById('stats-nombre-campana').innerText = c.nombre;
    document.getElementById('contenedor-lista-campanas').style.display = "none";
    document.getElementById('contenedor-stats-campana').style.display = "block";

    const colIncidencias = document.getElementById('col-stat-incidencias');
    if (colIncidencias) {
      colIncidencias.style.display = (c.tipoAsignacion === 'Incidencias') ? 'block' : 'none';
    }

    document.getElementById('tabla-stats-operadores').innerHTML = '<tr><td colspan="5" class="text-center">Cargando datos...</td></tr>';

    if (INTERVALO_ESTADISTICAS) clearInterval(INTERVALO_ESTADISTICAS);
    cargarDataEstadisticas(c.nombre);

    INTERVALO_ESTADISTICAS = setInterval(() => {
      cargarDataEstadisticas(c.nombre);

  function cargarDataEstadisticas(nombreCampana) {

  function actualizarOpcionesDependientes(idDisparador) {
    const selectsTerritorio = document.querySelectorAll('.territory-select');

    // Helper: Build the filter chain traversing upwards
    function getFilterChain(fieldId) {
      let filters = [];
      let currentId = fieldId;
      while (currentId) {
        const input = document.querySelector(`.territory-select[data-id="${currentId}"]`);
        if (!input) break;
        const colIndex = parseInt(input.dataset.fuente, 10);
        if (input.value) filters.push({ colIndex, val: input.value });
        currentId = input.dataset.depende;
      }
      return filters;
    }

    const inputDisparador = document.querySelector(`.territory-select[data-id="${idDisparador}"]`);
    const valorPadre = inputDisparador ? inputDisparador.value : "";

    selectsTerritorio.forEach(sel => {
      if (sel.dataset.depende === idDisparador) {
        sel.innerHTML = '<option value="">Seleccione...</option>';
        sel.value = "";

        if (valorPadre) {
          const pestana = sel.dataset.pestana || "Estados";
          const rawData = (window.FUENTES_DATOS && window.FUENTES_DATOS[pestana]) ? window.FUENTES_DATOS[pestana] : (window.ESTADOS_DATA || []);
          if (!Array.isArray(rawData) || rawData.length === 0) return;

          const filters = getFilterChain(idDisparador);
          let validRows = rawData;
          for (let f of filters) {
            validRows = validRows.filter(r => r[f.colIndex] == f.val);
          }

          const targetCol = parseInt(sel.dataset.fuente, 10);
          const uniques = [...new Set(validRows.map(row => row[targetCol]).filter(Boolean))].sort();
          sel.innerHTML += uniques.map(e => `<option value="${e}">${e}</option>`).join('');
        }

        // Cascading reset downward
        actualizarOpcionesDependientes(sel.dataset.id);
      }
    });
  }
