  function confirmarAgregarCampo() {
    const label = document.getElementById('input-label-nuevo').value;
    if (!label) return alert("Escribe la pregunta");

    let nuevoCampo = {
      id: "campo_" + Date.now(),
      tipo: TIPO_CAMPO_PENDIENTE,
      label: label,
      obligatorio: document.getElementById('campo-obligatorio').checked
    };

    // Recoger conf. avanzada
    const seccion = document.getElementById('campo-seccion').value;
    const minLength = document.getElementById('campo-min-length').value;
    const maxLength = document.getElementById('campo-max-length').value;

    if (seccion) nuevoCampo.seccion = seccion;
    if (minLength) nuevoCampo.minLength = parseInt(minLength);
    if (maxLength) nuevoCampo.maxLength = parseInt(maxLength);

    if (TIPO_CAMPO_PENDIENTE === 'guion') {
      nuevoCampo.contenido = document.getElementById('campo-guion-contenido').value;
      nuevoCampo.requiereConfirmacion = document.getElementById('campo-guion-confirmacion').checked;
      nuevoCampo.obligatorio = false; // Guion base no es obligatorio
    }
    if (['checkbox', 'radio'].includes(TIPO_CAMPO_PENDIENTE)) {
      let opciones = [];
      document.querySelectorAll('.opt-multi-val').forEach(input => { if (input.value.trim()) opciones.push(input.value.trim()); });
      if (opciones.length === 0) return alert("Agrega opciones");
      nuevoCampo.opciones = opciones;
    }
    if (TIPO_CAMPO_PENDIENTE === 'select_busqueda') {
      nuevoCampo.nombrePestana = document.getElementById('campo-territorio-pestana').value;
      nuevoCampo.fuenteTerritorio = document.getElementById('campo-territorio-fuente').value;
      nuevoCampo.dependeDe = document.getElementById('campo-territorio-depende').value;
    }
    if (['cascada', 'checkbox', 'radio'].includes(TIPO_CAMPO_PENDIENTE)) {
      let saltos = [];
      document.querySelectorAll('.ivr-row').forEach(row => {
        let v = row.querySelector('.ivr-val').value;
        let d = row.querySelector('.ivr-dest').value;
        let especiales = [];
        row.querySelectorAll('.regla-especial').forEach(reg => {
          let acc = reg.querySelector('.esp-accion').value;
          let cmps = Array.from(reg.querySelector('.esp-campos').selectedOptions).map(o => o.value);
          if (cmps.length > 0) especiales.push({ accion: acc, campos: cmps });
        });
        if (v) saltos.push({ opcion: v, destino: d, especiales: especiales });
      });
      nuevoCampo.saltos = saltos;
    }

    if (CAMPO_EDITANDO_INDEX !== null) {
      nuevoCampo.id = CAMPOS_FORMULARIO[CAMPO_EDITANDO_INDEX].id;
      CAMPOS_FORMULARIO[CAMPO_EDITANDO_INDEX] = nuevoCampo;
      CAMPO_EDITANDO_INDEX = null;
    } else {
      CAMPOS_FORMULARIO.push(nuevoCampo);
    }

    cancelarNuevoCampo();
    renderizarCampos();
  }

  function renderizarFormularioOperador(campos) {
    const cont = document.getElementById('op-formulario-dinamico');
    if (!campos || campos.length === 0) {
      cont.innerHTML = '<div class="alert alert-warning">Esta campaña no tiene un formulario de captura asignado.</div>';
      return;
    }

    // Agrupar campos por sección
    const camposPorSeccion = { "sin_seccion": [] };
    if (typeof SECCIONES_FORMULARIO !== 'undefined') {
      SECCIONES_FORMULARIO.forEach(s => camposPorSeccion[s.id] = { nombre: s.nombre, campos: [] });
    }

    campos.forEach(c => {
      if (c.seccion && camposPorSeccion[c.seccion]) {
        camposPorSeccion[c.seccion].campos.push(c);
      } else {
        camposPorSeccion["sin_seccion"].push(c);
      }
    });

    let htmlTotal = '';

    // Función auxiliar para renderizar un campo
    const renderCampo = (c) => {
      const minLengthAttr = c.minLength ? `minlength="${c.minLength}"` : '';
      const maxLengthAttr = c.maxLength ? `maxlength="${c.maxLength}"` : '';

      let html = `<div class="mb-4 op-campo-wrapper" id="wrap_${c.id}" data-id="${c.id}" data-req="${c.obligatorio}"><label class="form-label fw-bold small">${c.label} ${c.obligatorio ? '<span class="text-danger">*</span>' : ''}</label>`;

      if (['texto', 'telefono', 'correo'].includes(c.tipo)) {
        html += `<input type="text" class="form-control custom-form-control field-data" data-label="${c.label}" data-req="${c.obligatorio}" data-id="${c.id}" ${minLengthAttr} ${maxLengthAttr} oninput="checkearSecuencia()">`;
      } else if (c.tipo === 'textarea') {
        html += `<textarea class="form-control custom-form-control field-data" rows="3" data-label="${c.label}" data-req="${c.obligatorio}" data-id="${c.id}" ${minLengthAttr} ${maxLengthAttr} oninput="checkearSecuencia()"></textarea>`;
      } else if (c.tipo === 'fecha') {
        html += `<input type="date" class="form-control custom-form-control field-data" data-label="${c.label}" data-req="${c.obligatorio}" data-id="${c.id}" onchange="checkearSecuencia()">`;
      } else if (c.tipo === 'numerico') {
        html += `<input type="text" inputmode="numeric" class="form-control custom-form-control field-data" data-label="${c.label}" data-req="${c.obligatorio}" data-id="${c.id}" ${minLengthAttr} ${maxLengthAttr} oninput="this.value = this.value.replace(/[^0-9]/g, ''); checkearSecuencia()">`;
      } else if (c.tipo === 'porcentaje') {
        html += `<div class="input-group"><input type="number" class="form-control custom-form-control field-data" data-label="${c.label}" data-req="${c.obligatorio}" data-id="${c.id}" min="0" max="100" oninput="checkearSecuencia()"><span class="input-group-text bg-light">%</span></div>`;
      } else if (c.tipo === 'radio' || c.tipo === 'checkbox') {
        html += `<div class="d-flex flex-wrap gap-3 mt-1">` + c.opciones.map((o, idx) => {
          const salto = (c.saltos || []).find(s => s.opcion === o);
          const dest = salto ? salto.destino : "";
          const esp = JSON.stringify(salto ? salto.especiales : []);
          return `
          <div class="form-check">
            <input class="form-check-input field-data-check" type="${c.tipo}" name="${c.label}" id="${c.id}_${idx}" value="${o}" data-label="${c.label}" data-id="${c.id}" data-dest="${dest}" data-especiales='${esp}' onchange="checkearSecuencia()">
            <label class="form-check-label small" for="${c.id}_${idx}">${o}</label>
          </div>`;
        }).join('') + `</div>`;
      } else if (c.tipo === 'select_busqueda') {
        const pestana = c.nombrePestana || "Estados";
        const colIndex = parseInt(c.fuenteTerritorio || "0", 10);
        const dependeDe = c.dependeDe || "";
        let opcionesHtml = '<option value="">Seleccione...</option>';

        // Carga inicial solo si no depende de nada (es nivel raíz)
        if (!dependeDe) {
          const rawData = (window.FUENTES_DATOS && window.FUENTES_DATOS[pestana]) ? window.FUENTES_DATOS[pestana] : (window.ESTADOS_DATA || []);
          if (Array.isArray(rawData) && rawData.length > 0) {
            const uniques = [...new Set(rawData.map(row => row[colIndex]).filter(Boolean))].sort();
            opcionesHtml += uniques.map(e => `<option value="${e}">${e}</option>`).join('');
          }
        }

        html += `<select class="form-select custom-form-control field-data territory-select" 
                  data-label="${c.label}" 
                  data-req="${c.obligatorio}" 
                  data-id="${c.id}" 
                  data-pestana="${pestana}"
                  data-fuente="${colIndex}" 
                  data-depende="${dependeDe}"
                  onchange="actualizarOpcionesDependientes('${c.id}'); checkearSecuencia()">
                  ${opcionesHtml}
                 </select>`;
      } else if (c.tipo === 'documento_identidad') {
        html += `<div class="d-flex">
                   <select class="form-select custom-form-control w-auto me-1 field-data-prefix" id="pref_${c.id}">
                     <option value="V-">V-</option><option value="E-">E-</option><option value="J-">J-</option><option value="G-">G-</option>
                   </select>
                   <input type="text" inputmode="numeric" class="form-control custom-form-control field-data-doc" data-label="${c.label}" data-req="${c.obligatorio}" data-id="${c.id}" oninput="this.value = this.value.replace(/[^0-9]/g, ''); checkearSecuencia()">
                 </div>`;
      } else if (c.tipo === 'telefono_ve') {
        html += `<div class="d-flex">
                   <select class="form-select custom-form-control w-auto me-1 field-data-prefix" id="pref_${c.id}" onchange="checkearSecuencia()">
                     <option value="">Prefijo</option>
                     <optgroup label="Móvil">
                       ${PREFIJOS_VE.movil.map(p => `<option value="${p}">${p}</option>`).join('')}
                     </optgroup>
                     <optgroup label="Fijo">
                       ${PREFIJOS_VE.fijo.map(p => `<option value="${p}">${p}</option>`).join('')}
                     </optgroup>
                   </select>
                   <input type="text" inputmode="numeric" class="form-control custom-form-control field-data-doc" placeholder="7 dígitos" data-label="${c.label}" data-req="${c.obligatorio}" data-id="${c.id}" oninput="procesarInputTelefonoVE(this, 'pref_${c.id}')">
                 </div>`;
      } else if (c.tipo === 'guion') {
        html += `<div class="p-3 mb-2 bg-light border border-primary border-start-0 border-end-0 border-bottom-0 border-3 rounded shadow-sm">
                   <p class="mb-2 text-dark" style="font-size: 0.95rem; line-height: 1.5;"><i class="fas fa-comment-dots text-primary me-2"></i>${c.contenido || ''}</p>
                 `;
        if (c.requiereConfirmacion) {
          html += `<div class="form-check mt-3">
                     <input class="form-check-input field-data-check" type="checkbox" data-label="Confirmar lectura: ${c.label}" data-req="true" data-id="${c.id}" onchange="checkearSecuencia()">
                     <label class="form-check-label small fw-bold text-primary">He leído esta información al cliente.</label>
                   </div>`;
        }
        html += `</div>`;
      } else if (c.tipo === 'cascada') {
        html += `<select class="form-select custom-form-control field-data" data-label="${c.label}" data-req="${c.obligatorio}" data-id="${c.id}" onchange="checkearSecuencia()">
                  <option value="" data-dest="" data-especiales="[]">Seleccione...</option>
                  ${c.saltos.map(s => `<option value="${s.opcion}" data-dest="${s.destino}" data-especiales='${JSON.stringify(s.especiales || [])}'>${s.opcion}</option>`).join('')}
                </select>`;
      }
      html += `</div>`;
      return html;
    };

    // Renderizar campos sin sección primero
    if (camposPorSeccion["sin_seccion"].length > 0) {
      htmlTotal += camposPorSeccion["sin_seccion"].map(renderCampo).join('');
    }

    // Renderizar secciones (ocultas por defecto si se desea, o visibles si no hay reglas. Dejémoslas visibles y que CSS/JS las oculte si es necesario)
    Object.keys(camposPorSeccion).forEach(secId => {
      if (secId !== "sin_seccion" && camposPorSeccion[secId].campos.length > 0) {
        htmlTotal += `
          <div class="op-seccion-wrapper card mb-4 shadow-sm" id="wrap_sec_${secId}" data-id="${secId}">
            <div class="card-header bg-white py-2">
              <h6 class="mb-0 fw-bold text-primary"><i class="fas fa-folder-open me-2"></i>${camposPorSeccion[secId].nombre}</h6>
            </div>
            <div class="card-body py-3">
              ${camposPorSeccion[secId].campos.map(renderCampo).join('')}
            </div>
          </div>
        `;
      }
    });

    cont.innerHTML = htmlTotal;

    setTimeout(evaluarReglasIntegrales, 50);
    setTimeout(evaluarReglasIntegrales, 200);
    setTimeout(evaluarReglasIntegrales, 500);
  }

  function renderizarCampos() {
    const cont = document.getElementById('contenedor-campos-dinamicos');
    if (CAMPOS_FORMULARIO.length === 0) { cont.innerHTML = '<p class="text-muted text-center py-5">Sin campos.</p>'; return; }
    cont.innerHTML = CAMPOS_FORMULARIO.map((c, i) => {
      let inputHTML = "";
      if (c.tipo === 'cascada') {
        inputHTML = `<div class="row g-1">` + c.saltos.map(s => {
          let badgeAcc = s.especiales && s.especiales.length > 0 ? ` <i class="fas fa-bolt text-warning" title="Tiene Reglas"></i>` : '';
          return `<div class="col-6 small"><span class="badge bg-light text-dark border w-100">${s.opcion} ➔ ${s.destino || 'Sig.'}${badgeAcc}</span></div>`;
        }).join('') + `</div>`;
      } else if (['checkbox', 'radio'].includes(c.tipo)) {
        inputHTML = `<div class="d-flex flex-wrap gap-2">` + c.opciones.map(o => `<div class="form-check"><input class="form-check-input" type="${c.tipo}" disabled> <label class="small">${o}</label></div>`).join('') + `</div>`;
      } else if (c.tipo === 'select_busqueda') {
        inputHTML = `<select class="form-select form-select-sm" disabled><option>Buscar opción (Desplegable)...</option></select>`;
      } else if (c.tipo === 'guion') {
        inputHTML = `<div class="p-2 bg-warning bg-opacity-10 border-start border-warning border-4 small text-muted"><i class="fas fa-comment-dots me-2"></i> Bloque de lectura para operador</div>`;
      } else if (c.tipo === 'textarea') {
        inputHTML = `<textarea class="form-control form-control-sm" rows="2" placeholder="Área de texto largo" readonly></textarea>`;
      } else if (c.tipo === 'documento_identidad') {
        inputHTML = `<div class="d-flex"><select class="form-select form-select-sm w-auto me-1" disabled><option>V-</option></select><input type="text" class="form-control form-control-sm" placeholder="12345678" readonly></div>`;
      } else if (c.tipo === 'telefono_ve') {
        inputHTML = `<div class="d-flex"><select class="form-select form-select-sm w-auto me-1" disabled><option>0412</option></select><input type="text" class="form-control form-control-sm" placeholder="1234567" readonly></div>`;
      } else if (c.tipo === 'porcentaje') {
        inputHTML = `<div class="input-group input-group-sm"><input type="number" class="form-control" placeholder="0" readonly><span class="input-group-text">%</span></div>`;
      } else {
        inputHTML = `<input type="text" class="form-control form-control-sm" placeholder="Vista previa" readonly>`;
      }

      let seccionBadge = '';
      if (c.seccion) {
        const sec = SECCIONES_FORMULARIO.find(s => s.id === c.seccion);
        if (sec) seccionBadge = `<span class="badge bg-secondary ms-2" style="font-size: 0.65rem;"><i class="fas fa-folder me-1"></i>${sec.nombre}</span>`;
      }

      return `<div class="tag-item">
                <div class="d-flex justify-content-between align-items-center">
                  <div class="w-100 d-flex align-items-start">
                    <i class="fas fa-grip-vertical text-muted me-3 mt-1 drag-handle" style="cursor: grab; font-size: 1.2rem;"></i>
                    <div class="w-100">
                      <div class="tag-label"><i class="fas fa-dot-circle text-primary me-2"></i>${c.label} ${c.obligatorio ? '<span class="text-danger">*</span>' : ''} ${seccionBadge}</div>
                      <div class="preview-field-container">${inputHTML}</div>
                    </div>
                  </div>
                  <div class="d-flex ms-2">
                    <button class="btn btn-sm btn-outline-primary border-0" title="Editar" onclick="editarCampoForm(${i})"><i class="fas fa-edit"></i></button>
                    <button class="btn btn-sm btn-outline-danger border-0 ms-1" title="Eliminar" onclick="CAMPOS_FORMULARIO.splice(${i},1);renderizarCampos()"><i class="fas fa-trash"></i></button>
                  </div>
                </div>
              </div>`;
    }).join('');

    new Sortable(cont, {
      animation: 150,
      handle: '.drag-handle',
      onEnd: function (evt) {
        const itemEl = CAMPOS_FORMULARIO.splice(evt.oldIndex, 1)[0];
        CAMPOS_FORMULARIO.splice(evt.newIndex, 0, itemEl);
      }
    });
  }

  function guardarFormulario() {
    const nombre = document.getElementById('nuevo-form-nombre').value, fila = document.getElementById('form-fila').value;
    if (!nombre || CAMPOS_FORMULARIO.length === 0) return alert("Faltan datos");

    mostrarCarga("Guardando formulario...");
    const payload = { campos: CAMPOS_FORMULARIO, secciones: SECCIONES_FORMULARIO || [] };

    google.script.run.withSuccessHandler(function () {
      ocultarCarga();
      mostrarSeccion('formularios');
      cargarFormularios(); // Fuerza la recarga del caché local
    }).guardarNuevoFormulario(nombre, payload, fila);
  }

  function guardarUsuario() {
    const fila = document.getElementById('nuevo-user-fila').value;
    const u = document.getElementById('nuevo-user-nombre').value;
    const p = document.getElementById('nuevo-user-pass').value;
    const r = document.getElementById('nuevo-user-rol').value;
    const t = document.getElementById('nuevo-user-turno').value;
    const pr = document.getElementById('nuevo-user-permiso-reporte').checked ? "S" : "N";

    if (!u || !p) return alert("Por favor, llena los campos de usuario y contraseña.");

    mostrarCarga("Guardando usuario...");
    if (fila) {
      google.script.run.withSuccessHandler(function (res) {
        ocultarCarga();
        if (res.success) {
          alert("Usuario actualizado exitosamente");
          cancelarEdicionUsuario();
          cargarUsuariosAdministrador();
        } else {
          alert("Error: " + res.mensaje);
        }
      }).actualizarUsuario(fila, u, p, r, t, pr);
    } else {
      google.script.run.withSuccessHandler(function () {
        ocultarCarga();
        alert("Usuario Registrado Exitosamente");
        cancelarEdicionUsuario();
        cargarUsuariosAdministrador();
      }).guardarNuevoUsuario(u, p, r, t, pr);
    }
  }

  function prepararEdicionUsuario(fila, u, p, r, t) {
    document.getElementById('nuevo-user-fila').value = fila;
    document.getElementById('nuevo-user-nombre').value = u;
    document.getElementById('nuevo-user-pass').value = p;
    document.getElementById('nuevo-user-rol').value = r;
    document.getElementById('nuevo-user-turno').value = t ? t.toLowerCase() : "mañana";
    document.getElementById('nuevo-user-permiso-reporte').checked = (arguments[5] === true || arguments[5] === "S");

    document.getElementById('titulo-form-usuario').innerHTML = '<i class="fas fa-user-edit me-2"></i>Editar Usuario: ' + u;
    document.getElementById('btn-guardar-usuario').innerHTML = '<i class="fas fa-save me-2"></i> Actualizar';
    document.getElementById('btn-cancelar-edicion-usuario').style.display = 'block';
  }

  function cancelarEdicionUsuario() {
    document.getElementById('nuevo-user-fila').value = "";
    document.getElementById('nuevo-user-nombre').value = "";
    document.getElementById('nuevo-user-pass').value = "";
    document.getElementById('nuevo-user-rol').value = "admin";
    document.getElementById('nuevo-user-turno').value = "mañana";
    document.getElementById('nuevo-user-permiso-reporte').checked = false;

    document.getElementById('titulo-form-usuario').innerHTML = '<i class="fas fa-user-plus me-2"></i>Crear Nuevo Usuario';
    document.getElementById('btn-guardar-usuario').innerHTML = '<i class="fas fa-save me-2"></i> Registrar';
    document.getElementById('btn-cancelar-edicion-usuario').style.display = 'none';
  }

  function cargarUsuariosAdministrador() {
    const tabla = document.getElementById('tabla-usuarios-body');
    if (!tabla) return;

    if (tabla.innerHTML.trim() === '') {
      tabla.innerHTML = '<tr><td colspan="5" class="text-center">Cargando usuarios...</td></tr>';
    }

    google.script.run.withSuccessHandler(function (datos) {
      tabla.innerHTML = datos.map((u) => `
        <tr>
          <td class="fw-bold">${u.usuario}</td>
          <td>${u.password}</td>
          <td><span class="badge-role">${u.rol}</span></td>
          <td><span class="badge bg-light text-dark border">${u.turno ? u.turno.toUpperCase() : 'NO ASIGNADO'}</span></td>
          <td class="text-center"><i class="fas ${u.permisoReporte ? 'fa-check-circle text-success' : 'fa-times-circle text-danger'}"></i></td>
          <td class="text-end">
            <button class="btn-edit-pencil" title="Editar" onclick="prepararEdicionUsuario(${u.fila}, '${u.usuario}', '${u.password}', '${u.rol}', '${u.turno}', ${u.permisoReporte})"><i class="fas fa-pencil-alt"></i></button>
            <button class="btn-delete-item" title="Eliminar" onclick="confirmarBorradoUsuario(${u.fila}, '${u.usuario}')"><i class="fas fa-trash-alt"></i></button>
          </td>
        </tr>`).join('') || '<tr><td colspan="6" class="text-center">No hay usuarios registrados</td></tr>';
    }).obtenerTodosLosUsuarios();
  }

  function confirmarBorradoUsuario(fila, nombre) {
    if (confirm("¿Seguro que deseas eliminar al usuario: " + nombre + "?")) {
      mostrarCarga("Eliminando usuario...");
      google.script.run.withSuccessHandler(function (res) {
        ocultarCarga();
        if (res.success) {
          cargarUsuariosAdministrador();
        } else {
          alert("No se pudo eliminar el usuario.");
        }
      }).eliminarUsuario(fila);
    }
  }

  function inicializarApp() {
    if (typeof PREVIEW_FORM_NAME !== 'undefined' && PREVIEW_FORM_NAME !== "") {
      document.getElementById('login-page').style.display = "none";
      document.getElementById('home-page').style.display = "block";

      const sidebarAdmin = document.getElementById('sidebar-admin');
      const sidebarOp = document.getElementById('sidebar-operador');
      if (sidebarAdmin) sidebarAdmin.style.display = "none";
      if (sidebarOp) sidebarOp.style.display = "none";
      document.querySelector('.main-content').style.marginLeft = "0";

      document.getElementById('vista-admin').style.display = "none";
      document.getElementById('vista-operador').style.display = "block";
      document.getElementById('seccion-mis-campanas').style.display = "none";
      document.getElementById('seccion-gestion-llamada').style.display = "block";

      document.getElementById('header-campana-unica').style.display = "block";
      document.getElementById('nombre-campana-cabecera').innerText = "VISTA PREVIA: " + PREVIEW_FORM_NAME;
      document.getElementById('btn-volver-operador').style.display = "none";
      document.getElementById('contador-registros-operador').innerText = "MODO PRUEBA";
      document.getElementById('op-dialogo-texto').innerText = "Diálogo de prueba. Aquí el operador vería el guion asignado a la campaña.";
      document.getElementById('op-cliente-info').innerHTML = '<div class="alert alert-info py-2 small m-0">Datos simulados. Usa el botón de buscar o escribe algo para probar.</div>';

      window.buscarPorTelefono = function () {
        const tel = document.getElementById('busqueda-telefono').value.trim() || "12345678";
        document.getElementById('op-cliente-info').innerHTML = `
              <div class="data-item-row"><span class="data-item-label">Teléfono:</span><span class="data-item-value info-cliente-val" data-key="Teléfono">${tel}</span></div>
              <div class="data-item-row"><span class="data-item-label">Nombre:</span><span class="data-item-value info-cliente-val" data-key="Nombre">Cliente de Prueba</span></div>
          `;
      };

      window.finalizarGestion = function () {
        let error = false;
        const camposInputs = document.querySelectorAll('.field-data');
        camposInputs.forEach(i => {
          if (!i.disabled && i.dataset.req === "true" && !i.value) error = true;
        });
        if (error) return alert("Aún hay campos obligatorios vacíos.");

        alert("¡Excelente! Las reglas de negocio se completaron. (Esto es una prueba, no se guardó en Drive).");
        document.querySelectorAll('.field-data').forEach(i => i.value = "");
        document.querySelectorAll('.field-data-check').forEach(i => i.checked = false);
        checkearSecuencia();
      };

      mostrarCarga("Cargando formulario de prueba...");
      google.script.run.withSuccessHandler(function (data) {
        ocultarCarga();
        const campos = Array.isArray(data) ? data : (data.campos || []);
        SECCIONES_FORMULARIO = Array.isArray(data) ? [] : (data.secciones || []);
        CAMPOS_FORM_ACTUAL = campos;
        renderizarFormularioOperador(campos);
      }).obtenerFormularioPorNombre(PREVIEW_FORM_NAME);

    } else {
      verificarSesion();
    }
  }

  function verificarSesion() {
    const savedUser = localStorage.getItem('usuario_briana');
    const savedRol = localStorage.getItem('rol_briana');
    const savedExt = localStorage.getItem('extension_briana');

    if (savedUser && savedRol) {
      ROL = savedRol;
      USUARIO_ACTUAL = savedUser;

      document.getElementById('login-page').style.display = "none";
      document.getElementById('home-page').style.display = "block";

      iniciarEscuchaRefresco();

      if (ROL === "admin" || ROL.toLowerCase() === "analista") {
        document.getElementById('sidebar-admin').style.display = "flex";
        document.getElementById('vista-admin').style.display = "block";
        document.getElementById('label-rol-admin').innerText = (ROL.toLowerCase() === "analista" ? "ANALISTA: " : "ADMIN: ") + USUARIO_ACTUAL;

        if (ROL.toLowerCase() === "analista") {
          document.getElementById('btn-nav-usuarios').style.display = "none";
        } else {
          document.getElementById('btn-nav-usuarios').style.display = "flex";
        }

        mostrarSeccion('campanas-salientes');
      } else {
        document.getElementById('sidebar-operador').style.display = "flex";
        document.getElementById('vista-operador').style.display = "block";
        document.getElementById('label-rol-operador').innerText = "OPERADOR: " + USUARIO_ACTUAL;

        const labelExt = document.getElementById('label-extension-operador');
        if (labelExt) {
          const storedExt = localStorage.getItem('extension_briana');
          labelExt.innerText = "EXTENSIÓN: " + (storedExt || "N/A");
          labelExt.style.setProperty('display', 'block', 'important');
        }

        mostrarSeccionOperador('mis-campanas');
      }
    }
  }

  function deseleccionarTodosUsuarios() {

  function descargarReporteReactivacion() {
    const seleccionadas = Array.from(document.querySelectorAll('.reac-check:checked')).map(c => c.value);
    if (seleccionadas.length === 0) {
      alert('Selecciona al menos una campaña para generar el reporte.');
      return;
    }

    const btn = document.getElementById('btn-descargar-reactivacion');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Generando…';

    google.script.run
      .withSuccessHandler(function (data) {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-file-excel me-2"></i>Descargar Reporte Excel';

        if (!data || data.error) {
          alert('Error: ' + (data ? data.error : 'Sin respuesta del servidor.'));
          return;
        }

        if (data.length <= 1) {
          alert('No se encontraron contactos reactivables con los criterios actuales en las campañas seleccionadas.');
          return;
        }

        // Generar el Excel con XLSX
        const ws = XLSX.utils.aoa_to_sheet(data);

        // Estilo del encabezado (negrita, fondo violeta)
        const range = XLSX.utils.decode_range(ws['!ref']);
        for (let C = range.s.c; C <= range.e.c; C++) {
          const cellAddr = XLSX.utils.encode_cell({ r: 0, c: C });
          if (!ws[cellAddr]) continue;
          ws[cellAddr].s = {
            fill: { fgColor: { rgb: "7C3AED" } },
            font: { bold: true, color: { rgb: "FFFFFF" } },
            alignment: { horizontal: "center" }
          };
        }

        // Autofit column widths
        const colWidths = data[0].map((_, ci) =>
          ({ wch: Math.min(40, Math.max(15, ...data.map(row => (row[ci] || '').toString().length))) })
        );
        ws['!cols'] = colWidths;

        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Reactivación');

        const fecha = new Date().toISOString().slice(0, 10);
        XLSX.writeFile(wb, `Reporte_Reactivacion_${fecha}.xlsx`);

        // Cerrar modal
        const modalEl = document.getElementById('modalReactivacion');
        if (bootstrap.Modal.getInstance(modalEl)) {
          bootstrap.Modal.getInstance(modalEl).hide();
        }
      })
      .withFailureHandler(function (err) {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-file-excel me-2"></i>Descargar Reporte Excel';
        alert('Error al conectar con el servidor: ' + err.message);
      })
      .obtenerReporteReactivacion(seleccionadas);
  }

  // ===== RANKING =====
  function cargarRanking(tipo, fInicio = null, fFin = null) {
    const titulo = document.getElementById('titulo-ranking');
    if (tipo === 'daily') titulo.innerText = 'Ranking del Día';
    else if (tipo === 'weekly') titulo.innerText = 'Ranking de la Semana';
    else if (tipo === 'mensual') titulo.innerText = 'Ranking del Mes';
    else if (tipo === 'historico') titulo.innerText = 'Ranking Histórico Total';
    else if (tipo === 'rango') titulo.innerText = `Ranking por Rango (${fInicio || 'Inicio'} al ${fFin || 'Fin'})`;

    mostrarCarga("Cargando ranking y estadísticas...");

    google.script.run.withSuccessHandler(function (data) {
      ocultarCarga();

      const tbody = document.getElementById('tabla-ranking-body');

      if (data.error) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-danger">${data.error}</td></tr>`;
        return;
      }

      if (!data.ranking || data.ranking.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-muted text-center">No hay datos para el período seleccionado</td></tr>`;
        return;
      }

      tbody.innerHTML = data.ranking.map(r => {
        let posicionClass = '';
        if (r.posicion === 1) posicionClass = 'text-warning';
        else if (r.posicion === 2) posicionClass = 'text-secondary';
        else if (r.posicion === 3) posicionClass = 'text-danger';

        return `
        <tr>
          <td><span class="fw-bold ${posicionClass}">#${r.posicion}</span></td>
          <td>${r.usuario}</td>
          <td class="text-center"><span class="badge bg-success">${r.exitosas}</span></td>
          <td class="text-center"><span class="badge bg-danger">${r.fallidas}</span></td>
          <td class="text-center"><span class="badge bg-primary">${r.total}</span></td>
          <td class="text-center"><span class="badge bg-${parseFloat(r.efectividad) >= 50 ? 'success' : 'warning'}">${r.efectividad}%</span></td>
        </tr>
      `;
      }).join('');

    }).withFailureHandler(function (err) {
      ocultarCarga();
      alert("Error al cargar ranking: " + err.message);
    }).obtenerRankingOperadores(tipo, fInicio, fFin);

    // También cargar heatmap con los mismos filtros
    cargarHeatmap(tipo, fInicio, fFin);
  }

  function cargarRankingRango() {
    const fInicio = document.getElementById('ranking-fecha-inicio').value;
    const fFin = document.getElementById('ranking-fecha-fin').value;

    if (!fInicio && !fFin) {
      alert("Por favor, seleccione al menos una fecha (Inicio o Fin) para filtrar el rango.");
      return;
    }

    cargarRanking('rango', fInicio, fFin);
  }

  function cargarHeatmap(tipoRango = 'historico', fInicio = null, fFin = null) {
    google.script.run.withSuccessHandler(function (data) {
      const container = document.getElementById('heatmap-horarios');

      if (data.error || !data.heatmap) {
        container.innerHTML = '<p class="text-muted">No hay datos disponibles</p>';
        return;
      }

      container.innerHTML = data.heatmap.map(h => {
        const efectividad = parseFloat(h.efectividad);
        const totalLlamadas = parseInt(h.total);

        let bgColor1 = '';
        let bgColor2 = '';

        // Colores directos para evitar problemas con variables CSS no definidas
        if (efectividad >= 60) { bgColor1 = '#10b981'; bgColor2 = '#059669'; } // Verde (Exito)
        else if (efectividad >= 40) { bgColor1 = '#f59e0b'; bgColor2 = '#d97706'; } // Naranja (Advertencia)
        else if (efectividad > 0) { bgColor1 = '#ef4444'; bgColor2 = '#dc2626'; } // Rojo (Peligro)
        else { bgColor1 = '#e2e8f0'; bgColor2 = '#cbd5e1'; } // Gris claro (Sin efectividad o 0 llamadas)

        const textColor = totalLlamadas > 0 && efectividad > 0 ? 'text-white' : 'text-dark';
        const opacityClass = totalLlamadas === 0 ? 'opacity-50' : '';

        return `
        <div class="text-center p-2 rounded shadow-sm ${opacityClass}" style="min-width: 75px; background: linear-gradient(135deg, ${bgColor1}, ${bgColor2}); border: 1px solid rgba(0,0,0,0.05);">
          <div class="${textColor} fw-bold" style="font-size: 0.85rem;">${h.hora}</div>
          <div class="${textColor}" style="font-size: 0.7rem;">${h.total} llamadas</div>
          <div class="badge bg-white text-dark mt-1 shadow-sm" style="font-size: 0.75rem;">${h.efectividad}%</div>
        </div>
      `;
      }).join('');
    }).obtenerHeatmapHorarios(null, tipoRango, fInicio, fFin);
  }

  // --- SISTEMA DE NOTIFICACIONES GLOBAL (TOASTS) ---
  function showToast(mensaje, tipo = "info") {
    let container = document.getElementById('toast-container');
    if (!container) {
      container = document.createElement('div');
      container.id = 'toast-container';
      container.style.cssText = 'position: fixed; top: 20px; right: 20px; z-index: 9999;';
      document.body.appendChild(container);
    }

    const toast = document.createElement('div');
    const colorClass = tipo === 'danger' ? 'bg-danger' : (tipo === 'success' ? 'bg-success' : 'bg-primary');
    toast.className = `toast-briana show align-items-center text-white ${colorClass} border-0 mb-2`;
    toast.style.cssText = 'min-width: 250px; padding: 15px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); animation: slideIn 0.3s ease-out; transition: opacity 0.5s ease;';
    toast.innerHTML = `
      <div class="d-flex">
        <div class="toast-body">
          <i class="fas ${tipo === 'danger' ? 'fa-exclamation-triangle' : 'fa-check-circle'} me-2"></i> ${mensaje}
        </div>
        <button type="button" class="btn-close btn-close-white ms-auto me-2" onclick="this.closest('.toast-briana').remove()"></button>
      </div>
    `;

    container.appendChild(toast);
    setTimeout(() => {
      if (toast.parentElement) toast.style.opacity = '0';
      setTimeout(() => { if (toast.parentElement) toast.remove(); }, 500);
    }, 4000);
  }
